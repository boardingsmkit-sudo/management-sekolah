KSC.jd={loading:false,raw:{},missing:new Set(),submitting:false,cfg:{
  key:'jd',prefix:'jd',table:'schedules',title:'Jadwal',arr:schedulesData,sortKey:'hari',needClasses:true,
  sortFn:(a,b)=>HARI_LIST.indexOf(a.hari)-HARI_LIST.indexOf(b.hari)||String(a.jamMulai).localeCompare(String(b.jamMulai))||akUnesc(a.kelas).localeCompare(akUnesc(b.kelas)),
  writeRoles:AK_ADMIN,deleteRoles:AK_ADMIN,
  fields:[
    {k:'class_id',label:'Kelas',type:'class',req:true},
    {k:'hari',label:'Hari',type:'select',opts:HARI_LIST,req:true},
    {k:'jam_mulai',label:'Jam Mulai',type:'time',req:true},
    {k:'jam_selesai',label:'Jam Selesai',type:'time',req:true},
    {k:'mapel',label:'Mata Pelajaran',type:'text',req:true,max:80,list:()=>[...new Set(schedulesData.map(s=>akUnesc(s.mapel)))].sort()},
    {k:'guru',label:'Guru Pengampu',type:'text',req:true,max:80,list:()=>[...new Set(schedulesData.map(s=>akUnesc(s.guru)))].sort(),ph:'Ketik nama persis seperti nama akun guru'},
    {k:'ruang',label:'Ruang',type:'text',max:40,list:()=>[...new Set(schedulesData.map(s=>akUnesc(s.ruang)).filter(x=>x&&x!=='-'))].sort()},
    {k:'tahun_ajaran',label:'Tahun Ajaran',type:'text',req:true,max:9,ph:'2026/2027',def:()=>akDefaultPeriod().ta},
    {k:'semester',label:'Semester',type:'select',opts:['Ganjil','Genap'],req:true,def:()=>akDefaultPeriod().sem},
    {k:'status',label:'Status',type:'select',opts:['Aktif','Pengganti'],req:true,def:'Aktif'}
  ],
  validate:(p,id)=>{
    if(!akValidTA(p.tahun_ajaran)) return 'Tahun ajaran harus berformat 2026/2027 (tahun kedua = tahun pertama + 1).';
    if(p.jam_selesai<=p.jam_mulai) return 'Jam selesai harus setelah jam mulai.';
    const low=s=>String(s||'').trim().toLowerCase();
    /* Gabungan kelas (mapel umum): jadwal lain dengan jam persis sama, mapel sama, guru sama, dan ruang sama
       dianggap kelas yang digabung — bukan bentrok guru/ruang. Bentrok KELAS tetap dicek. */
    /* Mapel kejuruan TIDAK boleh digabung: dikenali dari kata di namanya. Tambah kata lain di sini jika perlu (pisahkan dengan |). */
    const kejuruan=/kejuruan|produktif/.test(low(p.mapel));
    const gabung=s=>!kejuruan&&low(akUnesc(s.mapel))===low(p.mapel)&&low(akUnesc(s.guru))===low(p.guru)
      &&s.jamMulai===p.jam_mulai&&s.jamSelesai===p.jam_selesai
      &&low(akUnesc(s.ruang)).replace(/^-$/,'')===low(p.ruang);
    const clash=schedulesData.find(s=>String(s.id)!==String(id||'')&&s.hari===dkEsc(p.hari)&&s.tahunAjaran===dkEsc(p.tahun_ajaran)&&s.semester===p.semester
      &&s.jamMulai<p.jam_selesai&&p.jam_mulai<s.jamSelesai
      &&(String(s.classId)===String(p.class_id)||(!gabung(s)&&(low(akUnesc(s.guru))===low(p.guru)||(p.ruang&&low(akUnesc(s.ruang))===low(p.ruang))))));
    if(clash){
      const why=String(clash.classId)===String(p.class_id)?'kelas '+akUnesc(clash.kelas):(low(akUnesc(clash.guru))===low(p.guru)?'guru '+akUnesc(clash.guru):'ruang '+akUnesc(clash.ruang));
      return 'Jadwal bentrok: '+why+' sudah dipakai '+akUnesc(clash.mapel)+' pada '+clash.hari+' '+clash.jam+'.';
    }
    return null;
  },
  fromRow:r=>{
    const jm=String(r.jam_mulai||'').slice(0,5), js=String(r.jam_selesai||'').slice(0,5);
    return akClassGetter({id:r.id,classId:r.class_id,hari:dkEsc(r.hari||''),jamMulai:jm,jamSelesai:js,jam:(jm&&js)?jm+'–'+js:dkDash(r.jam),
      mapel:dkEsc(r.mapel||''),guru:dkEsc(r.guru||''),ruang:dkDash(r.ruang),status:dkEsc(r.status||'Aktif'),tahunAjaran:dkEsc(r.tahun_ajaran||''),semester:dkEsc(r.semester||'')});
  },
  refresh:()=>jdRefresh()
}};

/* ---- Bobot nilai tersimpan di tabel boarding_settings (dipakai bersama semua pengguna) ---- */
function bdMergeNum(target,src){ Object.keys(target).forEach(k=>{ if(src&&src[k]!=null&&Number.isFinite(Number(src[k]))) target[k]=Number(src[k]); }); }
async function bdLoadSettings(){
  if(!dkClient()||typeof dbFetchAll!=='function') return false;
  try{
    const rows=await dbFetchAll('boarding_settings','*','key');
    rows.forEach(r=>{ const v=r.value; if(!v||typeof v!=='object') return;
      if(r.key==='bpWeights') bdMergeNum(bpWeights,v);
      else if(r.key==='biWeights') bdMergeNum(biWeights,v);
      else if(r.key==='rawatibConfig'){ const m=Number(v.max); biRawatibMax=(v.max!=null&&Number.isInteger(m)&&m>=0)?m:null; }
      else if(r.key==='bkDailyWeights') Object.keys(bkDailyWeights).forEach(k=>{ if(v[k]&&typeof v[k]==='object') bdMergeNum(bkDailyWeights[k],v[k]); });
    });
    return true;
  }catch(e){ console.error('bdLoadSettings',e); return false; }
}
async function bdSaveSetting(key,value){
  const sb=dkClient(); if(!sb) throw {message:'Supabase belum terhubung.'};
  const res=await sb.from('boarding_settings').upsert({key,value,updated_at:new Date().toISOString()}).select();
  if(res.error) throw res.error;
  if(!res.data||!res.data.length) throw {code:'42501',message:'Penyimpanan bobot diblokir RLS: role Anda tidak berhak.'};
}
function bdWeightRowsHtml(weights,ro){ return Object.keys(weights).map(k=>`<div class="dw-row"><span>${k}</span><span><input type="number" min="0" max="100" class="bd-weight-inp" data-key="${dkEsc(k)}" value="${weights[k]}" ${ro?'disabled':''} style="width:64px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px"></span></div>`).join(''); }
function bdWeightsFromDrawer(sel,target){
  const out={}; let bad=null;
  document.querySelectorAll(sel).forEach(i=>{ const raw=String(i.value).trim(); const n=Number(raw); if(raw===''||!Number.isFinite(n)||n<0||n>100) bad=i.dataset.key||i.dataset.opt; else out[i.dataset.key||i.dataset.opt]=n; });
  return bad?{bad}:{vals:out};
}
async function bdSaveWeightsGeneric(key,sel,applyFn,after,label){
  if(!bdCanManage()){ akFormErr('akfError','Anda tidak memiliki izin untuk mengubah bobot nilai.'); return; }
  const r=bdWeightsFromDrawer(sel); if(r.bad){ akFormErr('akfError','Bobot "'+r.bad+'" harus angka 0–100.'); return; }
  const btn=document.getElementById('bdWSave'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{ const next=applyFn(r.vals); await bdSaveSetting(key,next); closeAcadDrawer(); showAcadToast('Bobot nilai '+label+' tersimpan untuk semua pengguna.'); after(); }
  catch(e){ console.error('bdSaveWeights',e); akFormErr('akfError','Gagal menyimpan bobot: '+kscErrMsg(e,'ubah',null)); }
  finally{ const b=document.getElementById('bdWSave'); if(b){ b.disabled=false; b.textContent='Simpan Bobot'; } }
}
const BD_WEIGHT_FOOT=ro=>ro?'<p class="viewonly-banner" style="margin-top:12px">Mode lihat saja — hanya Super Admin, Kepala Sekolah, dan Musyrif yang dapat mengubah bobot.</p>':'<button class="btn-primary-sm" id="bdWSave" style="margin-top:14px;width:100%" onclick="%FN%">Simpan Bobot</button>';

/* ---- bulk save: insert baris baru, upsert baris yang sudah ada (by id) ---- */
async function bdBulkSave(table,ins,upd){
  const sb=dkClient(); if(!sb) throw {message:'Supabase belum terhubung.'};
  if(ins.length){ const r=await sb.from(table).insert(ins).select(); if(r.error) throw r.error; if((r.data||[]).length!==ins.length) throw AK_RLS_ERR; }
  if(upd.length){ const r=await sb.from(table).upsert(upd).select(); if(r.error) throw r.error; if((r.data||[]).length!==upd.length) throw AK_RLS_ERR; }
}

async function bpAddActivity(){
  const inp=document.getElementById('bpNewAct'); if(!inp) return; const nama=inp.value.trim().replace(/\s+/g,' '); if(!nama) return;
  if(!kscCan('bn','write')){ akFormErr('akfError','Anda tidak memiliki izin menambah kegiatan.'); return; }
  if(boardingActivitiesData.some(a=>akUnesc(a.nama).toLowerCase()===nama.toLowerCase())){ akFormErr('akfError','Kegiatan "'+nama+'" sudah ada.'); return; }
  akFormErr('akfError','');
  try{
    const r=await dkClient().from('boarding_activities').insert({nama}).select();
    if(r.error) throw r.error; if(!r.data||!r.data.length) throw AK_RLS_ERR;
    inp.value=''; await kscLoad('bn',{silent:true});
    const l=document.getElementById('bpActList'); if(l) l.innerHTML=bpActivityListHtml(); showAcadToast('Kegiatan ditambahkan.');
  }catch(e){ console.error('bpAddActivity',e); akFormErr('akfError','Gagal menambah kegiatan: '+kscErrMsg(e,'tambah',KSC.bn.cfg)); }
}
async function bpDeleteActivity(id){
  if(!kscCan('bn','delete')) return;
  try{
    const r=await dkClient().from('boarding_activities').delete().eq('id',id).select();
    if(r.error) throw r.error; if(!r.data||!r.data.length) throw {code:'42501',message:'Penghapusan diblokir RLS.'};
    await kscLoad('bn',{silent:true});
    const l=document.getElementById('bpActList'); if(l) l.innerHTML=bpActivityListHtml(); showAcadToast('Kegiatan dihapus.');
  }catch(e){ console.error('bpDeleteActivity',e); akFormErr('akfError',e&&e.code==='23503'?'Kegiatan ini sudah dipakai oleh data presensi, jadi tidak bisa dihapus.':'Gagal menghapus kegiatan: '+kscErrMsg(e,'hapus',KSC.bn.cfg)); }
}

  if(id&&!rec){ showAcadToast('Data tidak ditemukan. Muat ulang halaman.'); return; }

  const kg=rec?rec.kegiatanId:boardingActivitiesData[0].id, tgl=rec?rec.tanggal:ksToday();
  openAcadDrawer(rec?'Edit Presensi Kegiatan':'Input Presensi Kegiatan',AK_ERRBOX+`

function bpInStudents(){ const as=document.getElementById('bpInAsrama').value; return bdBoardingStudents().filter(s=>!as||s.asrama===as); }
function bpInRender(){
  const el=document.getElementById('bpInList'); if(!el) return;
  const kg=document.getElementById('bpInKegiatan').value, tgl=document.getElementById('bpInTanggal').value;
  const studs=bpInStudents(); const ex=bpExisting(kg,tgl); const nEx=studs.filter(s=>ex[String(s.id)]).length;
  const cnt=document.getElementById('bpInCount'); if(cnt) cnt.textContent='Daftar Santri ('+studs.length+')';
  el.innerHTML=(nEx?`<p class="viewonly-banner">Presensi untuk kegiatan dan tanggal ini sudah ada (${nEx} santri) — menyimpan akan memperbarui data tersebut.</p>`:'')
    +`<table><tr><th>Santri</th><th>Kamar</th><th>Status</th></tr>${studs.map(s=>{const e=ex[String(s.id)]; return `<tr><td>${s.nama}</td><td>${s.kamar}</td><td><select class="bp-in-status" id="bpst_${dkEsc(s.id)}" data-id="${dkEsc(s.id)}">${akOptHtml(['Hadir','Terlambat','Izin','Sakit','Alpa'],e?e.status:'Hadir')}</select></td></tr>`;}).join('')}</table>`;

function bpMarkAllHadir(){ document.querySelectorAll('#acadDrawer .bp-in-status').forEach(sel=>sel.value='Hadir'); }
async function bpInSave(){
  const M=KSC.ba; if(M.submitting) return;
  if(!kscCan('ba','write')){ akFormErr('akfError','Anda tidak memiliki izin untuk menyimpan presensi.'); return; }
  const kg=document.getElementById('bpInKegiatan').value, tgl=document.getElementById('bpInTanggal').value;
  if(!kg){ akFormErr('akfError','Kegiatan wajib dipilih.'); return; } if(!tgl){ akFormErr('akfError','Tanggal wajib diisi.'); return; }
  const studs=bpInStudents(); if(!studs.length){ akFormErr('akfError','Tidak ada santri pada daftar.'); return; }
  const ex=bpExisting(kg,tgl); const ins=[], upd=[];
  studs.forEach(s=>{ const row={student_id:s.id,activity_id:kg,tanggal:tgl,status:document.getElementById('bpst_'+s.id).value}; const e=ex[String(s.id)]; if(e){ row.id=e.id; upd.push(row); } else ins.push(row); });
  akFormErr('akfError','');
  M.submitting=true; const btn=document.getElementById('bpInSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{ await bdBulkSave('boarding_attendance',ins,upd); closeAcadDrawer(); showAcadToast('Presensi '+studs.length+' santri berhasil disimpan.'); await kscLoad('ba',{silent:true}); }
  catch(e){ console.error('bpInSave',e); akFormErr('akfError','Gagal menyimpan: '+kscErrMsg(e,'tambah',M.cfg)); showAcadToast('Gagal menyimpan presensi.'); }
  finally{ M.submitting=false; const b=document.getElementById('bpInSubmit'); if(b){ b.disabled=false; b.textContent='Simpan Presensi'; } }
}

const BI_SHALAT=[['subuh','Subuh'],['dzuhur','Dzuhur'],['ashar','Ashar'],['maghrib','Maghrib'],['isya','Isya']];
const BI_SHALAT_STATUS=['Tepat Waktu','Masbuk','Terlambat','Izin','Sakit','Alpa'];
const BI_LAIN=[['tahajud','Tahajud','Hadir/Tidak Hadir/Izin/Sakit'],['witir','Witir','Hadir/Tidak Hadir/Izin/Sakit'],['dhuha','Dhuha','Hadir/Tidak Hadir/Izin/Sakit'],['rawatib','Rawatib','Jumlah (angka)'],['tilawah','Tilawah','Setor/Tidak Setor'],['dzikir','Dzikir','Hadir/Tidak Hadir'],['puasaSenKam','Puasa Senin/Kamis','Puasa/Tidak Puasa/Uzur']];
const BI_COLS=BI_SHALAT.concat(BI_LAIN);
const biDb=k=>k==='puasaSenKam'?'puasa_sen_kam':(k==='rawatib'?'rawatib_jumlah':k);
/* Kolom bertipe JUMLAH (bukan status). Rawatib disimpan di worship_records.rawatib_jumlah (smallint, NULL = belum dicatat).
   Kolom lama worship_records.rawatib (teks Hadir/Tidak Hadir) TIDAK diubah/dihapus -> riwayat lama aman, hanya tidak dihitung. */
const BI_COUNT=['rawatib'];
const biIsCount=k=>BI_COUNT.includes(k);
const BI_COUNT_TECH_MAX=32767;            /* batas teknis tipe smallint, bukan aturan bisnis */
let biRawatibMax=null;                    /* batas harian per santri; null = belum ditetapkan (disimpan di boarding_settings.rawatibConfig) */
function biCountLimit(){ return biRawatibMax!=null?Math.min(biRawatibMax,BI_COUNT_TECH_MAX):BI_COUNT_TECH_MAX; }
function biOptsFor(k){ if(biIsCount(k)) return []; if(BI_SHALAT.some(c=>c[0]===k)) return BI_SHALAT_STATUS; return BI_LAIN.find(c=>c[0]===k)[2].split('/'); }
KSC.bi={loading:false,raw:{},missing:new Set(),submitting:false,cfg:{
  key:'bi',prefix:'bi',table:'worship_records',title:'Ibadah Harian',arr:worshipRecordsData,sortKey:'tanggal',filter:bdSince120,
  writeRoles:BD_WRITE,deleteRoles:BD_WRITE,fields:[],
  fromRow:r=>{ const o={id:r.id,studentId:r.student_id,tanggal:kscD(r.tanggal)};
    BI_COLS.forEach(c=>{ const v=r[biDb(c[0])];
      if(biIsCount(c[0])){ const n=(v==null||v==='')?null:Number(v); o[c[0]]=(n!=null&&Number.isFinite(n))?n:'-'; o[c[0]+'Lama']=r[c[0]]?dkEsc(r[c[0]]):''; }   /* Lama = status teks lama, hanya ditampilkan */
      else o[c[0]]=v?dkEsc(v):'-'; });
    return o; },
  refresh:()=>biRefresh()
}};
let biFilter={tanggal:'',asrama:''}; let biTab='shalat'; let biPage=1; const BI_PER_PAGE=15;
function biRows(){ let rows=ksFilterByStudentId(worshipRecordsData); const f=biFilter;
  return rows.filter(w=>{const s=studentOf(w.studentId); return s&&(!f.tanggal||w.tanggal===f.tanggal)&&(!f.asrama||s.asrama===f.asrama);}); }
function biStatusBadgeCls(v){ if(['Tepat Waktu','Hadir','Setor','Puasa'].includes(v)) return 'st-hadir'; if(['Masbuk','Terlambat','Izin','Uzur'].includes(v)) return 'b-amber'; if(v==='Sakit') return 'st-sakit'; return 'st-alpa'; }

function biSwitchTab(t){ biTab=t; document.querySelectorAll('#biTabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===t)); biRenderTable(); }

function biStatsArray(){

function biInRender(){
  const el=document.getElementById('biInList'); if(!el) return;
  const tgl=document.getElementById('biInTanggal').value; const studs=biInStudents(); const ex=biExisting(tgl); const nEx=studs.filter(s=>ex[String(s.id)]).length;
  const tbl=(group,cols)=>`<table data-grp="${group}"><tr><th>Santri</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr>${studs.map(s=>{const e=ex[String(s.id)]; return `<tr><td>${s.nama}</td>${cols.map(c=>biIsCount(c[0])

      : `<td><select id="bi_${c[0]}_${dkEsc(s.id)}"><option value="-">-</option>${akOptHtml(biOptsFor(c[0]),e&&e[c[0]]!=='-'?e[c[0]]:'')}</select></td>`).join('')}</tr>`;}).join('')}</table>`;

async function biInSave(){
  const M=KSC.bi; if(M.submitting) return;
  if(!kscCan('bi','write')){ akFormErr('akfError','Anda tidak memiliki izin untuk menyimpan ibadah.'); return; }
  const tgl=document.getElementById('biInTanggal').value; if(!tgl){ akFormErr('akfError','Tanggal wajib diisi.'); return; }
  const studs=biInStudents(); const ex=biExisting(tgl); const ins=[], upd=[]; let badCount=null;
  studs.forEach(s=>{
    const row={student_id:s.id,tanggal:tgl}; let any=false;
    BI_COLS.forEach(c=>{
      const el=document.getElementById('bi_'+c[0]+'_'+s.id);
      if(biIsCount(c[0])){
        const raw=String(el.value).trim();
        if(el.validity&&el.validity.badInput){ badCount=badCount||{s,why:'berisi teks/angka tidak valid'}; return; }
        if(raw===''){ row[biDb(c[0])]=null; return; }
        if(!/^\d+$/.test(raw)){ badCount=badCount||{s,why:'harus bilangan bulat 0 atau lebih (tanpa desimal/negatif)'}; return; }
        const n=Number(raw);
        if(n>biCountLimit()){ badCount=badCount||{s,why:'melebihi batas '+biCountLimit()+(biRawatibMax!=null?' (batas harian yang ditetapkan)':' (batas teknis database)')}; return; }
        row[biDb(c[0])]=n; any=true; return;
      }
      const v=el.value; row[biDb(c[0])]=v==='-'?null:v; if(v!=='-') any=true;
    });
    const e=ex[String(s.id)]; if(e){ row.id=e.id; upd.push(row); } else if(any) ins.push(row);
  });
  if(badCount){ akFormErr('akfError','Jumlah Rawatib untuk '+badCount.s.nama+' '+badCount.why+'.'); return; }
  if(!ins.length&&!upd.length){ akFormErr('akfError','Belum ada ibadah yang dicatat.'); return; }
  akFormErr('akfError','');
  M.submitting=true; const btn=document.getElementById('biInSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{ await bdBulkSave('worship_records',ins,upd); closeAcadDrawer(); showAcadToast('Ibadah '+(ins.length+upd.length)+' santri berhasil disimpan.'); await kscLoad('bi',{silent:true}); }
  catch(e){ console.error('biInSave',e);
    const miss=dkIsMissingColErr(e)&&/rawatib_jumlah/i.test((e&&e.message)||'');
    akFormErr('akfError','Gagal menyimpan: '+(miss?'kolom worship_records.rawatib_jumlah belum ada. Jalankan supabase-rawatib-migration.sql di Supabase SQL Editor, lalu coba lagi.':kscErrMsg(e,'tambah',M.cfg))); showAcadToast('Gagal menyimpan ibadah.'); }
  finally{ M.submitting=false; const b=document.getElementById('biInSubmit'); if(b){ b.disabled=false; b.textContent='Simpan Ibadah'; } }
}

/* ---- Rekap Rawatib (harian & bulanan) — dihitung dari jumlah yang tercatat; data diambil langsung dari database untuk tanggal/bulan terpilih ---- */
let biRcMode='harian';
function biMonthRange(ym){ const m=/^(\d{4})-(\d{2})$/.exec(ym||''); if(!m) return null; const y=Number(m[1]), mo=Number(m[2]); const last=new Date(y,mo,0).getDate(); return [ym+'-01', ym+'-'+String(last).padStart(2,'0')]; }
async function biFetchRawatib(from,to){
  if(!dkClient()||typeof dbFetchAll!=='function') throw {message:'Supabase belum terhubung.'};
  const rows=await dbFetchAll('worship_records','student_id,tanggal,rawatib_jumlah','tanggal',q=>q.gte('tanggal',from).lte('tanggal',to));
  return ksFilterByStudentId(rows.map(r=>({studentId:r.student_id,tanggal:kscD(r.tanggal),jumlah:(r.rawatib_jumlah==null||r.rawatib_jumlah==='')?null:Number(r.rawatib_jumlah)})));
}
function biOpenRawatibRecap(){
  const t=ksToday();
  openAcadDrawer('Rekap Rawatib',`<div id="rcMsg"></div>
    <div class="dw-tabs" id="rcTabs" style="margin:0 0 10px"><button class="active" data-t="harian" onclick="biRcSwitch('harian')">Harian</button><button data-t="bulanan" onclick="biRcSwitch('bulanan')">Bulanan</button></div>
    <div class="dw-field"><label id="rcLabel">Tanggal</label><input type="date" id="rcDate" value="${dkEsc(t)}" onchange="biRcRender()"><input type="month" id="rcMonth" value="${dkEsc(t.slice(0,7))}" onchange="biRcRender()" style="display:none"></div>
    <div id="rcBody"></div>`);
  biRcMode='harian'; biRcRender();

function biRcSwitch(m){
  biRcMode=m; document.querySelectorAll('#rcTabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===m));
  document.getElementById('rcDate').style.display=m==='harian'?'':'none'; document.getElementById('rcMonth').style.display=m==='bulanan'?'':'none';
  document.getElementById('rcLabel').textContent=m==='harian'?'Tanggal':'Bulan'; biRcRender();
}
async function biRcRender(){
  const body=document.getElementById('rcBody'); if(!body) return;
  const harian=biRcMode==='harian';
  const range=harian?[document.getElementById('rcDate').value,document.getElementById('rcDate').value]:biMonthRange(document.getElementById('rcMonth').value);
  if(!range||!range[0]){ body.innerHTML='<p class="desc">Pilih '+(harian?'tanggal':'bulan')+' terlebih dahulu.</p>'; return; }
  const token=(biRcRender.tok=(biRcRender.tok||0)+1); body.innerHTML='<p class="desc">Memuat...</p>';
  let rows; try{ rows=await biFetchRawatib(range[0],range[1]); }
  catch(e){ if(token!==biRcRender.tok) return; const miss=dkIsMissingColErr(e); body.innerHTML='<div style="background:#FBE7E5;color:#C0392B;border-radius:8px;padding:9px 12px;font-size:12px">Gagal memuat rekap: '+dkEsc(miss?'kolom rawatib_jumlah belum ada — jalankan supabase-rawatib-migration.sql.':kscErrMsg(e,'muat',null))+'</div>'; return; }
  if(token!==biRcRender.tok) return;
  const studs=bdBoardingStudents(); const by={};
  rows.forEach(r=>{ if(r.jumlah==null) return; const k=String(r.studentId); const b=(by[k]=by[k]||{total:0,hari:0}); b.total+=r.jumlah; b.hari++; });
  const list=studs.map(s=>({s,b:by[String(s.id)]||null})).sort((a,b)=>akUnesc(a.s.nama).localeCompare(akUnesc(b.s.nama)));
  const grand=list.reduce((a,x)=>a+(x.b?x.b.total:0),0), tercatat=list.filter(x=>x.b).length;
  if(!list.length){ body.innerHTML='<p class="desc">Belum ada santri boarding yang dapat Anda akses.</p>'; return; }
  body.innerHTML=`<div style="display:flex;gap:10px;margin:4px 0 10px;flex-wrap:wrap"><div class="mini-stat c-teal" style="flex:1;min-width:120px"><div class="ms-val">${grand}</div><div class="ms-label">Total ${harian?'hari ini':'bulan ini'}</div></div><div class="mini-stat c-blue" style="flex:1;min-width:120px"><div class="ms-val">${tercatat}/${list.length}</div><div class="ms-label">Santri tercatat</div></div></div>
  <table><tr><th>Santri</th>${harian?'<th>Jumlah</th>':'<th>Hari Tercatat</th><th>Total</th><th>Rata-rata/hari</th>'}</tr>
  ${list.map(x=>harian
    ? `<tr><td>${x.s.nama}</td><td>${x.b?'<b>'+x.b.total+'</b>':'<span style="color:var(--sub)">-</span>'}</td></tr>`
    : `<tr><td>${x.s.nama}</td><td>${x.b?x.b.hari:0}</td><td>${x.b?'<b>'+x.b.total+'</b>':0}</td><td>${x.b?(Math.round(x.b.total/x.b.hari*10)/10):'-'}</td></tr>`).join('')}</table>
  <p class="desc" style="margin-top:8px">Rekap hanya menjumlahkan angka yang dicatat. Catatan lama berupa status (Hadir/Tidak Hadir) tidak diubah menjadi angka dan tidak ikut dihitung.</p>`;
}

function btBuild(){
  tahfidzRecordsData.length=0;
  bdBoardingStudents().forEach(s=>{
    const logs=tahfidzLogData.filter(l=>bdEq(l.studentId,s.id)).slice().sort((a,b)=>String(b.tanggal).localeCompare(String(a.tanggal)));
    const tg=tahfidzTargetsData.find(t=>bdEq(t.studentId,s.id));
    const setoran=logs.filter(l=>l.jenis==='Setoran').reduce((a,l)=>a+l.halaman,0);
    const murojaah=logs.filter(l=>l.jenis==='Murojaah').reduce((a,l)=>a+l.halaman,0);
    const juz=Math.round(((tg?tg.awal:0)+setoran/20)*10)/10;
    const target=tg&&tg.target?tg.target:null;
    const lastSet=logs.find(l=>l.jenis==='Setoran')||logs[0];
    tahfidzRecordsData.push({studentId:s.id,juz,surat:lastSet?lastSet.surat:'-',setoran:Math.round(setoran*10)/10,murojaah:Math.round(murojaah*10)/10,
      progress:target?Math.min(100,Math.round(juz/target*100)):null,pembimbing:(logs[0]&&logs[0].pembimbing!=='-')?logs[0].pembimbing:s.musyrif,target,awal:tg?tg.awal:0,terakhir:logs[0]?logs[0].tanggal:'',riwayat:logs});
  });
}

async function btSaveTarget(studentId){
  const M=KSC.btg; if(M.submitting) return; const sb=dkClient(); if(!sb){ akFormErr('akfError','Supabase belum terhubung.'); return; }
  const tr=document.getElementById('btgTarget').value.trim(), aw=document.getElementById('btgAwal').value.trim()||'0';
  const target=Number(tr), awal=Number(aw);
  if(tr===''||!Number.isFinite(target)||target<=0||target>30){ akFormErr('akfError','Target harus antara 0,5 dan 30 juz.'); return; }
  if(!Number.isFinite(awal)||awal<0||awal>30){ akFormErr('akfError','Hafalan awal harus antara 0 dan 30 juz.'); return; }
  const tg=tahfidzTargetsData.find(x=>bdEq(x.studentId,studentId)); const payload={student_id:studentId,target_juz:target,hafalan_awal:awal};
  akFormErr('akfError',''); M.submitting=true; const btn=document.getElementById('btgSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    const res=tg? await sb.from('tahfidz_targets').update(payload).eq('id',tg.id).select() : await sb.from('tahfidz_targets').insert(payload).select();
    if(res.error) throw res.error; if(!res.data||!res.data.length) throw AK_RLS_ERR;
    closeAcadDrawer(); showAcadToast('Target tahfidz tersimpan.'); await kscLoad('btg',{silent:true});
  }catch(e){ console.error('btSaveTarget',e); akFormErr('akfError','Gagal menyimpan: '+kscErrMsg(e,'ubah',M.cfg)); }
  finally{ M.submitting=false; const b=document.getElementById('btgSubmit'); if(b){ b.disabled=false; b.textContent='Simpan'; } }
}

async function bhSaveAssess(studentId){
  const M=KSC.bh; if(M.submitting) return;
  if(!kscCan('bh','write')){ akFormErr('akfError','Anda tidak memiliki izin untuk menyimpan penilaian.'); return; }
  const sb=dkClient(); if(!sb){ akFormErr('akfError','Supabase belum terhubung.'); return; }
  const payload={student_id:studentId,tanggal:bhFilter.tanggal};
  document.querySelectorAll('#acadDrawer .bh-in').forEach(sel=>{ payload[sel.dataset.k]=sel.value; });
  const ex=dailyDisciplineData.find(x=>bdEq(x.studentId,studentId)&&x.tanggal===bhFilter.tanggal);
  akFormErr('akfError',''); M.submitting=true; const btn=document.getElementById('bhSave'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    const res=ex? await sb.from('daily_discipline').update(payload).eq('id',ex.id).select() : await sb.from('daily_discipline').insert(payload).select();
    if(res.error) throw res.error; if(!res.data||!res.data.length) throw AK_RLS_ERR;
    closeAcadDrawer(); showAcadToast('Penilaian kedisiplinan harian tersimpan.'); await kscLoad('bh',{silent:true});
  }catch(e){ console.error('bhSaveAssess',e); akFormErr('akfError','Gagal menyimpan: '+kscErrMsg(e,ex?'ubah':'tambah',M.cfg)); showAcadToast('Gagal menyimpan penilaian.'); }
  finally{ M.submitting=false; const b=document.getElementById('bhSave'); if(b){ b.disabled=false; b.textContent='Simpan Penilaian'; } }
}

async function bhSaveWeights(){
  if(!bdCanManage()){ akFormErr('akfError','Anda tidak memiliki izin untuk mengubah bobot nilai.'); return; }
  const next=JSON.parse(JSON.stringify(bkDailyWeights)); let bad=null;
  document.querySelectorAll('#acadDrawer .bh-weight-inp').forEach(i=>{ const raw=String(i.value).trim(), n=Number(raw); if(raw===''||!Number.isFinite(n)||n<0||n>100) bad=i.dataset.opt; else next[i.dataset.cat][i.dataset.opt]=n; });
  if(bad){ akFormErr('akfError','Bobot "'+bad+'" harus angka 0–100.'); return; }
  const btn=document.getElementById('bdWSave'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{ await bdSaveSetting('bkDailyWeights',next); bkDailyWeights=next; closeAcadDrawer(); showAcadToast('Bobot nilai penilaian harian tersimpan untuk semua pengguna.'); bhRenderTable(); }

function kgAddDays(dateStr,days){ const p=String(dateStr).split('-').map(Number); const d=new Date(p[0],p[1]-1,p[2]+days); return d.getFullYear()+'-'+kgPad(d.getMonth()+1)+'-'+kgPad(d.getDate()); }
function kgRupiah(n){ return 'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID'); }

function invoiceComputed(inv){
  const pays=paymentsData.filter(p=>bdEq(p.invoiceId,inv.id) && !p.voided);
  const dibayar=pays.reduce((a,p)=>a+p.nominal,0);
  const sisa=Math.max(0,inv.nominal-dibayar);
  let status;
  if(sisa<=0) status='Lunas';
  else if(dibayar>0) status='Sebagian Dibayar';
  else if(inv.jatuhTempo<KG_TODAY) status='Terlambat';
  else if(inv.jatuhTempo<=kgAddDays(KG_TODAY,3)) status='Jatuh Tempo';
  else status='Belum Dibayar';
  return {dibayar,sisa,status};
}
function feeTypeOf(id){ return feeTypesData.find(f=>bdEq(f.id,id)); }
function invoiceOf(id){ return invoicesData.find(i=>bdEq(i.id,id)); }

/* ---- Buat Tagihan (massal per kelas/jurusan/asrama, mencegah duplikat) ---- */
function kgResolveTargetStudents(scope,detail){
  const aktif=studentsData.filter(s=>s.status==='Aktif');
  const eq=(a,b)=>akUnesc(a)===String(b);
  if(scope==='Semua Siswa') return aktif;
  if(scope==='Kelas Tertentu') return aktif.filter(s=>eq(s.kelas,detail));
  if(scope==='Jurusan Tertentu') return aktif.filter(s=>eq(s.jurusan,detail));
  if(scope==='Asrama Tertentu') return aktif.filter(s=>s.boarding && eq(s.asrama,detail));
  if(scope==='Siswa Tertentu') return aktif.filter(s=>bdEq(s.id,detail));
  return [];
}
async function kgBuatTagihan(feeTypeId,periodeLabel,jatuhTempo,scope,detail){
  const ft=feeTypeOf(feeTypeId); if(!ft) return {created:0,skipped:0,error:'Jenis biaya tidak ditemukan.'};
  const sb=dkClient(); if(!sb) return {created:0,skipped:0,error:'Supabase belum terhubung.'};
  if(ft.status!=='Aktif') return {created:0,skipped:0,error:'Jenis biaya ini nonaktif.'};
  const targets=kgResolveTargetStudents(scope,detail);
  if(!targets.length) return {created:0,skipped:0,error:'Tidak ada siswa aktif yang sesuai target ini.'};
  const low=String(periodeLabel).toLowerCase();
  const have=new Set(invoicesData.filter(i=>bdEq(i.feeTypeId,feeTypeId)&&akUnesc(i.periodeLabel).toLowerCase()===low).map(i=>String(i.studentId)));
  const rows=[]; let skipped=0;
  targets.forEach(s=>{ if(have.has(String(s.id))){ skipped++; return; } rows.push({student_id:s.id,fee_type_id:feeTypeId,periode_label:periodeLabel,nominal:ft.nominal,jatuh_tempo:jatuhTempo}); });
  if(!rows.length) return {created:0,skipped,error:null};
  try{
    for(let i=0;i<rows.length;i+=200){
      const chunk=rows.slice(i,i+200); const r=await sb.from('invoices').insert(chunk).select();
      if(r.error) throw r.error; if((r.data||[]).length!==chunk.length) throw AK_RLS_ERR;
    }
  }catch(e){
    await kscLoad('ki',{silent:true});
    return {created:0,skipped,error:(e&&e.code==='23505')?'Sebagian tagihan sudah dibuat oleh pengguna lain. Data sudah dimuat ulang; coba lagi.':kscErrMsg(e,'tambah',KSC.ki.cfg)};
  }
  await kscLoad('ki',{silent:true});
  return {created:rows.length,skipped};
}

/* ---- Catat Pembayaran (RPC atomik: payments + cash_transactions) ---- */
let __kgPaymentSubmitting=false;
function kgValidatePayment({studentId,invoiceId,nominal}){
  if(__kgPaymentSubmitting) return 'Transaksi sedang diproses, mohon tunggu sebentar.';
  if(!studentId) return 'Pilih siswa terlebih dahulu.';
  if(!invoiceId) return 'Pilih tagihan terlebih dahulu.';
  if(!nominal || isNaN(nominal) || nominal<=0) return 'Nominal pembayaran harus lebih dari 0.';
  if(!Number.isInteger(nominal)) return 'Nominal harus bilangan bulat rupiah.';
  if(nominal>100000000000) return 'Nominal terlalu besar.';
  const inv=invoiceOf(invoiceId); if(!inv) return 'Tagihan tidak ditemukan.';
  return null;
}
async function kgRpc(fn,args){
  const sb=dkClient(); if(!sb) throw {message:'Supabase belum terhubung.'};
  const r=await sb.rpc(fn,args); if(r.error) throw r.error; return r.data;
}
async function kgCatatPembayaran({invoiceId,tanggal,nominal,metode,keterangan}){
  __kgPaymentSubmitting=true;
  try{
    await kgRpc('kg_record_payment',{p_invoice_id:invoiceId,p_tanggal:tanggal,p_nominal:nominal,p_metode:metode,p_keterangan:keterangan||null});
    await Promise.all([kscLoad('kp',{silent:true}),kscLoad('kc',{silent:true})]);
    return {ok:true};
  }catch(e){ console.error('kgCatatPembayaran',e); return {ok:false,error:kgErrMsg(e)}; }
  finally{ __kgPaymentSubmitting=false; }
}
function kgErrMsg(e){
  const raw=(e&&e.message)||String(e||''); const code=(e&&e.code)||'';
  if(/function .* does not exist|Could not find the function|schema cache/i.test(raw)&&/kg_/i.test(raw)) return 'Fungsi database belum ada. Jalankan supabase-keuangan-setup.sql.';
  if(code==='42501'||/tidak berhak|not allowed|row-level security/i.test(raw)) return 'Ditolak: role Anda tidak berhak melakukan transaksi ini. ('+raw+')';
  return kscErrMsg(e,'tambah',null);
}
function kgVoidPayment(paymentId){
  if(!kgCanManage()){ showAcadToast('Anda tidak memiliki hak untuk membatalkan transaksi.'); return; }
  const p=paymentsData.find(x=>bdEq(x.id,paymentId)); if(!p||p.voided) return;
  openAcadConfirm('Void Transaksi Pembayaran',
    'Transaksi ini tidak akan dihapus permanen — hanya ditandai batal (voided) dan tetap tersimpan sebagai histori audit. Tagihan terkait akan otomatis kembali berstatus belum lunas. Lanjutkan?',
    async ()=>{
      try{
        await kgRpc('kg_void_payment',{p_payment_id:paymentId});
        await Promise.all([kscLoad('kp',{silent:true}),kscLoad('kc',{silent:true})]);
        showAcadToast('Transaksi berhasil dibatalkan (void).');
      }catch(e){ console.error('kgVoidPayment',e); showAcadToast('Gagal membatalkan: '+kgErrMsg(e)); }
    });
}

function kgKasSorted(filterFn){
  return cashTransactionsData.filter(k=>!filterFn||filterFn(k)).slice().sort((a,b)=>a.tanggal<b.tanggal?-1:(a.tanggal>b.tanggal?1:(String(a.createdAt)<String(b.createdAt)?-1:1)));
}
function kgKasWithSaldo(filterFn){
  /* saldo berjalan dihitung dari SELURUH riwayat; filter hanya memilih baris yang ditampilkan */
  const all=kgKasSorted(null); let saldo=KAS_SALDO_AWAL; const out=[];
  all.forEach(k=>{ if(!k.voided) saldo+=(k.masuk-k.keluar); if(!filterFn||filterFn(k)) out.push({...k,saldo}); });
  return out;
}

/* ---- Agregasi untuk Rekap Keuangan & Dashboard Bendahara ---- */
function kgMonthLabel(dateStr){ const d=new Date(dateStr+'T00:00:00'); return ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()]+' '+d.getFullYear(); }
function kgComputeMonthlyPemasukan(months){
  months=months||6; kgRefreshToday();
  const now=new Date(KG_TODAY+'T00:00:00'); const labels=[],values=[];
  for(let i=months-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1); const ym=d.getFullYear()+'-'+kgPad(d.getMonth()+1);
    labels.push(['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()]);
    const total=paymentsData.filter(p=>!p.voided && p.tanggal.startsWith(ym)).reduce((a,p)=>a+p.nominal,0);
    values.push(Math.round(total/1000000*10)/10);
  }
  return {labels,values};
}
function kgComputeMonthlyTunggakan(months){
  months=months||6; kgRefreshToday();
  const now=new Date(KG_TODAY+'T00:00:00'); const labels=[],values=[];
  for(let i=months-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1); const ym=d.getFullYear()+'-'+kgPad(d.getMonth()+1);
    labels.push(['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()]);
    const total=invoicesData.filter(inv=>inv.jatuhTempo.startsWith(ym)).reduce((a,inv)=>a+invoiceComputed(inv).sisa,0);
    values.push(Math.round(total/1000000*10)/10);
  }
  return {labels,values};
}
function kgComputePembayaranPerKategori(){
  const byKat={};
  paymentsData.filter(p=>!p.voided).forEach(p=>{
    const inv=invoiceOf(p.invoiceId); const ft=inv&&feeTypeOf(inv.feeTypeId); const kat=ft?ft.kategori:'Lainnya';
    byKat[kat]=(byKat[kat]||0)+p.nominal;
  });
  const palette=['#1D6FA3','#6C4FC7','#1C8A5A','#1F8A82','#4553B8','#0E9A6C','#B8630F'];

async function mbSubmitForm(id){
  const M=KSC.kf; if(M.submitting) return;
  if(!kgCanManage()){ akFormErr('akfError','Anda tidak memiliki izin.'); return; }
  const sb=dkClient(); if(!sb){ akFormErr('akfError','Supabase belum terhubung.'); return; }
  const nama=document.getElementById('mbfNama').value.trim().replace(/\s+/g,' ');
  const nominal=Number(document.getElementById('mbfNominal').value);
  if(!nama){ akFormErr('akfError','Nama biaya wajib diisi.'); return; }
  if(!nominal||!Number.isInteger(nominal)||nominal<=0){ akFormErr('akfError','Nominal harus bilangan bulat lebih dari 0.'); return; }
  if(nominal>100000000000){ akFormErr('akfError','Nominal terlalu besar.'); return; }
  const berlaku=document.getElementById('mbfBerlaku').value;
  const detail=berlaku==='Semua Siswa'?null:(document.getElementById('mbfDetail').value||null);
  if(berlaku!=='Semua Siswa'&&!detail){ akFormErr('akfError','Pilih detail "Berlaku Untuk" terlebih dahulu (data siswa/kelas belum tersedia?).'); return; }
  const periode=document.getElementById('mbfPeriode').value;
  const dup=feeTypesData.some(f=>!bdEq(f.id,id)&&akUnesc(f.nama).toLowerCase()===nama.toLowerCase()&&f.periode===dkEsc(periode));
  if(dup){ akFormErr('akfError','Jenis biaya "'+nama+'" dengan periode yang sama sudah ada.'); return; }
  const payload={nama,kategori:document.getElementById('mbfKategori').value,nominal,periode,berlaku_untuk:berlaku,berlaku_detail:detail,keterangan:document.getElementById('mbfKet').value.trim()||null};
  if(!id) payload.status='Aktif';
  akFormErr('akfError',''); M.submitting=true; const btn=document.getElementById('mbfSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    const res=id? await sb.from('fee_types').update(payload).eq('id',id).select() : await sb.from('fee_types').insert(payload).select();
    if(res.error) throw res.error; if(!res.data||!res.data.length) throw AK_RLS_ERR;
    closeAcadDrawer(); showAcadToast(id?'Jenis biaya diperbarui.':'Jenis biaya baru berhasil disimpan.'); await kscLoad('kf',{silent:true});
  }catch(e){ console.error('mbSubmitForm',e); akFormErr('akfError','Gagal menyimpan: '+kscErrMsg(e,id?'ubah':'tambah',M.cfg)); }
  finally{ M.submitting=false; const b=document.getElementById('mbfSubmit'); if(b){ b.disabled=false; b.textContent=id?'Simpan Perubahan':'Simpan Jenis Biaya'; } }
}

let rkFilter={tahun:'',bulan:'',kelas:'',jurusan:'',asrama:'',jenis:'',status:''};
function rkFilteredInvoices(){
  const f=rkFilter;
  return invoicesData.filter(inv=>{
    const s=studentOf(inv.studentId); if(!s) return false;
    const {status}=invoiceComputed(inv);
    return (!f.tahun||inv.jatuhTempo.slice(0,4)===f.tahun)&&(!f.bulan||inv.jatuhTempo.slice(5,7)===f.bulan)&&(!f.kelas||s.kelas===f.kelas)&&(!f.jurusan||s.jurusan===f.jurusan)&&(!f.asrama||(s.boarding&&s.asrama===f.asrama))&&(!f.jenis||bdEq(inv.feeTypeId,f.jenis))&&(!f.status||status===f.status);
  });
}
function rkGroupHtml(computed,keyFn,labelHeader){
  const map={};
  computed.forEach(({inv,c})=>{
    const s=studentOf(inv.studentId); const key=keyFn(s,inv); if(key===null) return;
    if(!map[key]) map[key]={tagihan:0,terbayar:0,tunggakan:0};
    map[key].tagihan+=inv.nominal; map[key].terbayar+=c.dibayar; map[key].tunggakan+=c.sisa;
  });
  const keys=Object.keys(map); if(!keys.length) return null;
  return {keys,map};
}
function rkRenderAll(){
  if(!document.getElementById('rkSummary')) return;
  const invs=rkFilteredInvoices(); const computed=invs.map(inv=>({inv,c:invoiceComputed(inv)}));
  const totalTagihan=invs.reduce((a,x)=>a+x.nominal,0), totalDibayar=computed.reduce((a,x)=>a+x.c.dibayar,0), totalTunggakan=computed.reduce((a,x)=>a+x.c.sisa,0);
  document.getElementById('rkSummary').innerHTML=acadStatRowHtml([
    {color:'blue',val:kgRupiah(totalTagihan),label:'Total Tagihan'},
    {color:'emerald',val:kgRupiah(totalDibayar),label:'Total Pembayaran'},
    {color:'red',val:kgRupiah(totalTunggakan),label:'Total Tunggakan'},
    {color:'green',val:computed.filter(x=>x.c.status==='Lunas').length,label:'Total Lunas'},
    {color:'orange',val:computed.filter(x=>x.c.status==='Belum Dibayar'||x.c.status==='Jatuh Tempo').length,label:'Belum Dibayar'},
    {color:'purple',val:computed.filter(x=>x.c.status==='Terlambat').length,label:'Total Terlambat'}]);

  document.getElementById('rkPerKelas').innerHTML=tbl(rkGroupHtml(computed,(s)=>s?s.kelas:null),'Kelas');

let ksKasFilter={dari:'',sampai:'',kategori:''}; let kasPage=1; const KAS_PER_PAGE=25;
function ksRenderKasTable(){
  const body=document.getElementById('kasBody'); if(!body) return;
  const f=ksKasFilter; const fn=k=>(!f.dari||k.tanggal>=f.dari)&&(!f.sampai||k.tanggal<=f.sampai)&&(!f.kategori||k.kategori===f.kategori);
  const all=kgKasWithSaldo(fn); const {rows,page,totalPages,total}=acadPaginate(all,kasPage,KAS_PER_PAGE); kasPage=page;
  body.innerHTML = rows.length? `<table><tr><th>Tanggal</th><th>No. Transaksi</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Masuk</th><th>Keluar</th><th>Saldo</th><th>Petugas</th><th>Aksi</th></tr>
    ${rows.map(k=>`<tr class="${k.voided?'voided':''}"><td>${fmtTglID(k.tanggal)}</td><td>${k.kode}</td><td>${acadStatusBadge(k.jenis==='Masuk'?'Disetujui':'Ditolak')}</td><td>${k.kategori}</td><td>${k.keterangan}</td>
    <td>${k.masuk?kgRupiah(k.masuk):'-'}</td><td>${k.keluar?kgRupiah(k.keluar):'-'}</td><td><b>${kgRupiah(k.saldo)}</b></td><td>${k.petugas}</td>
    <td>${kgCanManage()&&!k.voided&&!k.linkedPaymentId?`<button title="Void" onclick="kgVoidCashEntry('${dkEsc(k.id)}')" style="background:none;border:1px solid var(--line);border-radius:6px;width:26px;height:26px;cursor:pointer;">🚫</button>`:''}</td></tr>`).join('')}
    </table>` : acadEmptyStateHtml('Tidak ada transaksi kas','Coba ubah filter tanggal atau kategori.');
  const pg=document.getElementById('kasPagination'); if(pg) pg.innerHTML=acadPaginationHtml(page,totalPages,total,'kasGotoPage');
  const live=cashTransactionsData.filter(k=>!k.voided);
  const saldoAkhir=KAS_SALDO_AWAL+live.reduce((a,k)=>a+k.masuk-k.keluar,0);
  const sel=live.filter(fn);
  const ks=document.getElementById('kasStats'); if(ks) ks.innerHTML=acadStatRowHtml([
    {color:'teal',val:kgRupiah(saldoAkhir),label:'Saldo Kas'},
    {color:'green',val:kgRupiah(sel.reduce((a,k)=>a+k.masuk,0)),label:'Total Kas Masuk'},
    {color:'red',val:kgRupiah(sel.reduce((a,k)=>a+k.keluar,0)),label:'Total Kas Keluar'}]);
}

async function kasSubmitAddForm(){
  if(__kgPaymentSubmitting) return;
  const nominal=Number(document.getElementById('kasfNominal').value);
  if(!nominal||!Number.isInteger(nominal)||nominal<=0){ akFormErr('akfError','Nominal harus bilangan bulat lebih dari 0.'); return; }
  if(nominal>100000000000){ akFormErr('akfError','Nominal terlalu besar.'); return; }
  const keterangan=document.getElementById('kasfKet').value.trim().replace(/\s+/g,' ');
  if(!keterangan){ akFormErr('akfError','Keterangan wajib diisi.'); return; }
  const tanggal=document.getElementById('kasfTanggal').value; if(!tanggal){ akFormErr('akfError','Tanggal wajib diisi.'); return; }
  if(tanggal>kgNowIso()){ akFormErr('akfError','Tanggal tidak boleh di masa depan.'); return; }
  akFormErr('akfError',''); __kgPaymentSubmitting=true; const btn=document.getElementById('kasfSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    const res=await kgAddCashEntry({tanggal,jenis:document.getElementById('kasfJenis').value,kategori:document.getElementById('kasfKategori').value,keterangan,nominal});
    if(res.ok){ showAcadToast('Transaksi kas berhasil disimpan.'); closeAcadDrawer(); }
    else akFormErr('akfError','Gagal menyimpan: '+res.error);
  }finally{ __kgPaymentSubmitting=false; const b=document.getElementById('kasfSubmit'); if(b){ b.disabled=false; b.textContent='Simpan Transaksi'; } }
}

    <div class="dw-field"><label>Saldo Awal (Rp) *</label><input type="number" id="kasSaldoAwal" min="0" step="1" value="${KAS_SALDO_AWAL}"></div>
    <div class="dw-formfoot"><button class="btn-outline-sm" onclick="closeAcadDrawer()">Batal</button><button class="btn-primary-sm" id="kasSaldoBtn" onclick="kasSaveSaldoAwal()">Simpan</button></div>`);
}
async function kasSaveSaldoAwal(){
  const n=Number(document.getElementById('kasSaldoAwal').value);
  if(!Number.isFinite(n)||n<0||!Number.isInteger(n)||n>100000000000){ akFormErr('akfError','Saldo awal harus bilangan bulat 0 atau lebih.'); return; }
  const btn=document.getElementById('kasSaldoBtn'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    const r=await dkClient().from('finance_settings').upsert({key:'kas_saldo_awal',value:{nominal:n},updated_at:new Date().toISOString()}).select();
    if(r.error) throw r.error; if(!r.data||!r.data.length) throw AK_RLS_ERR;
    KAS_SALDO_AWAL=n; closeAcadDrawer(); showAcadToast('Saldo awal kas tersimpan.'); ksRenderKasTable();
  }catch(e){ console.error('kasSaveSaldoAwal',e); akFormErr('akfError','Gagal menyimpan: '+kscErrMsg(e,'ubah',null)); const b=document.getElementById('kasSaldoBtn'); if(b){ b.disabled=false; b.textContent='Simpan'; } }
}

function ksProfileKeuanganTabContent(s){

  const invs=invoicesData.filter(inv=>inv.studentId===s.id).map(inv=>({inv,c:invoiceComputed(inv)}));

    <div class="dw-section">Riwayat Pembayaran</div>

/* ---- Presensi: status efektif (izin/cuti DISETUJUI menimpa) ---- */
function pgAttendanceOf(employeeId,date){ return employeeAttendanceData.find(a=>bdEq(a.employeeId,employeeId) && a.date===date); }
function pgApprovedLeave(employeeId,date){ return employeeLeavesData.find(l=>bdEq(l.employeeId,employeeId) && l.status==='Disetujui' && l.startDate<=date && l.endDate>=date); }
function pgEffectiveStatus(employeeId,date){
  const leave=pgApprovedLeave(employeeId,date);
  if(leave) return leave.leaveType==='Cuti'?'Cuti':(leave.leaveType==='Sakit'?'Sakit':'Izin');
  const att=pgAttendanceOf(employeeId,date);
  return att?att.status:'Belum Dicatat';
}
function pgWorkdays(ym){   /* hari kerja (Senin–Sabtu) pada bulan ym sampai hari ini */
  const y=Number(ym.slice(0,4)), m=Number(ym.slice(5,7))-1; const out=[]; const n=new Date(y,m+1,0).getDate();
  for(let d=1;d<=n;d++){ const dt=new Date(y,m,d); const iso=y+'-'+pgPad(m+1)+'-'+pgPad(d); if(dt.getDay()!==0&&iso<=PG_TODAY) out.push(iso); }
  return out;
}
/* ---- Izin/Cuti ---- */
function pgLeaveDurationDays(l){ const a=new Date(l.startDate+'T00:00:00'),b=new Date(l.endDate+'T00:00:00'); return Math.round((b-a)/86400000)+1; }
async function pgDecideLeave(id,status){

const PG_DOC_EXT=['pdf','jpg','jpeg','png','doc','docx'];

async function pgUploadDoc(){
  const M=KSC.ed; if(M.submitting) return;
  const sb=dkClient(); if(!sb){ akFormErr('akfError','Supabase belum terhubung.'); return; }
  const empId=pgProfileEmployeeId; const e=employeeOf(empId); if(!e) return;
  const type=document.getElementById('pdfType').value; const file=(document.getElementById('pdfFile').files||[])[0];
  let name=document.getElementById('pdfName').value.trim().replace(/\s+/g,' ');
  if(!file){ akFormErr('akfError','Pilih berkas yang akan diunggah.'); return; }
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(!PG_DOC_EXT.includes(ext)){ akFormErr('akfError','Jenis berkas tidak diizinkan. Gunakan PDF, JPG, PNG, DOC, atau DOCX.'); return; }
  if(file.size>PG_DOC_MAX){ akFormErr('akfError','Ukuran berkas melebihi 5 MB ('+pgFmtSize(file.size)+').'); return; }
  if(file.size<=0){ akFormErr('akfError','Berkas kosong.'); return; }
  if(!name) name=file.name.replace(/\.[^.]+$/,'');
  const path=empId+'/'+Date.now()+'-'+pgSafeFileName(file.name);
  akFormErr('akfError',''); M.submitting=true; const btn=document.getElementById('pdfSubmit'); if(btn){ btn.disabled=true; btn.textContent='Mengunggah...'; }
  let uploaded=false;
  try{
    const up=await sb.storage.from('employee-docs').upload(path,file,{upsert:false,contentType:file.type||undefined});
    if(up.error) throw up.error; uploaded=true;
    const r=await sb.from('employee_documents').insert({employee_id:empId,document_name:name,document_type:type,storage_path:path,file_size:file.size,uploaded_by:ROLE_NAME[curRole]||curRole}).select();
    if(r.error) throw r.error; if(!r.data||!r.data.length) throw AK_RLS_ERR;
    showAcadToast('Dokumen berhasil diunggah.'); await kscLoad('ed',{silent:true}); pgReopenProfile();
  }catch(err){
    console.error('pgUploadDoc',err);
    if(uploaded){ try{ await sb.storage.from('employee-docs').remove([path]); }catch(x){} }
    const raw=(err&&err.message)||String(err);
    akFormErr('akfError','Gagal mengunggah: '+(/bucket not found|not found/i.test(raw)?'bucket Storage "employee-docs" belum ada. Jalankan supabase-kepegawaian-setup.sql.':(/row-level security|violates|not authorized|403/i.test(raw)?'ditolak oleh kebijakan Storage (role tidak berhak atau kebijakan belum dibuat). Detail: '+raw:raw)));
  }finally{ M.submitting=false; const b=document.getElementById('pdfSubmit'); if(b){ b.disabled=false; b.textContent='Unggah'; } }
}

  const d=employeeDocumentsData.find(x=>bdEq(x.id,id)); if(!d) return null;

function pgKomposisiPegawai(){
  const aktif=employeesData.filter(e=>e.statusAktif==='Aktif'); const cat=['Guru','Staff','Karyawan','Tenaga Kependidikan'];
  const palette={'Guru':'#1D6FA3','Staff':'#6C4FC7','Karyawan':'#1C8A5A','Tenaga Kependidikan':'#C9A227'};
  return cat.map(c=>({label:c,value:aktif.filter(e=>e.jenisPegawai===c).length,color:palette[c]})).filter(x=>x.value>0);
}
function pgKehadiranHariIniChart(){
  const cats=['Hadir','Terlambat','Izin','Sakit','Cuti','Alpa']; const palette={'Hadir':'#1C8A5A','Terlambat':'#C9A227','Izin':'#1D6FA3','Sakit':'#B8630F','Cuti':'#6C4FC7','Alpa':'#C0392B'};
  return cats.map(c=>({label:c,value:pgAttendanceCountToday(c),color:palette[c]}));
}
function pgRekapOf(employeeId,ym){
  const days=pgWorkdays(ym); const c={Hadir:0,Terlambat:0,Izin:0,Sakit:0,Cuti:0,Alpa:0}; let total=0;
  days.forEach(d=>{ const st=pgEffectiveStatus(employeeId,d); if(st in c){ c[st]++; total++; } });
  const persentase=total?Math.round((c.Hadir+c.Terlambat)/total*1000)/10:0;
  return {hadir:c.Hadir,terlambat:c.Terlambat,izin:c.Izin,sakit:c.Sakit,cuti:c.Cuti,alpa:c.Alpa,total,persentase};
}

  monthPrefix=monthPrefix||PG_TODAY.slice(0,7);
  return employeesData.filter(e=>e.statusAktif==='Aktif').map(e=>({nama:e.nama,...pgRekapOf(e.id,monthPrefix)}));
}

async function pgSubmitForm(id){
  const M=KSC.em; if(M.submitting) return;
  if(!pgCanManage()){ akFormErr('akfError','Anda tidak memiliki izin.'); return; }
  const sb=dkClient(); if(!sb){ akFormErr('akfError','Supabase belum terhubung.'); return; }
  const v=k=>document.getElementById(k).value.trim();
  const nama=v('pgfNama').replace(/\s+/g,' ');
  if(!nama){ akFormErr('akfError','Nama lengkap wajib diisi.'); return; }
  const nik=v('pgfNik'), nip=v('pgfNip'), nuptk=v('pgfNuptk'), rek=v('pgfNoRek'), hp=v('pgfNoHp'), email=v('pgfEmail');
  if(nik&&!/^\d{16}$/.test(nik)){ akFormErr('akfError','NIK harus 16 digit angka.'); return; }
  if(nip&&!/^[\d ]{5,30}$/.test(nip)){ akFormErr('akfError','NIP hanya berisi angka (5–30 digit).'); return; }
  if(nuptk&&!/^\d{8,30}$/.test(nuptk)){ akFormErr('akfError','NUPTK hanya berisi angka.'); return; }
  if(rek&&!/^\d{5,25}$/.test(rek)){ akFormErr('akfError','No. rekening hanya berisi angka (5–25 digit).'); return; }
  if(hp&&!/^[\d+\-\s()]{6,20}$/.test(hp)){ akFormErr('akfError','No. HP tidak valid.'); return; }
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ akFormErr('akfError','Format email tidak valid.'); return; }
  const tl=v('pgfTanggalLahir'); if(tl&&tl>pgNowIso()){ akFormErr('akfError','Tanggal lahir tidak boleh di masa depan.'); return; }
  const raws=Object.values(M.raw).filter(x=>String(x.id)!==String(id||''));
  if(nik&&raws.some(x=>x.nik===nik)){ akFormErr('akfError','NIK ini sudah terdaftar pada pegawai lain.'); return; }
  if(nip&&raws.some(x=>x.nip===nip)){ akFormErr('akfError','NIP ini sudah terdaftar pada pegawai lain.'); return; }
  const payload={nama,nik:pgNullIf(nik),nip:pgNullIf(nip),nuptk:pgNullIf(nuptk),jk:v('pgfJk'),tempat_lahir:pgNullIf(v('pgfTempatLahir')),tanggal_lahir:pgNullIf(tl),
    alamat:pgNullIf(v('pgfAlamat')),no_hp:pgNullIf(hp),email:pgNullIf(email),jenis_pegawai:v('pgfJenisPegawai'),jabatan:pgNullIf(v('pgfJabatan')),status_kepegawaian:v('pgfStatusKepegawaian'),
    pendidikan:pgNullIf(v('pgfPendidikan')),bidang_keahlian:pgNullIf(v('pgfBidang')),mapel:pgNullIf(v('pgfMapel')),tanggal_mulai_kerja:pgNullIf(v('pgfTanggalMulai')),
    no_rekening:pgNullIf(rek),nama_bank:pgNullIf(v('pgfBank')),nama_pemilik_rekening:pgNullIf(v('pgfPemilikRek')),status_aktif:v('pgfAktif'),catatan:pgNullIf(v('pgfCatatan'))};
  akFormErr('akfError',''); M.submitting=true; const btn=document.getElementById('pgfSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    const res=id? await sb.from('employees').update(payload).eq('id',id).select() : await sb.from('employees').insert(payload).select();
    if(res.error) throw res.error; if(!res.data||!res.data.length) throw AK_RLS_ERR;
    closeAcadDrawer(); showAcadToast(id?'Data pegawai diperbarui.':'Pegawai baru berhasil disimpan.'); await kscLoad('em',{silent:true});
  }catch(e){ console.error('pgSubmitForm',e); akFormErr('akfError','Gagal menyimpan: '+(e&&e.code==='23505'?'NIK/NIP/kode pegawai sudah dipakai pegawai lain.':kscErrMsg(e,id?'ubah':'tambah',M.cfg))); }
  finally{ M.submitting=false; const b=document.getElementById('pgfSubmit'); if(b){ b.disabled=false; b.textContent=id?'Simpan Perubahan':'Simpan Pegawai'; } }
}

let psFilter={pegawai:'',jabatan:'',status:''};
let psView='harian'; let psDate=pgNowIso(); let psMonth=pgNowIso().slice(0,7);
function pgDuration(att){
  if(att && att.checkIn!=='-' && att.checkOut!=='-'){
    const [h1,m1]=att.checkIn.split(':').map(Number), [h2,m2]=att.checkOut.split(':').map(Number);
    const mins=(h2*60+m2)-(h1*60+m1); if(mins>0) return Math.floor(mins/60)+'j '+(mins%60)+'m';
  }
  return '-';
}
function psFilteredDay(){
  const f=psFilter;
  return employeesData.filter(e=>e.statusAktif==='Aktif').filter(e=>(!f.pegawai||bdEq(e.id,f.pegawai))&&(!f.jabatan||e.jabatan===f.jabatan)).map(e=>{
    const att=pgAttendanceOf(e.id,psDate); const status=pgEffectiveStatus(e.id,psDate);
    return {e,att,status,durasi:pgDuration(att)};
  }).filter(x=>!f.status||x.status===f.status);
}
function psRenderHarian(){
  const el=document.getElementById('psBody'); if(!el) return; const rows=psFilteredDay();
  el.innerHTML = rows.length? `<table><tr><th>Nama</th><th>Jabatan</th><th>Jam Masuk</th><th>Jam Pulang</th><th>Durasi Kerja</th><th>Status</th></tr>
    ${rows.map(({e,att,status,durasi})=>`<tr style="cursor:pointer" onclick="pgOpenEmployeeProfile('${dkEsc(e.id)}','presensi')"><td><b>${e.nama}</b></td><td>${e.jabatan}</td><td>${att?att.checkIn:'-'}</td><td>${att?att.checkOut:'-'}</td><td>${durasi}</td><td>${acadStatusBadge(status)}</td></tr>`).join('')}
    </table>` : acadEmptyStateHtml('Tidak ada data presensi','Coba ubah filter pegawai, jabatan, atau status.');
}
function psRenderRekap(){
  const el=document.getElementById('psBody'); if(!el) return; const rows=pgRekapBulanan(psMonth);
  el.innerHTML = rows.length? `<table><tr><th>Pegawai</th><th>Hadir</th><th>Terlambat</th><th>Izin</th><th>Sakit</th><th>Cuti</th><th>Alpa</th><th>Persentase</th></tr>
    ${rows.map(r=>`<tr><td><b>${r.nama}</b></td><td>${r.hadir}</td><td>${r.terlambat}</td><td>${r.izin}</td><td>${r.sakit}</td><td>${r.cuti}</td><td>${r.alpa}</td><td>${r.total?r.persentase+'%':'-'}</td></tr>`).join('')}
    </table>` : acadEmptyStateHtml('Belum ada data','Rekap presensi bulanan akan tampil di sini.');
}
function psSetView(v){
  psView=v;
  document.querySelectorAll('#psViewToggle button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  const fr=document.getElementById('psFilterRow'); if(fr) fr.style.display=v==='harian'?'contents':'none';
  const dt=document.getElementById('psDate'); if(dt) dt.style.display=v==='harian'?'':'none';
  const mn=document.getElementById('psMonth'); if(mn) mn.style.display=v==='rekap'?'':'none';
  psRenderBody();
}
function psRenderBody(){ psView==='harian'?psRenderHarian():psRenderRekap(); }
function psOnFilterChange(){
  const v=id=>{const e=document.getElementById(id);return e?e.value:''};
  psFilter={pegawai:v('psPegawai'),jabatan:v('psJabatan'),status:v('psStatus')};
  psDate=v('psDate')||pgNowIso(); psMonth=v('psMonth')||pgNowIso().slice(0,7);
  psRefreshStats(); psRenderBody();
}
function psStatsArray(){
  const day=employeesData.filter(e=>e.statusAktif==='Aktif').map(e=>pgEffectiveStatus(e.id,psDate)); const c=st=>day.filter(x=>x===st).length;
  return [
    {color:'blue',val:day.length,label:'Total Pegawai'},{color:'green',val:c('Hadir'),label:'Hadir'},
    {color:'orange',val:c('Terlambat'),label:'Terlambat'},{color:'indigo',val:c('Izin'),label:'Izin'},
    {color:'teal',val:c('Sakit'),label:'Sakit'},{color:'purple',val:c('Cuti'),label:'Cuti'},{color:'red',val:c('Alpa'),label:'Alpa'},
    {color:'gray',val:c('Belum Dicatat'),label:'Belum Dicatat'}
  ];
}
function psRefreshStats(){ const st=document.getElementById('psStats'); if(st) st.innerHTML=acadStatRowHtml(psStatsArray()); }
function psRefresh(){
  psRefreshStats();
  const act=employeesData.filter(e=>e.statusAktif==='Aktif');
  kscFillSelect('psPegawai',act.map(e=>({value:e.id,label:e.nama})));
  kscFillSelect('psJabatan',bdUniq(employeesData.map(e=>e.jabatan)).map(j=>({value:j,label:j})));
  psRenderBody();
}
function psMonthOptions(){
  const out=[]; const now=new Date(PG_TODAY+'T00:00:00');
  for(let i=0;i<12;i++){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); out.push(d.getFullYear()+'-'+pgPad(d.getMonth()+1)); }
  return out;
}
const PS_STATUS=['Hadir','Terlambat','Izin','Sakit','Cuti','Alpa'];
function psExport(){
  if(psView==='harian'){
    const rows=psFilteredDay(); if(!rows.length){ showAcadToast('Tidak ada data untuk diekspor.'); return; }
    akDownloadCsv('presensi-pegawai-'+psDate+'.csv',['Tanggal','Nama','Jabatan','Jam Masuk','Jam Pulang','Durasi','Status'],rows.map(({e,att,status,durasi})=>[psDate,e.nama,e.jabatan,att?att.checkIn:'-',att?att.checkOut:'-',durasi,status]));
  }else{
    const rows=pgRekapBulanan(psMonth); if(!rows.length){ showAcadToast('Tidak ada data untuk diekspor.'); return; }
    akDownloadCsv('rekap-presensi-pegawai-'+psMonth+'.csv',['Pegawai','Hadir','Terlambat','Izin','Sakit','Cuti','Alpa','Persentase'],rows.map(r=>[r.nama,r.hadir,r.terlambat,r.izin,r.sakit,r.cuti,r.alpa,r.total?r.persentase+'%':'-']));
  }
}
function psPrint(){
  const body=document.getElementById('psBody'); if(!body||!body.querySelector('table')){ showAcadToast('Tidak ada data untuk dicetak.'); return; }
  kgOpenPrint('Presensi Pegawai','<h2>PRESENSI PEGAWAI</h2><div class="sub">'+(psView==='harian'?'Tanggal '+fmtTglID(psDate):'Rekap bulan '+kgMonthNames[Number(psMonth.slice(5,7))-1]+' '+psMonth.slice(0,4))+'</div>'+body.innerHTML);
}
/* ---- Form input presensi (satu tanggal, semua pegawai aktif) ---- */
function psOpenInput(){
  if(!pgCanManage()){ showAcadToast('Anda tidak memiliki hak untuk menginput presensi pegawai.'); return; }
  if(!employeesData.some(e=>e.statusAktif==='Aktif')){ showAcadToast('Belum ada pegawai aktif.'); return; }
  openAcadDrawer('Input Presensi Pegawai',AK_ERRBOX+`
    <div class="dw-field"><label>Tanggal *</label><input type="date" id="psiTanggal" value="${dkEsc(psDate)}" max="${pgNowIso()}" onchange="psiRender()"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><b style="font-size:12px">Pegawai Aktif</b><button class="btn-outline-sm" onclick="psiAllHadir()">Semua Hadir (07:00–15:30)</button></div>
    <div id="psiList" style="overflow-x:auto"></div>
    <div class="dw-formfoot"><button class="btn-outline-sm" onclick="closeAcadDrawer()">Batal</button><button class="btn-primary-sm" id="psiSubmit" onclick="psiSave()">Simpan Presensi</button></div>`);
  psiRender();
}
function psiRender(){
  const el=document.getElementById('psiList'); if(!el) return; const tgl=document.getElementById('psiTanggal').value;
  const act=employeesData.filter(e=>e.statusAktif==='Aktif');
  el.innerHTML=`<table><tr><th>Pegawai</th><th>Status</th><th>Masuk</th><th>Pulang</th></tr>${act.map(e=>{
    const lv=pgApprovedLeave(e.id,tgl); const a=pgAttendanceOf(e.id,tgl);
    if(lv) return `<tr><td>${e.nama}</td><td colspan="3"><span class="badge b-amber">${lv.leaveType} disetujui</span> (tidak perlu diinput)</td></tr>`;
    const cur=a?a.status:'-';
    return `<tr><td>${e.nama}</td><td><select id="psi_st_${dkEsc(e.id)}"><option value="-">-</option>${akOptHtml(PS_STATUS,cur)}</select></td>
      <td><input type="time" id="psi_in_${dkEsc(e.id)}" value="${a&&a.checkIn!=='-'?a.checkIn:''}"></td><td><input type="time" id="psi_out_${dkEsc(e.id)}" value="${a&&a.checkOut!=='-'?a.checkOut:''}"></td></tr>`;
  }).join('')}</table>`;
}
function psiAllHadir(){
  const tgl=document.getElementById('psiTanggal').value;
  employeesData.filter(e=>e.statusAktif==='Aktif'&&!pgApprovedLeave(e.id,tgl)).forEach(e=>{
    const st=document.getElementById('psi_st_'+e.id), i=document.getElementById('psi_in_'+e.id), o=document.getElementById('psi_out_'+e.id);
    if(st) st.value='Hadir'; if(i&&!i.value) i.value='07:00'; if(o&&!o.value) o.value='15:30';
  });
}
async function psiSave(){
  const M=KSC.ea; if(M.submitting) return;
  if(!pgCanManage()){ akFormErr('akfError','Anda tidak memiliki izin.'); return; }
  const tgl=document.getElementById('psiTanggal').value; if(!tgl){ akFormErr('akfError','Tanggal wajib diisi.'); return; }
  if(tgl>pgNowIso()){ akFormErr('akfError','Tanggal tidak boleh di masa depan.'); return; }
  const ins=[], upd=[], del=[];
  for(const e of employeesData.filter(x=>x.statusAktif==='Aktif')){
    if(pgApprovedLeave(e.id,tgl)) continue;
    const st=document.getElementById('psi_st_'+e.id).value; const ci=document.getElementById('psi_in_'+e.id).value, co=document.getElementById('psi_out_'+e.id).value;
    const ex=pgAttendanceOf(e.id,tgl);
    if(st==='-'){ if(ex) del.push(ex.id); continue; }
    const hadir=(st==='Hadir'||st==='Terlambat');
    if(hadir&&ci&&co&&co<=ci){ akFormErr('akfError','Jam pulang harus setelah jam masuk ('+akUnesc(e.nama)+').'); return; }
    const row={employee_id:e.id,tanggal:tgl,status:st,check_in:hadir&&ci?ci:null,check_out:hadir&&co?co:null};
    if(ex){ row.id=ex.id; upd.push(row); } else ins.push(row);
  }
  if(!ins.length&&!upd.length&&!del.length){ akFormErr('akfError','Belum ada status presensi yang dipilih.'); return; }
  akFormErr('akfError',''); M.submitting=true; const btn=document.getElementById('psiSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    await bdBulkSave('employee_attendance',ins,upd);
    for(const id of del){ const r=await dkClient().from('employee_attendance').delete().eq('id',id).select(); if(r.error) throw r.error; if(!r.data||!r.data.length) throw AK_RLS_ERR; }
    psDate=tgl; const d=document.getElementById('psDate'); if(d) d.value=tgl;
    closeAcadDrawer(); showAcadToast('Presensi pegawai tersimpan.'); await kscLoad('ea',{silent:true});
  }catch(e){ console.error('psiSave',e); akFormErr('akfError','Gagal menyimpan: '+kscErrMsg(e,'tambah',M.cfg)); }
  finally{ M.submitting=false; const b=document.getElementById('psiSubmit'); if(b){ b.disabled=false; b.textContent='Simpan Presensi'; } }
}

function jmOnFilterChange(){

async function izSubmitForm(){
  const M=KSC.el; if(M.submitting) return; const sb=dkClient(); if(!sb){ akFormErr('akfError','Supabase belum terhubung.'); return; }
  if(!pgCanManage()){ akFormErr('akfError','Anda tidak memiliki izin.'); return; }
  const v=id=>document.getElementById(id).value.trim();
  const emp=v('izfPegawai'), jenis=v('izfJenis'), mulai=v('izfMulai'), selesai=v('izfSelesai'), alasan=v('izfAlasan').replace(/\s+/g,' ');
  if(!emp||!mulai||!selesai){ akFormErr('akfError','Pegawai dan tanggal wajib diisi.'); return; }
  if(selesai<mulai){ akFormErr('akfError','Tanggal selesai tidak boleh sebelum tanggal mulai.'); return; }
  if(!alasan){ akFormErr('akfError','Alasan wajib diisi.'); return; }
  const clash=employeeLeavesData.find(l=>bdEq(l.employeeId,emp)&&l.status!=='Ditolak'&&l.startDate<=selesai&&l.endDate>=mulai);
  if(clash){ akFormErr('akfError','Pegawai ini sudah punya pengajuan '+clash.leaveType+' ('+clash.status+') yang beririsan: '+fmtTglID(clash.startDate)+' – '+fmtTglID(clash.endDate)+'.'); return; }
  akFormErr('akfError',''); M.submitting=true; const btn=document.getElementById('izfSubmit'); if(btn){ btn.disabled=true; btn.textContent='Mengirim...'; }
  try{
    const r=await sb.from('employee_leaves').insert({employee_id:emp,leave_type:jenis,start_date:mulai,end_date:selesai,reason:alasan,attachment_url:pgNullIf(v('izfLampiran')),status:'Menunggu'}).select();
    if(r.error) throw r.error; if(!r.data||!r.data.length) throw AK_RLS_ERR;
    closeAcadDrawer(); showAcadToast('Pengajuan tercatat dan menunggu persetujuan.'); await kscLoad('el',{silent:true});
  }catch(e){ console.error('izSubmitForm',e); akFormErr('akfError','Gagal menyimpan: '+kscErrMsg(e,'tambah',M.cfg)); }
  finally{ M.submitting=false; const b=document.getElementById('izfSubmit'); if(b){ b.disabled=false; b.textContent='Kirim Pengajuan'; } }
}

/* ========================================================================
   SARPRAS (Sarana & Prasarana) — dikembangkan di atas 4 menu yang sudah
   ada (Inventaris Aset, Laporan Kerusakan, Perbaikan, Pengajuan Barang),
   TANPA menambah menu baru di sidebar. Sub-fitur yang tidak punya menu
   sendiri (Dashboard, Lokasi/Ruangan, Peminjaman, Stock Opname, Mutasi,
   Laporan) dijadikan bagian/tab/toggle di dalam 4 halaman itu — persis
   pola yang sudah dipakai di Akademik/Kesiswaan/Kepegawaian:
   - "Dashboard Sarpras" + "Laporan Rekap Inventaris"  -> bagian atas
     halaman Inventaris Aset.
   - "Lokasi/Ruangan", "Peminjaman Barang", "Stock Opname" -> view-toggle
     di dalam halaman Inventaris Aset (karena sama-sama berpusat pada
     data aset yang sama).
   - "Mutasi/Perpindahan Aset" -> aksi + riwayat di dalam Detail Aset
     (tab Riwayat), bukan halaman terpisah.
   asset_id menjadi ID utama yang dipakai di seluruh sub-fitur.
   ======================================================================== */

/* ---- asset_loans (Peminjaman) ---- */
const assetLoansData=[];
function spLoanApprove(id){
  if(!spCanManage()){ showAcadToast('Anda tidak memiliki hak untuk menyetujui peminjaman.'); return; }
  const l=assetLoansData.find(x=>x.id===id); if(!l) return;
  l.status='Dipinjam'; l.penanggungJawab=ROLE_NAME[curRole]||curRole;
  const a=assetOf(l.assetId); if(a) a.status='Dipinjam';
  showAcadToast('Peminjaman disetujui — status aset otomatis menjadi Dipinjam.');
  if(document.getElementById('spLoanBody')) spRenderLoans();
}
function spLoanReturn(id){
  if(!spCanManage()){ showAcadToast('Anda tidak memiliki hak untuk mencatat pengembalian.'); return; }
  const l=assetLoansData.find(x=>x.id===id); if(!l) return;
  l.status='Dikembalikan'; l.aktualKembali=SP_TODAY;
  const a=assetOf(l.assetId);
  if(a && !assetLoansData.some(x=>x.assetId===a.id && x.status==='Dipinjam' && x.id!==id)) a.status='Aktif';
  showAcadToast('Pengembalian dicatat — status aset otomatis kembali menjadi Aktif.');
  if(document.getElementById('spLoanBody')) spRenderLoans();
}
function spLoanReject(id){
  openAcadConfirm('Tolak Peminjaman','Yakin ingin menolak pengajuan peminjaman ini?',()=>{
    const l=assetLoansData.find(x=>x.id===id); if(!l) return;
    l.status='Ditolak'; showAcadToast('Peminjaman ditolak.');
    if(document.getElementById('spLoanBody')) spRenderLoans();
  });
}

  if(!spCanManage()){ showAcadToast('Anda tidak memiliki hak untuk meneruskan ke perbaikan.'); return; }
  const d=damageReportsData.find(x=>x.id===id); if(!d) return;
  __spMtCounter=Math.max(__spMtCounter,maintenanceRecordsData.length)+1;
  const mid='MT'+String(__spMtCounter).padStart(4,'0');
  maintenanceRecordsData.push({id:mid,assetId:d.assetId,damageReportId:d.id,teknisi:'Belum ditentukan',tanggalMulai:SP_TODAY,targetSelesai:kgAddDays(SP_TODAY,5),

  showAcadToast('Laporan diteruskan ke Perbaikan — status aset otomatis menjadi Dalam Perbaikan.');
  if(document.getElementById('drBody')) drRenderTable();
}
function spOpenDamageDetail(id){
  const d=damageReportsData.find(x=>x.id===id); if(!d) return;
  const a=assetOf(d.assetId);
  openAcadDrawer('Detail Laporan Kerusakan',`${dwRow('Nama Barang',a?a.name:'-')}${dwRow('Lokasi',a?a.ruangan:'-')}${dwRow('Jenis Kerusakan',d.damageType)}

    <div class="dw-section">Deskripsi</div><p class="dw-para">${d.description}</p>

function pgCanManageDamageActions(d){
  if(!spCanManage()) return '';
  let btns='';
  if(d.status==='Dilaporkan') btns+=`<button class="btn-outline-sm" onclick="spVerifyDamage('${d.id}');closeAcadDrawer();">Verifikasi</button>`;
  if(d.status==='Diverifikasi'||d.status==='Dilaporkan') btns+=`<button class="btn-primary-sm" onclick="spForwardToMaintenance('${d.id}');closeAcadDrawer();">🛠 Teruskan ke Perbaikan</button>`;
  return btns?`<div class="dw-formfoot">${btns}</div>`:'';
}

function spCompleteMaintenance(id){
  if(!spCanManage()){ showAcadToast('Anda tidak memiliki hak untuk menyelesaikan perbaikan.'); return; }
  const m=maintenanceRecordsData.find(x=>x.id===id); if(!m) return;
  openAcadConfirm('Selesaikan Perbaikan','Tandai perbaikan ini selesai? Kondisi aset akan diubah menjadi Baik dan status kembali Aktif.',()=>{
    m.status='Selesai'; m.tanggalSelesai=SP_TODAY;
    if(m.biaya<=0) m.biaya=250000+Math.floor(Math.random()*300000);
    const a=assetOf(m.assetId); if(a){ a.kondisi='Baik'; a.status='Aktif'; }
    if(m.damageReportId){ const d=damageReportsData.find(x=>x.id===m.damageReportId); if(d) d.status='Selesai'; }
    showAcadToast('Perbaikan selesai — kondisi aset otomatis kembali menjadi Baik.');
    if(document.getElementById('mtBody')) mtRenderTable();
  });
}

/* ---- procurement_requests (Pengadaan) ---- */
const PROCUREMENT_FLOW=['Pengajuan','Diverifikasi','Disetujui','Diproses','Dibeli','Selesai'];
const procurementRequestsData=[];
function spProcurementNextStage(id){
  if(!spCanManage() && !(curRole==='Kepala Sekolah'&&['Diverifikasi'].includes(procurementRequestsData.find(p=>p.id===id).status))){
    showAcadToast('Anda tidak memiliki hak untuk memproses pengajuan ini.'); return;
  }
  const p=procurementRequestsData.find(x=>x.id===id); if(!p) return;
  const idx=PROCUREMENT_FLOW.indexOf(p.status);
  if(idx<0||idx>=PROCUREMENT_FLOW.length-1) return;
  p.status=PROCUREMENT_FLOW[idx+1];
  showAcadToast('Status pengajuan diperbarui menjadi "'+p.status+'".');
  if(document.getElementById('paBody')) paRenderTable();
}
function spProcurementReject(id){
  openAcadConfirm('Tolak Pengajuan','Yakin ingin menolak pengajuan pengadaan ini?',()=>{
    const p=procurementRequestsData.find(x=>x.id===id); if(!p) return;
    p.status='Ditolak'; showAcadToast('Pengajuan ditolak.');
    if(document.getElementById('paBody')) paRenderTable();
  });
}
function spReceiveProcurement(id){
  if(!spCanManage()){ showAcadToast('Anda tidak memiliki hak untuk menerima barang.'); return; }
  const p=procurementRequestsData.find(x=>x.id===id); if(!p) return;
  if(p.status!=='Dibeli'){ showAcadToast('Barang hanya bisa diterima setelah status "Dibeli".'); return; }
  const loc=locationOf(p.unitRuangan);
  const newId=spNextAssetId();
  assetsData.push({id:newId,assetCode:'SAR-NEW-'+newId.slice(-4),name:p.namaBarang,category:p.kategori,merk:'-',model:'-',serialNumber:'-',
    jumlah:p.jumlah,satuan:'Unit',tahunPerolehan:SP_TODAY.slice(0,4),hargaPerolehan:p.estimasiHarga,sumberDana:'Pengadaan',tanggalPerolehan:SP_TODAY,
    gedung:loc?loc.gedung:'-',ruangan:p.unitRuangan,kondisi:'Baik',status:'Aktif',catatan:'Dibuat otomatis dari pengadaan '+p.id+'.'});
  p.status='Selesai'; p.createdAssetId=newId;
  showAcadToast('Barang diterima — data aset baru otomatis dibuat di Inventaris ('+newId+').');
  if(document.getElementById('paBody')) paRenderTable();
}
function spOpenProcurementForm(){
  openAcadDrawer('Ajukan Pengadaan Barang',`
    <div class="dw-field"><label>Unit/Ruangan</label><select id="pafRuangan">${locationsData.map(l=>`<option value="${l.ruangan}">${l.ruangan}</option>`).join('')}</select></div>
    <div class="dw-field-row">
      <div class="dw-field"><label>Nama Barang</label><input type="text" id="pafNama"></div>
      <div class="dw-field"><label>Kategori</label><select id="pafKategori">${ASSET_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div>
    </div>
    <div class="dw-field-row">
      <div class="dw-field"><label>Jumlah</label><input type="number" id="pafJumlah" min="1" value="1"></div>

function spKondisiChart(){
  const cats=['Baik','Rusak Ringan','Rusak Berat','Dalam Perbaikan'];
  const palette={'Baik':'#1C8A5A','Rusak Ringan':'#C9A227','Rusak Berat':'#C0392B','Dalam Perbaikan':'#1D6FA3'};
  return cats.map(c=>({label:c,value:assetsData.filter(a=>a.kondisi===c).length,color:palette[c]})).filter(x=>x.value>0);
}
function spJenisAsetChart(){
  const palette=['#1D6FA3','#6C4FC7','#1C8A5A','#1F8A82','#4553B8','#0E9A6C','#B8630F','#C0392B','#C9A227','#5B7285'];
  return ASSET_CATEGORIES.map((c,i)=>({label:c,value:assetsData.filter(a=>a.category===c).length,color:palette[i%palette.length]})).filter(x=>x.value>0);
}
function spPerluPerhatianItems(){
  const items=[];
  assetsData.filter(a=>a.kondisi==='Rusak Ringan'||a.kondisi==='Rusak Berat').forEach(a=>items.push({nama:a.name,ket:'Kondisi '+a.kondisi+' — '+a.ruangan,prioritas:a.kondisi==='Rusak Berat'?'urgent':'warn',waktu:'-'}));
  maintenanceRecordsData.filter(m=>m.status!=='Selesai').forEach(m=>{const a=assetOf(m.assetId); items.push({nama:a?a.name:'-',ket:'Perbaikan belum selesai ('+m.status+')',prioritas:'warn',waktu:fmtTglID(m.targetSelesai)});});
  assetLoansData.filter(l=>l.status==='Terlambat').forEach(l=>{const a=assetOf(l.assetId); items.push({nama:a?a.name:'-',ket:'Peminjaman terlambat dikembalikan oleh '+l.peminjam,prioritas:'urgent',waktu:fmtTglID(l.rencanaKembali)});});
  procurementRequestsData.filter(p=>['Pengajuan','Diverifikasi'].includes(p.status)).forEach(p=>items.push({nama:p.namaBarang,ket:'Pengadaan belum diproses ('+p.status+')',prioritas:'warn',waktu:'-'}));
  return items;
}
