/* ========================================================================
   PENGUMUMAN WALI SANTRI/ORANG TUA (ko-pengumuman) & PENGATURAN
   (pt-sekolah, pt-user, pt-notif) — dikembangkan di atas menu yang sudah
   ada, tanpa menu baru. Target penerima pengumuman di-resolve otomatis
   dari studentsData (Kesiswaan) — TIDAK ada data wali santri baru yang
   dibuat khusus untuk modul ini.
   ======================================================================== */
const PU_TODAY='2026-09-24';
function puNow(){ return new Date().toISOString(); }

/* ---- announcements ---- */
const announcementsData=[];
/* ---- announcement_recipients ---- */
const announcementRecipientsData=[];
function puResolveRecipients(targetType,targetValue){
  const aktif=studentsData.filter(s=>s.status==='Aktif');
  if(targetType==='Semua Wali Santri') return aktif;
  if(targetType==='Kelas') return aktif.filter(s=>s.kelas===targetValue);
  if(targetType==='Santri') return aktif.filter(s=>s.id===targetValue);
  if(targetType==='Kelompok'){
    if(targetValue==='Santri Asrama') return aktif.filter(s=>s.boarding);
    if(targetValue==='Santri Pulang Pergi') return aktif.filter(s=>!s.boarding);
    return aktif.filter(s=>s.waliKelas===targetValue);
  }
  return [];
}
function puGenerateRecipients(ann){
  if(announcementRecipientsData.some(r=>r.announcementId===ann.id)) return;
  const targets=puResolveRecipients(ann.targetType,ann.targetValue);
  targets.forEach((s,i)=>{
    // simulasi sebagian sudah membaca (deterministik, bukan acak, supaya konsisten tiap render)
    const sudahBaca=(i%3)!==0;
    announcementRecipientsData.push({id:ann.id+'-R'+String(i+1).padStart(3,'0'),announcementId:ann.id,recipientId:s.id,readAt:sudahBaca?ann.publishDate+'T09:00:00':null});
  });
}
announcementsData.filter(a=>a.status==='Dipublikasikan'||a.status==='Arsip').forEach(puGenerateRecipients);

function puCheckScheduled(){
  const now=PU_TODAY;
  announcementsData.filter(a=>a.status==='Terjadwal' && a.publishDate<=now).forEach(a=>{
    a.status='Dipublikasikan'; puGenerateRecipients(a);
    pushAuditLog('Publikasi Pengumuman','Pengumuman','"'+a.title+'" dipublikasikan otomatis sesuai jadwal.');
  });
}
const ANNOUNCEMENT_CATEGORIES=['Akademik','Keuangan','Kesiswaan','Boarding/Asrama','Kegiatan','Jadwal','Administrasi','Darurat','Umum'];
const ANNOUNCEMENT_TEMPLATES=[
  {key:'pembayaran',label:'Template Pembayaran',title:'Pengingat Pembayaran Administrasi',category:'Keuangan',content:'Kami mengingatkan wali santri bahwa pembayaran administrasi bulan ini jatuh tempo pada tanggal ___. Mohon melakukan pembayaran tepat waktu.'},
  {key:'kegiatan',label:'Template Kegiatan',title:'Informasi Kegiatan Santri',category:'Kegiatan',content:'Sekolah akan mengadakan kegiatan ___ pada tanggal ___ pukul ___. Mohon partisipasi dan dukungan wali santri.'},
  {key:'libur',label:'Template Libur',title:'Informasi Libur/Pulang Santri',category:'Jadwal',content:'Diberitahukan bahwa santri akan libur/pulang pada tanggal ___ sampai dengan ___. Mohon wali santri mempersiapkan penjemputan.'},
  {key:'akademik',label:'Template Akademik',title:'Informasi Akademik',category:'Akademik',content:'Diberitahukan kepada wali santri terkait informasi akademik: ___.'},
  {key:'asrama',label:'Template Asrama',title:'Informasi Kehidupan Asrama',category:'Boarding/Asrama',content:'Diberitahukan kepada wali santri terkait kehidupan asrama: ___.'}
];
function announcementOf(id){ return announcementsData.find(a=>a.id===id); }
let __puAnnCounter=announcementsData.length;

/* ---- CRUD & workflow Pengumuman ---- */
function puSaveAnnouncement(data,status){
  const now=puNow();
  let ann;
  if(data.id){
    ann=announcementOf(data.id); if(!ann) return;
    Object.assign(ann,data,{status,updatedAt:now});
  } else {
    __puAnnCounter++;
    ann={id:'ANN'+String(__puAnnCounter).padStart(4,'0'),...data,status,isPinned:false,createdBy:ROLE_NAME[curRole]||curRole,createdAt:now,updatedAt:now};
    announcementsData.unshift(ann);
  }
  if(status==='Dipublikasikan'){ puGenerateRecipients(ann); pushAuditLog('Publikasi Pengumuman','Pengumuman','"'+ann.title+'" dipublikasikan.'); }
  else if(status==='Terjadwal') pushAuditLog('Jadwalkan Pengumuman','Pengumuman','"'+ann.title+'" dijadwalkan pada '+fmtTglID(ann.publishDate)+' '+ann.publishTime+'.');
  else pushAuditLog('Simpan Draft Pengumuman','Pengumuman','"'+ann.title+'" disimpan sebagai draft.');
  return ann;
}
function puTogglePin(id){
  const a=announcementOf(id); if(!a) return;
  a.isPinned=!a.isPinned; showAcadToast(a.isPinned?'Pengumuman dipin ke bagian atas.':'Pin dilepas.');
  puRenderList();
}
function puArchive(id){
  const a=announcementOf(id); if(!a) return;
  openAcadConfirm('Arsipkan Pengumuman','Pengumuman akan dipindah ke Arsip. Data tetap tersimpan dan dapat dilihat kembali. Lanjutkan?',()=>{
    a.status='Arsip'; showAcadToast('Pengumuman diarsipkan.'); puRenderList();
  });
}
function puMarkRead(recipientRowId){
  const r=announcementRecipientsData.find(x=>x.id===recipientRowId); if(!r) return;
  r.readAt=r.readAt?null:puNow();
  showAcadToast(r.readAt?'Ditandai sudah dibaca.':'Ditandai belum dibaca.');
  puOpenDetail(r.announcementId);
}

/* ---- Filter & render Daftar Pengumuman ---- */
let puFilter={q:'',kategori:'',status:''};
function puFilteredRows(){
  puCheckScheduled();
  const f=puFilter;
  const rows=announcementsData.filter(a=>
    (!f.q||a.title.toLowerCase().includes(f.q.toLowerCase())) && (!f.kategori||a.category===f.kategori) && (!f.status||a.status===f.status)
  );
  return rows.slice().sort((a,b)=>{
    if(a.isPinned!==b.isPinned) return a.isPinned?-1:1;
    return (b.createdAt||'').localeCompare(a.createdAt||'');
  });
}
function puTargetLabel(a){
  if(a.targetType==='Semua Wali Santri') return 'Semua Wali Santri';
  if(a.targetType==='Kelas') return 'Kelas '+a.targetValue;
  if(a.targetType==='Santri'){ const s=studentOf(a.targetValue); return s?s.nama:'-'; }
  return a.targetValue;
}
function puRenderList(){
  const rows=puFilteredRows();
  document.getElementById('puListBody').innerHTML = rows.length? rows.map(a=>`
    <div class="ann-list-item" onclick="puOpenDetail('${a.id}')">
      ${a.isPinned?'<span class="ann-pin">📌</span>':'<span style="width:13px;"></span>'}
      <div class="ann-main">
        <div class="ann-title-row"><span class="ann-title">${a.title}</span>${a.priority!=='Normal'?acadStatusBadge(a.priority):''}${acadStatusBadge(a.status)}</div>
        <div class="ann-meta2">${a.category} · Untuk: ${puTargetLabel(a)} · ${a.publishDate==='-'?'Belum dijadwalkan':fmtTglID(a.publishDate)} · oleh ${a.createdBy}</div>
      </div>
    </div>`).join('') : acadEmptyStateHtml('Tidak ada pengumuman ditemukan','Coba ubah kata kunci atau filter yang digunakan.');
}

function puApplyTemplate(key){
  const t=ANNOUNCEMENT_TEMPLATES.find(x=>x.key===key); if(!t) return;
  document.getElementById('pufTitle').value=t.title;
  document.getElementById('pufKategori').value=t.category;
  document.getElementById('pufContent').value=t.content;
  showAcadToast('Template "'+t.label+'" diterapkan — silakan sesuaikan isinya.');
}
function puToggleTargetDetail(){
  const v=document.getElementById('pufTargetType').value;
  const wrap=document.getElementById('pufTargetDetailWrap'), label=document.getElementById('pufTargetDetailLabel'), sel=document.getElementById('pufTargetValue');
  if(v==='Semua Wali Santri'){ wrap.style.display='none'; return; }
  wrap.style.display='';
  const kelasOpts=[...new Set(studentsData.map(s=>s.kelas))];
  if(v==='Kelas'){ label.textContent='Pilih Kelas'; sel.innerHTML=kelasOpts.map(k=>`<option>${k}</option>`).join(''); }
  else if(v==='Santri'){ label.textContent='Pilih Santri'; sel.innerHTML=studentsData.map(s=>`<option value="${s.id}">${s.nama} — ${s.kelas}</option>`).join(''); }
  else if(v==='Kelompok'){ label.textContent='Pilih Kelompok'; sel.innerHTML=`<option>Santri Asrama</option><option>Santri Pulang Pergi</option>${[...new Set(studentsData.map(s=>s.waliKelas))].map(w=>`<option>${w}</option>`).join('')}`; }

function puTargetLabelPreview(a){
  if(a.targetType==='Semua Wali Santri') return 'Semua Wali Santri';
  if(a.targetType==='Kelas') return 'Wali Santri Kelas '+a.targetValue;
  if(a.targetType==='Santri'){ const s=studentOf(a.targetValue); return s?s.nama:'-'; }
  return a.targetValue||'-';
}
function puSubmitForm(status){
  const vals=puFormPreview?window.__puDraftValues:puReadFormValues();
  if(!vals.title){ showAcadToast('Judul wajib diisi.'); return; }
  if(!vals.content){ showAcadToast('Isi pengumuman wajib diisi.'); return; }
  if(status==='Terjadwal' && (vals.publishDate==='-'||vals.publishTime==='-')){ showAcadToast('Lengkapi tanggal dan waktu publikasi untuk menjadwalkan.'); return; }
  puSaveAnnouncement(vals,status);
  showAcadToast(status==='Draft'?'Pengumuman disimpan sebagai draft.':(status==='Terjadwal'?'Pengumuman berhasil dijadwalkan.':'Pengumuman berhasil dipublikasikan.'));
  closeAcadDrawer(); puRenderList();
}

/* ---- Detail Pengumuman + status dibaca ---- */
function puOpenDetail(id){
  const a=announcementOf(id); if(!a) return;
  puCheckScheduled();
  const recipients=announcementRecipientsData.filter(r=>r.announcementId===id);
  const sudahBaca=recipients.filter(r=>r.readAt).length;
  const belumBaca=recipients.length-sudahBaca;
  const persen=recipients.length?Math.round(sudahBaca/recipients.length*100):0;
  openAcadDrawer('Detail Pengumuman',`
    ${dwRow('Judul',a.title)}${dwRow('Kategori',a.category)}${dwRow('Prioritas',a.priority)}${dwRow('Pembuat',a.createdBy)}
    ${dwRow('Dibuat',fmtTglID(a.createdAt.slice(0,10)))}${dwRow('Publikasi',a.publishDate==='-'?'-':fmtTglID(a.publishDate)+' '+a.publishTime)}
    ${dwRow('Berakhir',a.expireDate==='-'?'-':fmtTglID(a.expireDate))}${dwRow('Target',puTargetLabel(a))}${dwRow('Lampiran',a.attachmentUrl)}${dwRow('Status',a.status)}
    <div class="dw-section">Isi Pengumuman</div><p class="dw-para">${a.content}</p>
    ${recipients.length?`<div class="dw-section">Status Dibaca — Dikirim kepada ${recipients.length} wali santri</div>
    <div class="read-bar"><i style="width:${persen}%"></i></div>
    ${dwRow('Sudah Dibaca',sudahBaca)}${dwRow('Belum Dibaca',belumBaca)}
    <div style="max-height:160px;overflow-y:auto;margin-top:6px;">
    ${recipients.map(r=>{const s=studentOf(r.recipientId); return `<div class="dw-row" style="cursor:pointer" onclick="puMarkRead('${r.id}')"><span>${s?s.nama:'-'} (${s?s.kelas:'-'})</span><span>${acadStatusBadge(r.readAt?'Disetujui':'Menunggu')}</span></div>`;}).join('')}
    </div>` : '<p class="dw-para" style="color:var(--sub);">Belum dipublikasikan — status baca akan tercatat setelah dipublikasikan.</p>'}
    <div class="dw-formfoot">
      ${a.status!=='Arsip'?`<button class="btn-outline-sm" onclick="puTogglePin('${a.id}');">📌 ${a.isPinned?'Lepas Pin':'Pin'}</button>`:''}
      ${a.status==='Dipublikasikan'?`<button class="btn-outline-sm" onclick="puArchive('${a.id}');closeAcadDrawer();">Arsipkan</button>`:''}
      ${a.status==='Draft'?`<button class="btn-primary-sm" onclick="closeAcadDrawer();puOpenForm('${a.id}');">✏️ Edit</button>`:''}
    </div>`);
}

/* ---- Role & Permission matrix ---- */
const PERMISSION_MODULES=['Kepegawaian','Sarpras','Keuangan','Pengumuman'];
const PERMISSION_ACTIONS=['view','create','edit','delete','approve'];
const permissionsData=[];
(function ptInitPermissions(){
  const defaults={
    'Super Admin':{view:true,create:true,edit:true,delete:true,approve:true},
    'Kepala Sekolah':{view:true,create:false,edit:false,delete:false,approve:true},
    'Bendahara':{view:true,create:true,edit:true,delete:false,approve:false},
    'Sarpras':{view:true,create:true,edit:true,delete:false,approve:false},
    'Guru':{view:true,create:false,edit:false,delete:false,approve:false},
    'Wali Kelas':{view:true,create:false,edit:false,delete:false,approve:false},
    'Musyrif':{view:true,create:false,edit:false,delete:false,approve:false},
    'Orang Tua':{view:false,create:false,edit:false,delete:false,approve:false},
    'Siswa':{view:false,create:false,edit:false,delete:false,approve:false}
  };
  ALL_ROLES.forEach(role=>{
    PERMISSION_MODULES.forEach(mod=>{
      const d=defaults[role]||{view:false,create:false,edit:false,delete:false,approve:false};
      permissionsData.push({role,module:mod,canView:d.view,canCreate:d.create,canEdit:d.edit,canDelete:d.delete,canApprove:d.approve,canPublish:d.approve});
    });
  });
})();
function permissionOf(role,module){ return permissionsData.find(p=>p.role===role&&p.module===module); }
function ptTogglePermission(role,module,action){
  if(!ptCanManage()){ showAcadToast('Anda tidak memiliki hak untuk mengubah permission.'); return; }
  const p=permissionOf(role,module); if(!p) return;
  const key='can'+action.charAt(0).toUpperCase()+action.slice(1);
  p[key]=!p[key];
  pushAuditLog('Perubahan Permission','Pengaturan','Permission "'+action+'" untuk role '+role+' pada modul '+module+' diubah menjadi '+p[key]+'.');
  ptRenderPanel();
}

function acSb(){ return (typeof supabaseClient!=='undefined'&&supabaseClient)||null; }
function acEsc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function acActor(){ return ROLE_NAME[curRole]||curRole; }
function acCanDelete(){ return curRole==='Super Admin'; }
function acFmtDT(ts){ if(!ts) return '-'; const d=new Date(ts); if(isNaN(d)) return '-';
  return d.getDate()+' '+BULAN_ID[d.getMonth()].slice(0,3)+' '+d.getFullYear()+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function acFmtD(ts){ if(!ts) return '-'; const d=new Date(ts); if(isNaN(d)) return '-'; return d.getDate()+' '+BULAN_ID[d.getMonth()]+' '+d.getFullYear(); }
function acBadge(st){
  const cls={Aktif:'b-green',Menunggu:'b-amber',Nonaktif:'b-gray',Ditolak:'b-red'}[st]||'b-gray';
  return `<span class="badge ${cls}">${acEsc(st)}</span>`;
}
/* Aksi terhadap akun tertentu: tidak boleh terhadap diri sendiri; Kepala Sekolah tidak boleh menyentuh Super Admin */
function acCanAct(u){
  if(!ptCanManage()) return false;
  if(u.auth_user_id&&u.auth_user_id===acct.myAuthId) return false;
  if(curRole!=='Super Admin'&&u.role==='Super Admin') return false;
  return true;
}
async function acctRefreshPending(){
  const sb=acSb(); if(!sb||!ptCanManage()){ acct.pending=0; return; }
  const {count,error}=await sb.from('profiles').select('id',{count:'exact',head:true}).eq('status','Menunggu');
  if(error) return;
  const n=count||0; if(n!==acct.pending){ acct.pending=n; try{updateNotifBadge()}catch(e){} acctRenderChrome(); }
}
setInterval(()=>{ const m=document.getElementById('main'); if(m&&m.style.display!=='none') acctRefreshPending(); },60000);

async function acctLoad(){
  const sb=acSb();
  if(!sb){ acct.err='Supabase belum aktif.'; acct.loaded=true; acctRenderAll(); return; }
  acct.loading=true; acct.err=''; acctRenderAll();
  try{ const {data}=await sb.auth.getSession(); acct.myAuthId=data&&data.session?data.session.user.id:null; }catch(e){}
  const {data,error}=await sb.from('profiles').select('*').order('created_at',{ascending:false});
  acct.loading=false; acct.loaded=true;
  if(error){ console.error(error); acct.err='Gagal memuat akun: '+error.message+' (pastikan supabase-manajemen-akun.sql sudah dijalankan).'; acct.rows=[]; }
  else{ acct.rows=(data||[]).filter(r=>!r.deleted_at); acct.pending=acct.rows.filter(r=>r.status==='Menunggu').length; }
  acctRenderAll(); try{updateNotifBadge()}catch(e){}
}

function ptUserSetView(v){ ptUserView=v; acctRenderChrome(); ptRenderPanel(); }
function acctSetQuery(v){ acct.q=v; acctRenderTable(); }
function acctSetFilter(v){ acct.filter=v; acctRenderTable(); }
function acctRenderChrome(){
  document.querySelectorAll('#ptUserViewToggle button').forEach(b=>b.classList.toggle('active',b.dataset.v===ptUserView));
  const t=document.getElementById('acctTools'); if(t) t.style.display=ptUserView==='pengguna'?'':'none';
  const p=document.getElementById('acctPendTab'); if(p) p.textContent=acct.pending>0?'('+acct.pending+')':'';
  const st=document.getElementById('acctStats');
  if(st){ const c=s=>acct.rows.filter(r=>r.status===s).length;
    st.innerHTML=acadStatRowHtml([{val:acct.rows.length,label:'Total Pengguna',color:'blue'},{val:c('Aktif'),label:'Aktif',color:'green'},
      {val:c('Menunggu'),label:'Menunggu',color:'orange'},{val:c('Nonaktif'),label:'Nonaktif',color:'gray'},{val:c('Ditolak'),label:'Ditolak',color:'red'}]).replace('class="stat-row"','class="stat-row" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))"'); }
}
function acctRenderAll(){ acctRenderChrome(); ptRenderPanel(); }
function acctRenderTable(){ if(document.getElementById('ptUserBody')&&ptUserView==='pengguna') acctRenderUsers(); }

function acctBodyState(){
  if(acct.loading&&!acct.loaded) return '<div style="padding:18px;color:var(--sub);font-size:12.5px">Memuat akun...</div>';
  if(acct.err) return `<div style="padding:14px;color:var(--danger);font-size:12.5px">${acEsc(acct.err)}</div>`;
  return '';
}
function acctRenderUsers(){
  const body=document.getElementById('ptUserBody'); if(!body) return;
  const st=acctBodyState(); if(st){ body.innerHTML=st; return; }
  const q=acct.q.trim().toLowerCase();
  const rows=acct.rows.filter(u=>(acct.filter==='Semua'||u.status===acct.filter)&&(!q||(u.nama||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q)));
  body.innerHTML=rows.length?`<div style="overflow-x:auto"><table><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th>Tanggal Daftar</th><th>Login Terakhir</th><th>Aksi</th></tr>
    ${rows.map(u=>{
      const can=acCanAct(u), id=acEsc(u.id);
      let a=`<button title="Lihat" onclick="acctOpenDetail('${id}')">👁</button>`;
      if(can){
        if(u.status==='Menunggu') a+=`<button title="Setujui" onclick="acctOpenApprove('${id}')">✓</button><button title="Tolak" onclick="acctOpenReject('${id}')">✕</button>`;
        else{
          if(u.status==='Aktif') a+=`<button title="Edit Role" onclick="acctOpenEditRole('${id}')">✏️</button>`;
          a+= u.status==='Aktif'
            ? `<button title="Nonaktifkan" onclick="acctToggleStatus('${id}')">⏸</button>`
            : u.status==='Nonaktif' ? `<button title="Aktifkan" onclick="acctToggleStatus('${id}')">▶️</button>`
            : `<button title="Setujui ulang" onclick="acctOpenApprove('${id}')">✓</button>`;
        }
        if(acCanDelete()) a+=`<button title="Hapus" onclick="acctConfirmDelete('${id}')">🗑</button>`;
      }
      return `<tr><td><b>${acEsc(u.nama)}</b></td><td>${acEsc(u.email)}</td><td>${acEsc(u.role)}</td><td>${acBadge(u.status)}</td><td>${acFmtD(u.created_at)}</td><td>${u.last_login?acFmtDT(u.last_login):'-'}</td><td><div class="row-actions">${a}</div></td></tr>`;
    }).join('')}</table></div>`:'<div style="padding:18px;color:var(--sub);font-size:12.5px">Tidak ada akun yang cocok.</div>';
}
function acctRenderApprovals(){
  const body=document.getElementById('ptUserBody'); if(!body) return;
  const st=acctBodyState(); if(st){ body.innerHTML=st; return; }
  const rows=acct.rows.filter(u=>u.status==='Menunggu').slice().sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
  body.innerHTML=rows.length?`<div style="overflow-x:auto"><table><tr><th>Nama</th><th>Email</th><th>Role yang Diminta</th><th>Tanggal Pendaftaran</th><th>Waktu</th><th>Aksi</th></tr>
    ${rows.map(u=>{ const d=u.created_at?new Date(u.created_at):null, id=acEsc(u.id);
      return `<tr><td><b>${acEsc(u.nama)}</b></td><td>${acEsc(u.email)}</td><td>${acEsc(u.role)}</td><td>${acFmtD(u.created_at)}</td>
      <td>${d?String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):'-'}</td>
      <td>${acCanAct(u)?`<div style="display:flex;gap:6px"><button class="btn-primary-sm" onclick="acctOpenApprove('${id}')">Setujui</button><button class="btn-outline-sm" onclick="acctOpenReject('${id}')">Tolak</button></div>`:'-'}</td></tr>`; }).join('')}</table></div>`
    :'<div style="padding:18px;color:var(--sub);font-size:12.5px">Tidak ada akun yang menunggu persetujuan.</div>';
}

/* ---- aksi: semuanya ke Supabase; perubahan 0 baris = ditolak RLS ---- */
function acRow(id){ return acct.rows.find(r=>String(r.id)===String(id)); }
function acRoleOptions(sel){
  const roles=curRole==='Super Admin'?['Super Admin',...REG_ROLES]:REG_ROLES;
  return roles.map(r=>`<option ${r===sel?'selected':''}>${r}</option>`).join('');
}
async function acUpdate(id,patch){
  const sb=acSb(); if(!sb){ showAcadToast('Supabase belum aktif.'); return null; }
  const {data,error}=await sb.from('profiles').update(patch).eq('id',id).select();
  if(error||!data||!data.length){
    console.error(error||'0 baris berubah (diblokir RLS)');
    showAcadToast('Gagal: '+(error?error.message:'ditolak oleh kebijakan keamanan (RLS). Role Anda tidak berhak.')); return null; }
  return data[0];
}
function acctOpenApprove(id){
  const u=acRow(id); if(!u) return;
  openAcadDrawer('Setujui Akun',`
    <p style="font-size:12.5px;margin-bottom:12px;">Setujui akun <b>${acEsc(u.nama)}</b> (${acEsc(u.email)})? Akun akan bisa langsung login.</p>
    <div class="dw-field"><label>Role (dapat diubah sebelum disetujui)</label><select id="acApproveRole">${acRoleOptions(u.role)}</select></div>
    <div class="dw-formfoot"><button class="btn-outline-sm" onclick="closeAcadDrawer()">Batal</button><button class="btn-primary-sm" id="acApproveBtn" onclick="acctDoApprove('${acEsc(id)}')">Setujui</button></div>`);
}
async function acctDoApprove(id){
  const u=acRow(id); if(!u) return; const role=document.getElementById('acApproveRole').value;
  const btn=document.getElementById('acApproveBtn'); if(btn) btn.disabled=true;
  const r=await acUpdate(id,{status:'Aktif',role});
  if(btn) btn.disabled=false; if(!r) return;
  pushAuditLog('Persetujuan Akun','Pengguna & Role','Akun "'+u.nama+'" ('+u.email+') disetujui oleh '+acActor()+' sebagai '+role+(role!==u.role?' (diminta: '+u.role+')':'')+'.');
  closeAcadDrawer(); showAcadToast('Akun berhasil disetujui.'); acctLoad();
}
function acctOpenReject(id){
  const u=acRow(id); if(!u) return;
  openAcadDrawer('Tolak Akun',`
    <p style="font-size:12.5px;margin-bottom:12px;">Tolak pendaftaran <b>${acEsc(u.nama)}</b> (${acEsc(u.email)})?</p>
    <div class="dw-field"><label>Alasan Penolakan *</label><textarea id="acRejectReason" rows="4" placeholder="Tuliskan alasan penolakan..."></textarea></div>
    <div class="dw-formfoot"><button class="btn-outline-sm" onclick="closeAcadDrawer()">Batal</button><button class="btn-primary-sm" id="acRejectBtn" onclick="acctDoReject('${acEsc(id)}')">Tolak Akun</button></div>`);
}
async function acctDoReject(id){
  const u=acRow(id); if(!u) return; const reason=document.getElementById('acRejectReason').value.trim();
  if(!reason){ showAcadToast('Alasan penolakan wajib diisi.'); return; }
  const btn=document.getElementById('acRejectBtn'); if(btn) btn.disabled=true;
  const r=await acUpdate(id,{status:'Ditolak',rejection_reason:reason});
  if(btn) btn.disabled=false; if(!r) return;
  pushAuditLog('Penolakan Akun','Pengguna & Role','Akun "'+u.nama+'" ('+u.email+') ditolak oleh '+acActor()+'. Alasan: '+reason);
  closeAcadDrawer(); showAcadToast('Akun berhasil ditolak.'); acctLoad();
}
function acctOpenEditRole(id){
  const u=acRow(id); if(!u) return;
  openAcadDrawer('Edit Role',`
    <p style="font-size:12.5px;margin-bottom:12px;">Ubah role <b>${acEsc(u.nama)}</b> (saat ini: ${acEsc(u.role)}). Akses menu mengikuti role baru saat pengguna login berikutnya.</p>
    <div class="dw-field"><label>Role</label><select id="acEditRole">${acRoleOptions(u.role)}</select></div>
    <div class="dw-formfoot"><button class="btn-outline-sm" onclick="closeAcadDrawer()">Batal</button><button class="btn-primary-sm" onclick="acctDoEditRole('${acEsc(id)}')">Simpan</button></div>`);
}
async function acctDoEditRole(id){
  const u=acRow(id); if(!u) return; const role=document.getElementById('acEditRole').value;
  if(role===u.role){ closeAcadDrawer(); return; }
  const r=await acUpdate(id,{role}); if(!r) return;
  pushAuditLog('Perubahan Role','Pengguna & Role','Role '+u.nama+' ('+u.email+') diubah dari '+u.role+' menjadi '+role+' oleh '+acActor()+'.');
  closeAcadDrawer(); showAcadToast('Role berhasil diubah.'); acctLoad();
}
function acctToggleStatus(id){
  const u=acRow(id); if(!u) return; const aktif=u.status==='Aktif';
  openAcadConfirm(aktif?'Nonaktifkan Akun?':'Aktifkan Akun?',
    aktif?'Akun "'+u.nama+'" tidak akan bisa login sampai diaktifkan kembali.':'Akun "'+u.nama+'" akan bisa login kembali.',
    async()=>{
      const r=await acUpdate(id,{status:aktif?'Nonaktif':'Aktif'}); if(!r) return;
      pushAuditLog(aktif?'Nonaktifkan Akun':'Aktivasi Akun','Pengguna & Role','Akun "'+u.nama+'" ('+u.email+') '+(aktif?'dinonaktifkan':'diaktifkan kembali')+' oleh '+acActor()+'.');
      showAcadToast(aktif?'Akun berhasil dinonaktifkan.':'Akun berhasil diaktifkan.'); acctLoad(); },
    aktif?'Nonaktifkan':'Aktifkan');
}
function acctConfirmDelete(id){
  const u=acRow(id); if(!u) return;
  openAcadConfirm('Hapus Akun?','Apakah Anda yakin ingin menghapus akun '+u.nama+'? Data akun akan dihapus dan tindakan ini tidak dapat dibatalkan.',
    async()=>{
      const sb=acSb(); if(!sb) return;
      const {data,error}=await sb.functions.invoke('delete-user',{body:{profile_id:u.id}});
      if(error||(data&&data.error)){
        let msg=(data&&data.error)||error.message;
        try{ if(error&&error.context&&error.context.json){ const j=await error.context.json(); if(j&&j.error) msg=j.error; } }catch(e){}
        console.error(error||data);
        showAcadToast('Gagal menghapus akun: '+msg+(/not found|Failed to send/i.test(msg)?' (pastikan Edge Function delete-user sudah di-deploy).':'')); return; }
      pushAuditLog('Hapus Akun','Pengguna & Role','Akun "'+u.nama+'" ('+u.email+') dihapus secara permanen oleh '+acActor()+'.');
      showAcadToast('Akun berhasil dihapus.'); acctLoad(); },
    'Hapus Permanen');
}
function acctOpenDetail(id){
  const u=acRow(id); if(!u) return;
  const row=(l,v)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px"><span style="color:var(--sub)">${l}</span><span style="text-align:right;font-weight:600">${v}</span></div>`;
  const sect=t=>`<h3 style="font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);margin:16px 0 4px">${t}</h3>`;
  const key=(u.email||'').toLowerCase(), nm='"'+(u.nama||'')+'"';
  const logs=(typeof auditLogData!=='undefined'?auditLogData:[]).filter(l=>(key&&String(l.detail).toLowerCase().includes(key))||String(l.detail).includes(nm)).slice(0,15);
  openAcadDrawer('Detail Pengguna',
    sect('Profil Akun')+row('Nama',acEsc(u.nama))+row('Email',acEsc(u.email))+row('Role',acEsc(u.role))+row('Status',acBadge(u.status))+row('Tanggal Daftar',acFmtDT(u.created_at))+row('Login Terakhir',u.last_login?acFmtDT(u.last_login):'-')+
    sect('Riwayat Akun')+row('Tanggal Daftar',acFmtDT(u.created_at))+row('Disetujui Oleh',acEsc(u.approved_by||'-'))+row('Tanggal Persetujuan',acFmtDT(u.approved_at))+
    row('Ditolak Oleh',acEsc(u.rejected_by||'-'))+row('Tanggal Penolakan',acFmtDT(u.rejected_at))+row('Alasan Penolakan',acEsc(u.rejection_reason||'-'))+
    row('Dinonaktifkan Oleh',acEsc(u.deactivated_by||'-'))+row('Tanggal Dinonaktifkan',acFmtDT(u.deactivated_at))+
    sect('Riwayat Aktivitas')+(logs.length?logs.map(l=>`<div style="padding:7px 0;border-bottom:1px solid var(--line);font-size:12px"><b>${acEsc(l.action)}</b> <span style="color:var(--sub)">· ${acFmtDT(l.timestamp)}</span><div style="color:var(--sub);margin-top:2px">${acEsc(l.detail)}</div></div>`).join(''):'<div style="font-size:12px;color:var(--sub);padding:6px 0">Belum ada aktivitas tercatat.</div>'));
}

function ptRenderPermissionTable(){
  document.getElementById('ptUserBody').innerHTML=PERMISSION_MODULES.map(mod=>`
    <div style="margin-bottom:18px;"><h3 style="font-size:12.5px;font-weight:700;margin-bottom:8px;">${mod}</h3>
    <table><tr><th>Role</th>${PERMISSION_ACTIONS.map(a=>`<th style="text-transform:capitalize;">${a}</th>`).join('')}</tr>
    ${ALL_ROLES.map(role=>{const p=permissionOf(role,mod); return `<tr><td>${role}</td>${PERMISSION_ACTIONS.map(a=>{const key='can'+a.charAt(0).toUpperCase()+a.slice(1); return `<td><div class="tg-switch ${p[key]?'on':''}" style="width:30px;height:16px;" onclick="ptTogglePermission('${role}','${mod}','${a}')"><div class="tg-knob" style="width:12px;height:12px;${p[key]?'left:15px;':'left:2px;'}"></div></div></td>`;}).join('')}</tr>`;}).join('')}
    </table></div>`).join('');
}
function ptRenderPanel(){
  if(document.getElementById('ptUserBody')) ptUserView==='permission'?ptRenderPermissionTable():(ptUserView==='persetujuan'?acctRenderApprovals():acctRenderUsers());
  if(document.getElementById('ptSettingsPanel')) ptRenderSettingsPanel();
  if(document.getElementById('ptNotifBody')) ptRenderNotifPanel();
}

/* ========================================================================
   PUSAT NOTIFIKASI (navbar) — dropdown real, dihitung dari data lintas modul
   ======================================================================== */
function computeNotifications(){
  const items=[];
  if(typeof employeeLeavesData!=='undefined') employeeLeavesData.filter(l=>l.status==='Menunggu').forEach(l=>{const e=employeeOf(l.employeeId); items.push({label:'Pengajuan '+l.leaveType.toLowerCase()+': '+(e?e.nama:'-'),target:'pg-izin'});});
  if(typeof assetLoansData!=='undefined') assetLoansData.filter(l=>l.status==='Menunggu').forEach(l=>items.push({label:'Peminjaman aset: '+l.peminjam,target:'sp-inventaris'}));
  if(typeof procurementRequestsData!=='undefined') procurementRequestsData.filter(p=>['Pengajuan','Diverifikasi'].includes(p.status)).forEach(p=>items.push({label:'Pengadaan: '+p.namaBarang,target:'sp-pengajuan'}));
  if(typeof damageReportsData!=='undefined') damageReportsData.filter(d=>d.status==='Dilaporkan').forEach(d=>items.push({label:'Laporan kerusakan baru',target:'sp-kerusakan'}));
  if(typeof acct!=='undefined'&&acct.pending>0&&typeof ptCanManage==='function'&&ptCanManage()) items.unshift({label:acct.pending+' akun menunggu persetujuan',target:'pt-user',tab:'persetujuan'});
  puCheckScheduled();
  announcementsData.filter(a=>a.status==='Dipublikasikan'&&(a.priority==='Penting'||a.priority==='Mendesak')).slice(0,3).forEach(a=>items.push({label:'Pengumuman: '+a.title,target:'ko-pengumuman'}));
  const acc=ROLE_ACCESS[curRole]||'all';
  if(acc!=='all'){ const okIds=new Set(); MENU.forEach(g=>{ if(acc.includes(g.g)) g.items.forEach(it=>okIds.add(it[0])); }); return items.filter(it=>okIds.has(it.target)); }
  return items;
}
function toggleNotifDropdown(){
  let el=document.getElementById('notifDropdown');
  if(!el){
    el=document.createElement('div'); el.id='notifDropdown';
    document.body.appendChild(el);
    document.addEventListener('click',(e)=>{
      if(!el.contains(e.target) && !e.target.closest('.topbar-notif')) el.classList.remove('show');
    });
  }
  const items=computeNotifications();
  el.innerHTML=`<div class="nd-head">Notifikasi (${items.length})</div>`+
    (items.length? items.map(it=>`<div class="nd-item" onclick="closeNotifDropdown();${it.tab?`acct.nextTab='${it.tab}';`:''}showView('${it.target}')"><span>🔔</span><span>${it.label}</span></div>`).join('') : '<div class="nd-empty">Tidak ada notifikasi baru.</div>');
  el.classList.toggle('show');
}
function closeNotifDropdown(){ const el=document.getElementById('notifDropdown'); if(el) el.classList.remove('show'); }
function updateNotifBadge(){
  const btn=document.querySelector('.topbar-notif'); if(!btn) return;
  const count=computeNotifications().length;
  let badge=btn.querySelector('.count');
  const dot=btn.querySelector('.dot');
  if(count>0){
    if(dot) dot.style.display='none';
    if(!badge){ badge=document.createElement('span'); badge.className='count'; btn.appendChild(badge); }
    badge.textContent=count>9?'9+':count;
  } else {
    if(badge) badge.remove();
    if(dot) dot.style.display='';
  }
}

const MISC_PAGES={
  'ko-pengumuman':{html:pengumumanPageHtml,init:initPengumumanPage},
  'pt-sekolah':{html:pengaturanSekolahPageHtml,init:initPengaturanSekolahPage},

  'pt-notif':{html:pengaturanNotifPageHtml,init:initPengaturanNotifPage}
};
const AKADEMIK_PAGES={
  'ak-kelas':{html:dataKelasPageHtml,init:initDataKelasPage,personalKey:'kelas'},
  'ak-jadwal':{html:jadwalPageHtml,init:initJadwalPage,personalKey:'jadwal'},
  'ak-presensi':{html:presensiKbmPageHtml,init:initPresensiKbmPage,personalKey:'presensi'},
  'ak-jurnal':{html:jurnalGuruPageHtml,init:initJurnalGuruPage,personalKey:'jurnal'},
  'ak-nilai':{html:nilaiPageHtml,init:initNilaiPage,personalKey:'nilai'},
  'ak-rapor':{html:raporPageHtml,init:initRaporPage,personalKey:'rapor'}
};
function showView(id){
  document.querySelectorAll('#navList .item').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  let label=''; MENU.forEach(g=>g.items.forEach(it=>{if(it[0]===id)label=it[1];}));
  document.getElementById('pageTitle').textContent=label;
  document.getElementById('side').classList.remove('open');
  closeAcadDrawer(); closeAcadConfirm(); closeNotifDropdown();
  const content=document.getElementById('content');
  destroyDashCharts();
  if(id==='dash'){content.innerHTML=dashboardHTML(); initDashboardCharts(); updateNotifBadge(); return;}
  if(AKADEMIK_PAGES[id]){
    const pg=AKADEMIK_PAGES[id];
    if(curRole==='Orang Tua'||curRole==='Siswa'){ content.innerHTML=personalAcademicPageHtml(pg.personalKey); updateNotifBadge(); return; }
    content.innerHTML=pg.html();
    pg.init();
    updateNotifBadge();
    return;
  }
  if(KESISWAAN_PAGES[id]){
    const pg=KESISWAAN_PAGES[id];
    if(curRole==='Orang Tua'||curRole==='Siswa'){ content.innerHTML=personalKesiswaanPageHtml(pg.personalKey); updateNotifBadge(); return; }
    content.innerHTML=pg.html();
    pg.init();
    updateNotifBadge();
    return;
  }
  if(KEUANGAN_PAGES[id]){
    const pg=KEUANGAN_PAGES[id];
    content.innerHTML=pg.html();
    pg.init();
    updateNotifBadge();
    return;
  }
  if(KEPEGAWAIAN_PAGES[id]){
    const pg=KEPEGAWAIAN_PAGES[id];
    if(curRole==='Guru'||curRole==='Wali Kelas'){ content.innerHTML=personalKepegawaianPageHtml(pg.personalKey); updateNotifBadge(); return; }
    content.innerHTML=pg.html();
    pg.init();
    updateNotifBadge();
    return;
  }
  if(SARPRAS_PAGES[id]){
    const pg=SARPRAS_PAGES[id];
    content.innerHTML=pg.html();
    pg.init();
    updateNotifBadge();
    return;
  }
  if(MISC_PAGES[id]){
    const pg=MISC_PAGES[id];
    content.innerHTML=pg.html();
    pg.init();
    updateNotifBadge();
    return;
  }
  if(BOARDING_PAGES[id]){
    const pg=BOARDING_PAGES[id];
    content.innerHTML=pg.html();
    pg.init();
    updateNotifBadge();
    return;
  }
  const p=PAGES[id];
  content.innerHTML=`<div class="panel"><h2>${p.t}</h2><p class="desc">${p.d}</p>
  <table><tr>${p.c.map(c=>`<th>${c}</th>`).join('')}</tr>

  ${p.r.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}
  </table></div>`;
  updateNotifBadge();
}

  }catch(e){console.error('[sync] gagal memuat pengaturan',e);snap.ais_app_settings=new Map(Object.keys(OBJS).map(k=>[k,JSON.stringify(OBJS[k]())]))}

  if((e&&e.code==='42501')||/row-level security|permission denied/i.test(raw)) return 'Perubahan tidak tersimpan ke database: role Anda tidak berhak menulis ke '+t+' (RLS).';

async function pushDiff(t,cur,prev){
  const up=[],del=[];
  cur.forEach((j,k)=>{if(prev.get(k)!==j)up.push({id:k,data:JSON.parse(j)})});
  prev.forEach((_,k)=>{if(!cur.has(k))del.push(k)});

  if(append) del.length=0;

    ch.forEach(u=>prev.set(u.id,cur.get(u.id)))}

    const {error}=await sb.from(t).delete().in('id',ch);if(error)throw error;

      try{await pushDiff(c.t,cur,prev);lastErr=''}
      catch(e){console.error('[sync]',c.t,e);const m=errText(c.t,e);if(userTouched&&m!==lastErr)toast(m);lastErr=m}
    }
    const cur=new Map(Object.keys(OBJS).map(k=>[k,JSON.stringify(OBJS[k]())])), prev=snap.ais_app_settings||(snap.ais_app_settings=new Map());
    try{await pushDiff('ais_app_settings',cur,prev)}catch(e){console.error('[sync] settings',e);const m=errText('ais_app_settings',e);if(userTouched&&m!==lastErr)toast(m);lastErr=m}
  }finally{flushing=false;userTouched=false;if(again){again=false;schedule(500)}}
}
function schedule(ms){clearTimeout(timer);timer=setTimeout(flush,ms||800)}
['click','change','submit','keyup'].forEach(ev=>document.addEventListener(ev,()=>{if(ready){userTouched=true;schedule(900)}},true));
setInterval(()=>{if(ready)flush()},5000);
window.addEventListener('beforeunload',()=>{if(ready)flush()});
/* Ambil perubahan dari pengguna/role lain (tanpa menimpa perubahan lokal yang belum tersimpan). Return true bila ada yang berubah. */
async function pullMine(){
  if(!ready||flushing||loading) return false;
  await flush();
  let changed=false;
  for(const c of COLS){
    try{
      const rows=await dbFetchAll(c.t,'id,data,created_at','created_at');
      const prev=snap[c.t]||new Map();
      const list=rows.length?orderedList(c,rows):[];
      const remote=new Map(); list.forEach(r=>{const k=keyOf(r);if(k!=null)remote.set(k,JSON.stringify(r))});
      if(!sameMap(snapshotOf(c),prev)) continue;   // ada perubahan lokal yang belum terkirim
      if(sameMap(remote,prev)) continue;           // tidak ada yang baru
      if(!rows.length) continue;                    // tabel kosong: jangan kosongkan data lokal
      c.arr().splice(0,c.arr().length,...list); snap[c.t]=remote; changed=true;
    }catch(e){console.warn('[sync] pull',c.t,e)}
  }
  try{
    const rows=await dbFetchAll('ais_app_settings','id,data'); const prev=snap.ais_app_settings||new Map();
    const cur=new Map(Object.keys(OBJS).map(k=>[k,JSON.stringify(OBJS[k]())]));
    if(sameMap(cur,prev)){ rows.forEach(r=>{const o=OBJS[r.id]&&OBJS[r.id]();if(!o)return;const j=JSON.stringify(r.data);if(prev.get(r.id)!==j){Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,r.data);prev.set(r.id,JSON.stringify(o));changed=true}}) }
  }catch(e){}
  if(changed) resyncCounters();
  return changed;
}
window.aisPullMine=pullMine;
window.aisSyncNow=()=>{userTouched=true;return flush()};
window.aisSyncReload=()=>loadAll();

/* ---- kaitkan ke login/logout ---- */
const _sbEnter=sbEnter;
sbEnter=async function(session){await _sbEnter(session);
  const {data}=await sb.auth.getSession();
  if(data&&data.session) loadAll().catch(e=>console.error('[sync]',e))};
/* auto-login (sesi tersimpan) bisa berjalan sebelum pembungkus di atas terpasang: pastikan data tetap dimuat */
sb.auth.getSession().then(({data})=>{if(data&&data.session)setTimeout(async()=>{if(ready||loading)return;const {data:d2}=await sb.auth.getSession();if(d2&&d2.session&&document.getElementById('main').style.display!=='none')loadAll().catch(console.error)},2500)});
const _out=doLogout;
doLogout=async function(){try{if(ready)await flush()}catch(e){} ready=false; return _out.apply(this,arguments)};

})();
</script>
<script id="auto-refresh">
/* ========================================================================
   PENYEGARAN OTOMATIS
   Penyebab "harus restart dulu baru data baru muncul": data diambil dari Supabase
   hanya SEKALI saat login. Sekarang halaman yang sedang dibuka diambil ulang:
   - saat pindah menu, saat tab kembali aktif, dan tiap 15 detik;
   - ditunda bila drawer/dialog terbuka atau pengguna sedang mengetik.
   ======================================================================== */
(function(){
if(typeof SB_ON==='undefined'||!SB_ON) return;
let busy=false,last=0;
const activeId=()=>{const a=document.querySelector('#navList .item.active');return a?a.dataset.id:null};
const loggedIn=()=>{const m=document.getElementById('main');return m&&m.style.display!=='none'};
const drawerOpen=()=>!!document.querySelector('#acadDrawer.show,#acadConfirmOverlay.show');
const typing=()=>{const e=document.activeElement;return !!(e&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.tagName)&&e.closest('#content'))};
async function run(force){
  if(busy||!loggedIn()||document.hidden) return;
  if(!force&&Date.now()-last<4000) return;
  busy=true; last=Date.now();
  try{
    const id=activeId(); if(!id){return}
    if(drawerOpen()) return;
    if(id==='dash'&&typeof dashReloadData==='function'){
      const before=dashSignature(); const did=await dashReloadData(force);
      if(did&&dashSignature()!==before&&!drawerOpen()) showView('dash');
      return;
    }
    /* 1) Modul lama (tabel Supabase milik modul masing-masing) */
    if(typeof KSC!=='undefined') await Promise.all(Object.keys(KSC).filter(k=>{const c=KSC[k].cfg;return document.getElementById(c.bodyId||(c.prefix+'Body'))}).map(k=>kscLoad(k,{silent:true}).catch(()=>{})));
    if(id==='ak-kelas'&&typeof dkReload==='function') await dkReload({silent:true});
    else if(id.startsWith('ks-')&&typeof stReload==='function') await stReload({silent:true});
    /* 2) Sarpras, Pengumuman, Pengaturan */
    if(typeof aisPullMine==='function'&&/^(sp-|ko-|pt-)/.test(id)){
      const changed=await aisPullMine();
      if(changed&&!drawerOpen()&&!typing()&&!document.getElementById('ptUserBody')) showView(id);
    }
    /* 3) Daftar akun */
    if(document.getElementById('ptUserBody')&&typeof acctLoad==='function'&&!typing()) await acctLoad();
    else if(typeof acctRefreshPending==='function') acctRefreshPending();
  }catch(e){console.warn('[auto-refresh]',e)}
  finally{busy=false}
}
setInterval(()=>run(false),15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)run(true)});
window.addEventListener('focus',()=>run(true));
const _sv=showView;
showView=function(id){const r=_sv.apply(this,arguments); setTimeout(()=>run(true),400); return r};
window.aisRefreshNow=()=>run(true);
})();
</script>
<script id="dashboard-live">
/* ========================================================================
   DASHBOARD — membaca data nyata dari menu-menu yang ada.
   Sumber: Siswa, Presensi KBM, Nilai, Pelanggaran, Perizinan, Jadwal, Tahfidz,
   Catatan Musyrif, Keuangan (Tagihan/Pembayaran), Sarpras, Pengumuman, Izin Pegawai, Akun.
   Tidak ada angka bawaan: bila belum ada data, panel menampilkan keterangan "belum ada data".
   Hanya menampilkan data yang boleh dilihat role tersebut (database membatasi lewat RLS).
   ======================================================================== */
(function(){
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayIso=()=>iso(new Date());
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const pct=(a,b)=>b?Math.round(a/b*100):0;
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const un=s=>typeof akUnesc==='function'?akUnesc(s):s;
const arr=name=>{ try{ return eval(name)||[]; }catch(e){ return []; } };
const months=n=>{ const o=[],now=new Date(); for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); o.push({ym:d.getFullYear()+'-'+pad(d.getMonth()+1),label:MON[d.getMonth()]}); } return o; };
function canSee(menuId){
  const acc=ROLE_ACCESS[curRole]||'all'; if(acc==='all') return true;
  return MENU.some(g=>acc.includes(g.g)&&g.items.some(it=>it[0]===menuId));
}
const isParent=()=>curRole==='Orang Tua'||curRole==='Siswa';
const emptyBox=(msg)=>`<div style="padding:26px 10px;text-align:center;color:var(--sub);font-size:12px;line-height:1.6">${msg}</div>`;

/* ---------- hitung semua angka dari data menu ---------- */
function compute(){
  const t=todayIso(), sem=(typeof akDefaultPeriod==='function')?akDefaultPeriod():{ta:'',sem:''};
  const students=arr('studentsData'), aktif=students.filter(s=>s.status==='Aktif');
  const S=dashboardStats;

  /* Kehadiran hari ini (Presensi KBM) */
  const att=arr('attendanceRecordsData'), attToday=att.filter(a=>a.tanggal===t);
  const hadirToday=attToday.filter(a=>a.status==='Hadir').length;
  S.totalSiswa={value:aktif.length,sub:'Siswa berstatus aktif',trend:''};
  S.kehadiranHariIni=attToday.length?{value:pct(hadirToday,attToday.length)+'%',sub:hadirToday+' hadir dari '+attToday.length+' catatan',trend:''}
                                    :{value:'-',sub:'Presensi hari ini belum diisi',trend:''};
  /* Rata-rata nilai (semester berjalan; bila kosong pakai semua nilai) */
  const grades=arr('gradesData').filter(g=>g.nilaiAkhir!=null&&!isNaN(g.nilaiAkhir));
  let gUse=grades.filter(g=>g.tahunAjaran===sem.ta&&g.semester===sem.sem), gLabel='Semester '+sem.sem+' '+sem.ta;
  if(!gUse.length){ gUse=grades; gLabel='Semua nilai tercatat'; }
  S.rataNilai=gUse.length?{value:(Math.round(gUse.reduce((a,g)=>a+g.nilaiAkhir,0)/gUse.length*10)/10),sub:gLabel,trend:''}:{value:'-',sub:'Belum ada nilai',trend:''};
  /* Santri asrama */
  S.santriAsrama={value:aktif.filter(s=>s.boarding).length,sub:'Siswa tinggal di asrama',trend:''};
  /* Tunggakan (hanya role keuangan) */
  const inv=arr('invoicesData'); let tg=0; try{ tg=inv.reduce((a,i)=>a+invoiceComputed(i).sisa,0); }catch(e){}
  S.tunggakan={value:tg,sub:inv.length?'Total tagihan belum lunas':'Belum ada tagihan',trend:''};

  /* Grafik kehadiran 7 hari (% hadir per hari) */
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
  attendanceData.labels=days.map(d=>HARI_ID[d.getDay()].slice(0,3)+' '+d.getDate());
  attendanceData.values=days.map(d=>{ const r=att.filter(a=>a.tanggal===iso(d)); return r.length?pct(r.filter(a=>a.status==='Hadir').length,r.length):null; });
  /* Nilai per mapel, per semester */
  ['Ganjil','Genap'].forEach(sm=>{
    const by={}; grades.filter(g=>g.semester===sm&&(g.tahunAjaran===sem.ta||!sem.ta)).forEach(g=>{ (by[g.mapel]=by[g.mapel]||[]).push(g.nilaiAkhir); });
    let keys=Object.keys(by).sort((a,b)=>by[b].length-by[a].length).slice(0,8);
    if(!keys.length){ const by2={}; grades.filter(g=>g.semester===sm).forEach(g=>{ (by2[g.mapel]=by2[g.mapel]||[]).push(g.nilaiAkhir); }); keys=Object.keys(by2).slice(0,8); Object.assign(by,by2); }
    academicData[sm.toLowerCase()]={labels:keys.map(un),values:keys.map(k=>Math.round(by[k].reduce((a,b)=>a+b,0)/by[k].length*10)/10)};
  });
  /* Kedisiplinan: pelanggaran siswa per tingkat */
  const vio=arr('violationsData'), tk={Ringan:0,Sedang:0,Berat:0};
  vio.forEach(v=>{ const k=tk[v.tingkat]!==undefined?v.tingkat:'Ringan'; tk[k]++; });
  const colors={Ringan:'#2A9D8F',Sedang:'#C98A16',Berat:'#C0392B'};
  disciplineData.length=0;
  Object.keys(tk).forEach(k=>{ if(tk[k]) disciplineData.push({label:k,value:pct(tk[k],vio.length),count:tk[k],color:colors[k]}); });
  dashboardStats._pelanggaran=vio.length;
  /* Trend pelanggaran per bulan */
  const ms=months(6); disciplineTrendData.labels=ms.map(m=>m.label); disciplineTrendData.values=ms.map(m=>vio.filter(v=>String(v.tanggal).startsWith(m.ym)).length);
  /* Tahfidz: setoran (halaman) per bulan */
  const tl=arr('tahfidzLogData'); tahfidzData.labels=ms.map(m=>m.label);
  tahfidzData.values=ms.map(m=>Math.round(tl.filter(l=>l.jenis==='Setoran'&&String(l.tanggal).startsWith(m.ym)).reduce((a,l)=>a+num(l.halaman),0)*10)/10);
  /* Jadwal / kegiatan hari ini */
  scheduleData.length=0;
  if(curRole==='Musyrif'){
    const acts=arr('boardingActivitiesData'), ba=arr('boardingAttendanceData').filter(b=>b.tanggal===t);
    acts.forEach(a=>{ const r=ba.filter(b=>String(b.kegiatanId)===String(a.id)); scheduleData.push({jam:'Asrama',keg:un(a.nama)+(r.length?' — '+r.filter(x=>x.status==='Hadir').length+'/'+r.length+' hadir':' — belum dicatat')}); });
  }else{
    const hari=HARI_ID[new Date().getDay()];
    arr('schedulesData').filter(s=>s.hari===hari).slice().sort((a,b)=>String(a.jam).localeCompare(String(b.jam),undefined,{numeric:true}))
      .forEach(s=>scheduleData.push({jam:un(s.jam||'-'),keg:un(s.mapel)+(s.classId!=null&&typeof akClassName==='function'?' — '+un(akClassName(s.classId)):'')}));
  }
  /* Pengumuman terbaru (yang sudah dipublikasikan) */
  announcementData.length=0;
  arr('announcementsData').filter(a=>a.status==='Dipublikasikan').slice().sort((a,b)=>String(b.publishDate).localeCompare(String(a.publishDate))).slice(0,6)
    .forEach(a=>announcementData.push({icon:'📢',judul:a.title,tanggal:fmtTglID(a.publishDate),kategori:a.category,status:a.priority==='Mendesak'?'Segera':(a.priority==='Penting'?'Penting':'Umum')}));
  /* Perlu tindak lanjut: hanya hal yang butuh aksi, dengan jumlah dan tautan ke menu */
  attentionData.length=0;
  const add=(menu,nama,ket,prio,n)=>{ if(n>0&&canSee(menu)) attentionData.push({nama,ket,prioritas:prio,waktu:'Buka →',target:menu}); };
  const ym=t.slice(0,7);
  add('ak-presensi','Siswa tidak hadir hari ini',attToday.filter(a=>a.status!=='Hadir').length+' siswa (izin/sakit/alpa)','warn',attToday.filter(a=>a.status!=='Hadir').length);
  add('ks-izin','Perizinan siswa menunggu persetujuan',arr('permitsData').filter(p=>p.status==='Pending').length+' pengajuan','warn',arr('permitsData').filter(p=>p.status==='Pending').length);
  const berat=vio.filter(v=>v.tingkat==='Berat'&&String(v.tanggal).startsWith(ym)).length;
  add('ks-pelanggaran','Pelanggaran berat bulan ini',berat+' kasus','urgent',berat);
  const open=arr('musyrifNotesData').filter(n=>n.status==='Open').length;
  add('bd-catatan','Catatan musyrif belum selesai',open+' catatan','warn',open);
  let late=0; try{ late=inv.filter(i=>{const s=invoiceComputed(i).status;return s==='Terlambat'||s==='Jatuh Tempo';}).length; }catch(e){}
  add('kg-tagihan','Tagihan jatuh tempo / terlambat',late+' tagihan','urgent',late);
  const dr=arr('damageReportsData').filter(d=>d.status==='Dilaporkan').length;
  add('sp-kerusakan','Laporan kerusakan baru',dr+' laporan','urgent',dr);
  const ln=arr('assetLoansData').filter(l=>l.status==='Menunggu').length;
  add('sp-inventaris','Peminjaman aset menunggu',ln+' pengajuan','warn',ln);
  const pr=arr('procurementRequestsData').filter(p=>['Pengajuan','Diverifikasi'].includes(p.status)).length;
  add('sp-pengajuan','Pengajuan barang diproses',pr+' pengajuan','warn',pr);
  const lv=arr('employeeLeavesData').filter(l=>l.status==='Menunggu').length;
  add('pg-izin','Izin/cuti pegawai menunggu',lv+' pengajuan','warn',lv);
  if(typeof acct!=='undefined'&&acct.pending>0&&typeof ptCanManage==='function'&&ptCanManage()) attentionData.push({nama:'Akun menunggu persetujuan',ket:acct.pending+' akun baru',prioritas:'urgent',waktu:'Buka →',target:'pt-user',tab:'persetujuan'});
}

/* ---------- kartu ringkasan per role ---------- */
function card(ic,bg,fg,val,label,sub,go){
  return `<div onclick="${go?`showView('${go}')`:''}" style="${go?'cursor:pointer':''}">${statCard5Html(ic,bg,fg,val,label,sub,'','up')}</div>`;
}
stat5GridHtml=function(){
  compute(); const s=dashboardStats; let cards=[];
  const siswa=card('👥','#E7F0F7','#1D6FA3',s.totalSiswa.value,'Total Siswa',s.totalSiswa.sub,canSee('ks-siswa')?'ks-siswa':'');
  const hadir=card('✅','#E4F5EE','#1C7B5D',s.kehadiranHariIni.value,'Kehadiran Hari Ini',s.kehadiranHariIni.sub,canSee('ak-presensi')?'ak-presensi':'');
  const nilai=card('📝','#FCF1DE','#A5730C',s.rataNilai.value,'Rata-rata Nilai',s.rataNilai.sub,canSee('ak-nilai')?'ak-nilai':'');
  const asrama=card('🏠','#EDE7F7','#5B3FA5',s.santriAsrama.value,'Santri Asrama',s.santriAsrama.sub,canSee('bd-presensi')?'bd-presensi':'');
  const tunggak=card('💰','#FBE7E5','#C0392B',kgRupiah(s.tunggakan.value),'Tunggakan Keuangan',s.tunggakan.sub,'kg-tagihan');
  if(curRole==='Kepala Sekolah'||curRole==='Super Admin') cards=[siswa,hadir,nilai,asrama,tunggak];
  else if(curRole==='Guru'||curRole==='Wali Kelas') cards=[siswa,hadir,nilai];
  else if(curRole==='Musyrif'){
    const ba=arr('boardingAttendanceData').filter(b=>b.tanggal===todayIso());
    const tl=arr('tahfidzLogData').filter(l=>l.tanggal===todayIso()&&l.jenis==='Setoran').length;
    cards=[asrama,
      card('🕌','#E4F5EE','#1C7B5D',ba.length?pct(ba.filter(b=>b.status==='Hadir').length,ba.length)+'%':'-','Hadir Kegiatan Asrama',ba.length?ba.length+' catatan hari ini':'Belum dicatat hari ini','bd-presensi'),
      card('📖','#FCF1DE','#A5730C',tl,'Setoran Tahfidz Hari Ini','Jumlah setoran tercatat','bd-tahfidz'),
      card('🗒','#E7F0F7','#1D6FA3',arr('musyrifNotesData').filter(n=>n.status==='Open').length,'Catatan Belum Selesai','Catatan musyrif status Open','bd-catatan')];
  }else if(curRole==='Sarpras'){
    const as=arr('assetsData');
    cards=[card('📦','#E7F0F7','#1D6FA3',as.length,'Total Aset','Terdata di inventaris','sp-inventaris'),
      card('🔧','#FBE7E5','#C0392B',as.filter(a=>/Rusak|Perbaikan|Hilang/.test(a.kondisi||'')).length,'Aset Bermasalah','Rusak / diperbaiki / hilang','sp-inventaris'),
      card('⚠️','#FCF1DE','#A5730C',arr('damageReportsData').filter(d=>d.status==='Dilaporkan').length,'Laporan Kerusakan Baru','Belum diverifikasi','sp-kerusakan'),
      card('🤝','#EDE7F7','#5B3FA5',arr('assetLoansData').filter(l=>l.status==='Dipinjam').length,'Sedang Dipinjam','Aset yang belum kembali','sp-inventaris'),
      card('🛒','#E4F5EE','#1C7B5D',arr('procurementRequestsData').filter(p=>['Pengajuan','Diverifikasi'].includes(p.status)).length,'Pengajuan Barang','Sedang diproses','sp-pengajuan')];
  }else return '';   /* Bendahara: ringkasan keuangan sudah ada di panelKeuanganStatsHtml */
  return `<div class="stat5-grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">${cards.join('')}</div>`;
};

/* ---------- panel: judul & keterangan jelas, ada keterangan bila data kosong ---------- */
panelKehadiranHtml=function(){
  const ok=attendanceData.values.some(v=>v!=null);
  return `<div class="panel"><div class="panel-head"><h2>Kehadiran Siswa</h2></div><p class="desc">Persentase siswa hadir per hari (Presensi KBM), 7 hari terakhir</p>${ok?'<div class="chart-wrap"><canvas id="chartKehadiran"></canvas></div>':emptyBox('Belum ada data presensi dalam 7 hari terakhir.<br>Isi di menu Presensi KBM.')}</div>`;
};
panelNilaiHtml=function(){
  const sm=((typeof akDefaultPeriod==='function'?akDefaultPeriod().sem:'Ganjil')||'Ganjil').toLowerCase();
  const d=academicData[sm]; const ok=d&&d.values.length;
  return `<div class="panel"><div class="panel-head"><h2>Nilai Akademik</h2><select class="mini-select" id="selSemester" onchange="onSemesterChange()"><option value="ganjil" ${sm==='ganjil'?'selected':''}>Semester Ganjil</option><option value="genap" ${sm==='genap'?'selected':''}>Semester Genap</option></select></div><p class="desc">Rata-rata nilai akhir per mata pelajaran (menu Nilai)</p>${ok?'<div class="chart-wrap"><canvas id="chartNilai"></canvas></div>':emptyBox('Belum ada nilai pada semester ini.<br>Isi di menu Nilai.')}</div>`;

  const w=document.getElementById('chartNilai'); const panel=sel.closest('.panel');

  if(dashCharts.chartNilai){ dashCharts.chartNilai.data.labels=d.labels; dashCharts.chartNilai.data.datasets[0].data=d.values; dashCharts.chartNilai.update(); }

panelKedisiplinanHtml=function(){
  const total=disciplineData.reduce((a,d)=>a+d.count,0);
  if(!total) return `<div class="panel"><h2>Kedisiplinan Siswa</h2><p class="desc">Pelanggaran siswa menurut tingkat (menu Pelanggaran)</p>${emptyBox('Belum ada pelanggaran tercatat. 👍')}</div>`;
  return `<div class="panel"><h2>Kedisiplinan Siswa</h2><p class="desc">Pelanggaran siswa menurut tingkat (menu Pelanggaran)</p><div class="donut-wrap chart-wrap sm"><canvas id="chartKedisiplinan"></canvas><div class="donut-center"><b>${total}</b><span>Pelanggaran</span></div></div><div class="donut-legend">${disciplineData.map(d=>`<span><i style="background:${d.color}"></i>${d.label}: ${d.count}</span>`).join('')}</div></div>`;
