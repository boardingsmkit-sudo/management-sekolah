<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMK IT Al-Hidayah — Boarding School Management</title>
<style>
:root{
  --navy:#0B2540; --navy2:#0E3358; --blue:#1D6FA3; --teal:#2A9D8F; --gold:#C9A227;
  --bg:#F5F7FA; --card:#FFFFFF; --ink:#12263A; --sub:#5B7285; --line:#E4EAEF; --danger:#C0392B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit;margin:0;padding:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif;background:var(--bg);color:var(--ink);height:100%;display:flex;overflow:hidden}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1B27;--card:#122A3B;--ink:#EAF1F6;--sub:#93ABBD;--line:#1E3A4E}}
:root[data-theme="dark"]{--bg:#0B1B27;--card:#122A3B;--ink:#EAF1F6;--sub:#93ABBD;--line:#1E3A4E}

/* LOGIN */
#login{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),#155A82);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#login .box{background:var(--card);width:100%;max-width:360px;border-radius:16px;padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#login .logo{display:block;width:100%;max-width:230px;height:auto;margin:0 auto 14px}
#login h1{font-size:17px;text-align:center;font-weight:700}
#login p.sub{font-size:12px;color:var(--sub);text-align:center;margin-top:2px;letter-spacing:.03em}
#login form{margin-top:22px;display:flex;flex-direction:column;gap:12px}
#login label{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:4px;display:block}
#login input,#login select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--bg);color:var(--ink)}
#login button{margin-top:6px;background:var(--navy);color:#fff;border:0;padding:11px;border-radius:8px;font-weight:700;font-size:13.5px;cursor:pointer}
#login .fp{text-align:center;font-size:12px;color:var(--blue);margin-top:12px;cursor:pointer}

/* SIDEBAR */
#side{width:250px;background:linear-gradient(180deg,var(--navy),#081C33);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s,margin .25s;padding-top:env(safe-area-inset-top,0px)}
#side.collapsed{width:70px}
#side .brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px}
#side .brand .lg{width:34px;height:34px;border-radius:9px;background:#fff;padding:3px;object-fit:contain;flex-shrink:0}
#side .brand .tx{overflow:hidden;white-space:nowrap}
#side .brand b{font-size:13px;display:block;line-height:1.25}
#side .brand span{font-size:10px;color:#9FC1D8;letter-spacing:.04em}
#side.collapsed .brand .tx{display:none}
#side nav{flex:1;overflow-y:auto;padding:10px 8px}
#side .glabel{font-size:10px;color:#7FA3BC;font-weight:700;letter-spacing:.06em;padding:14px 10px 6px}
#side.collapsed .glabel{display:none}
#side button.item{width:100%;text-align:left;background:none;border:0;color:#CFE3EF;font-size:13px;padding:9px 10px;border-radius:8px;display:flex;gap:10px;align-items:center;cursor:pointer;white-space:nowrap;overflow:hidden}
#side button.item{transition:background .18s,color .18s,box-shadow .18s}
#side button.item .ic{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:#A9C9DE;transition:color .18s}
#side button.item .ic svg.mi{width:20px;height:20px;display:block}
#side button.item.active{background:rgba(29,111,163,.65);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
#side button.item.active .ic{color:#fff}
#side button.item:hover{background:rgba(255,255,255,.08)}
#side button.item:hover .ic{color:#fff}
#side.collapsed button.item{justify-content:center;padding-left:0;padding-right:0}
#side.collapsed button.item .tx{display:none}
.qlink .ql-ic{display:inline-flex;align-items:center;justify-content:center}
.qlink .ql-ic svg.mi{width:20px;height:20px;display:block;color:var(--blue)}
#side .userbox{border-top:1px solid rgba(255,255,255,.12);padding:12px;display:flex;align-items:center;gap:10px}
#side .userbox .av{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#3A2E05;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
#side .userbox .ut{overflow:hidden;white-space:nowrap;flex:1}
#side .userbox b{font-size:12px;display:block}
#side .userbox span{font-size:10px;color:#9FC1D8}
#side.collapsed .userbox .ut,#side.collapsed .userbox button{display:none}
#side .userbox button{background:none;border:0;color:#F3B8B0;font-size:11px;cursor:pointer}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:58px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px;padding-top:env(safe-area-inset-top,0px)}
#topbar button.ic-btn{background:none;border:0;font-size:18px;color:var(--navy);cursor:pointer}
#topbar h1{font-size:15.5px;font-weight:700;flex:1}
#roleTag{font-size:11.5px;background:var(--bg);border:1px solid var(--line);padding:5px 10px;border-radius:20px;color:var(--sub)}
#content{flex:1;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .label{font-size:11px;color:var(--sub);font-weight:600}
.stat .val{font-size:22px;font-weight:700;margin-top:4px}
.stat .sub{font-size:11px;color:var(--teal);margin-top:2px}
.stat.warn .sub{color:var(--danger)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;overflow-x:auto}
.panel h2{font-size:14.5px;margin-bottom:4px}
.panel .desc{font-size:12px;color:var(--sub);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12.6px;min-width:480px}
th{text-align:left;color:var(--sub);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11.2px}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.badge{padding:3px 9px;border-radius:20px;font-size:10.8px;font-weight:600}
.b-green{background:#E4F5EE;color:#1C7B5D}.b-amber{background:#FCF1DE;color:#A5730C}.b-red{background:#FBE7E5;color:var(--danger)}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:5px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.linkrow span{background:var(--bg);border:1px solid var(--line);padding:5px 10px;border-radius:8px;font-size:11.5px}

/* ===== DASHBOARD UPGRADE ===== */
/* Header: search, notification, date, user chip */
.topbar-search{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.topbar-search .ts-ic{font-size:13px;opacity:.6;flex-shrink:0}
.topbar-search input{border:0;background:none;outline:0;font-size:12.5px;color:var(--ink);width:100%}
.topbar-search input::placeholder{color:var(--sub)}
@media (max-width:900px){.topbar-search{display:none}}
.topbar-notif{position:relative;font-size:16px;flex-shrink:0}
.topbar-notif .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid var(--card)}
.topbar-date{font-size:11.5px;color:var(--sub);white-space:nowrap;flex-shrink:0}
@media (max-width:700px){.topbar-date{display:none}}
.topbar-user{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-left:10px;border-left:1px solid var(--line)}
.topbar-user .tu-av{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.topbar-user .tu-tx{line-height:1.2;white-space:nowrap}
@media (max-width:560px){.topbar-user .tu-tx{display:none}}
.topbar-user b{font-size:11.5px;display:block}
.topbar-user span{font-size:10px;color:var(--sub)}

/* Welcome card */
.welcome-card{background:linear-gradient(120deg,var(--navy),#123A5E 65%,var(--teal));border-radius:14px;padding:18px 22px;margin-bottom:16px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.welcome-card .wc-left b{font-size:16px;font-weight:700;display:block}
.welcome-card .wc-left .wc-role{font-size:12px;color:#BFE0EE;margin-top:2px}
.welcome-card .wc-left .wc-quote{font-size:11.5px;color:#DCEAF2;margin-top:8px;max-width:460px;line-height:1.5;font-style:italic}
.welcome-card .wc-right{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);padding:8px 14px;border-radius:10px;flex-shrink:0}
.welcome-card .wc-right .wc-logo{width:34px;height:34px;border-radius:8px;background:#fff;padding:3px;object-fit:contain}
.welcome-card .wc-right .wc-id b{font-size:11.5px;display:block}
.welcome-card .wc-right .wc-id span{font-size:9.5px;color:#CDE6F0;letter-spacing:.04em}

/* 5 stat cards */
.stat5-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
@media (max-width:1100px){.stat5-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:680px){.stat5-grid{grid-template-columns:repeat(2,1fr)}}
.stat5{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.stat5 .s5-top{display:flex;align-items:center;justify-content:space-between}
.stat5 .s5-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat5 .s5-trend{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px}
.stat5 .s5-trend.up{background:#E4F5EE;color:#1C7B5D}
.stat5 .s5-trend.down{background:#FBE7E5;color:var(--danger)}
.stat5 .s5-val{font-size:21px;font-weight:800;line-height:1.15}
.stat5 .s5-label{font-size:11.5px;color:var(--sub);font-weight:600}
.stat5 .s5-sub{font-size:10.5px;color:var(--sub)}

/* Panel row layout */
.row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px;align-items:start}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start}
@media (max-width:1000px){.row3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.row3,.row2{grid-template-columns:1fr}}

.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.panel-head h2{margin-bottom:0}
.panel select.mini-select{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--bg);color:var(--ink)}
.chart-wrap{position:relative;height:220px;margin-top:8px}
.chart-wrap.sm{height:180px}

/* Perlu Perhatian */
.att-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.att-item:last-child{border-bottom:0}
.att-item .att-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.att-item .att-dot.urgent{background:var(--danger)}
.att-item .att-dot.warn{background:#C98A16}
.att-item .att-dot.ok{background:var(--teal)}
.att-item .att-body{flex:1;min-width:0}
.att-item .att-nama{font-size:12.5px;font-weight:600}
.att-item .att-ket{font-size:11px;color:var(--sub)}
.att-item .att-time{font-size:10px;color:var(--sub);flex-shrink:0;white-space:nowrap}
.btn-link{background:none;border:0;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;padding:8px 0 0;width:100%;text-align:center}
.btn-link:hover{text-decoration:underline}

/* Donut center label */
.donut-wrap{position:relative}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.donut-center b{font-size:20px;display:block;line-height:1}
.donut-center span{font-size:10px;color:var(--sub)}
.donut-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;justify-content:center}
.donut-legend span{font-size:10.5px;color:var(--sub);display:flex;align-items:center;gap:5px}
.donut-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Timeline */
.timeline{position:relative;padding-left:20px;margin-top:4px}
.timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:1.5px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-19px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--teal);border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--teal)}
.tl-item .tl-jam{font-size:10.5px;color:var(--sub);font-weight:700}
.tl-item .tl-keg{font-size:12.5px;font-weight:600;margin-top:1px}

/* Data Cepat quicklinks */
.qlink-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
@media (max-width:480px){.qlink-grid{grid-template-columns:repeat(2,1fr)}}
.qlink{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;font-size:11px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .15s}
.qlink:hover{background:var(--line)}
.qlink .ql-ic{font-size:18px}

/* Pengumuman */
.ann-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ann-item:last-child{border-bottom:0}
.ann-item .ann-ic{width:30px;height:30px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ann-item .ann-body{flex:1;min-width:0}
.ann-item .ann-title{font-size:12.5px;font-weight:600}
.ann-item .ann-meta{font-size:10.5px;color:var(--sub);margin-top:2px}

/* Personal dashboard (Orang Tua / Siswa) */
.pstat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.pstat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.pstat .p-ic{font-size:20px;margin-bottom:4px}
.pstat .p-val{font-size:18px;font-weight:800}
.pstat .p-label{font-size:11px;color:var(--sub);margin-top:2px}

/* ===== AKADEMIK — halaman terpisah per menu (satu menu = satu fungsi) ===== */
:root{
  --acc-blue:#1D6FA3; --acc-blue-bg:#E7F0F7;
  --acc-purple:#6C4FC7; --acc-purple-bg:#EEE9FA;
  --acc-green:#1C8A5A; --acc-green-bg:#E3F5EC;
  --acc-teal:#1F8A82; --acc-teal-bg:#E2F5F3;
  --acc-indigo:#4553B8; --acc-indigo-bg:#E9EAFA;
  --acc-emerald:#0E9A6C; --acc-emerald-bg:#DFF7ED;
  --acc-orange:#B8630F; --acc-orange-bg:#FBEEDD;
  --acc-red:#C0392B; --acc-red-bg:#FBE7E5;
}
/* PageHeader (reusable, warna aksen menyesuaikan menu) */
.acad-header{position:relative;border-radius:14px;padding:18px 22px;margin-bottom:14px;overflow:hidden;border:1px solid var(--line)}
.acad-header.c-blue{background:linear-gradient(120deg,var(--acc-blue-bg),#F7FAFD 70%)}
.acad-header.c-purple{background:linear-gradient(120deg,var(--acc-purple-bg),#F9F7FD 70%)}
.acad-header.c-green{background:linear-gradient(120deg,var(--acc-green-bg),#F6FBF8 70%)}
.acad-header.c-teal{background:linear-gradient(120deg,var(--acc-teal-bg),#F5FBFA 70%)}
.acad-header.c-indigo{background:linear-gradient(120deg,var(--acc-indigo-bg),#F7F7FD 70%)}
.acad-header.c-emerald{background:linear-gradient(120deg,var(--acc-emerald-bg),#F5FBF8 70%)}
.acad-header .ah-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.acad-header h1{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:.01em}
.acad-header p{font-size:12.5px;color:var(--sub);margin-top:4px;max-width:480px}
.acad-header .ah-crumb{font-size:10.5px;color:var(--sub);font-weight:600;letter-spacing:.03em;margin-bottom:4px;text-transform:uppercase}

/* StatCard row (reusable) */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.mini-stat{border-radius:11px;padding:12px;border:1px solid var(--line)}
.mini-stat .ms-val{font-size:19px;font-weight:800}
.mini-stat .ms-label{font-size:10.5px;color:var(--sub);margin-top:2px;font-weight:600}
.mini-stat.c-blue{background:var(--acc-blue-bg)} .mini-stat.c-blue .ms-val{color:var(--acc-blue)}
.mini-stat.c-purple{background:var(--acc-purple-bg)} .mini-stat.c-purple .ms-val{color:var(--acc-purple)}
.mini-stat.c-green{background:var(--acc-green-bg)} .mini-stat.c-green .ms-val{color:var(--acc-green)}
.mini-stat.c-teal{background:var(--acc-teal-bg)} .mini-stat.c-teal .ms-val{color:var(--acc-teal)}
.mini-stat.c-indigo{background:var(--acc-indigo-bg)} .mini-stat.c-indigo .ms-val{color:var(--acc-indigo)}
.mini-stat.c-emerald{background:var(--acc-emerald-bg)} .mini-stat.c-emerald .ms-val{color:var(--acc-emerald)}
.mini-stat.c-orange{background:var(--acc-orange-bg)} .mini-stat.c-orange .ms-val{color:var(--acc-orange)}
.mini-stat.c-red{background:var(--acc-red-bg)} .mini-stat.c-red .ms-val{color:var(--acc-red)}
.mini-stat.c-gray{background:var(--bg)} .mini-stat.c-gray .ms-val{color:var(--ink)}

/* FilterBar / Toolbar (reusable) */
.acad-toolrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.acad-toolrow input[type=text],.acad-toolrow input[type=date],.acad-toolrow select{
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11.5px;background:var(--bg);color:var(--ink)
}
.acad-toolrow .ti-search{display:flex;align-items:center;gap:6px;flex:1;min-width:160px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.acad-toolrow .ti-search input{border:0;background:none;outline:0;font-size:11.5px;width:100%}
.acad-toolrow .ti-spacer{flex:1}
.view-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
.view-toggle button{background:var(--card);border:0;padding:7px 12px;font-size:11.5px;font-weight:600;color:var(--sub);cursor:pointer}
.view-toggle button.active{background:var(--navy);color:#fff}

.btn-primary-sm{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 13px;font-size:11.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary-sm:hover{background:var(--navy2)}
.btn-outline-sm{background:var(--card);color:var(--navy);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-size:11.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-outline-sm:hover{background:var(--bg)}
.acad-actionbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

.row-actions{display:flex;gap:4px}
.row-actions button{background:none;border:1px solid var(--line);border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--sub);font-size:12px}
.row-actions button:hover{background:var(--bg);color:var(--navy)}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--bg)}
tbody tr.clickable{cursor:pointer}

.badge.g-90{background:#E4F5EE;color:#1C7B5D}
.badge.g-80{background:#E7F0F7;color:#1D6FA3}
.badge.g-70{background:#FCF1DE;color:#A5730C}
.badge.g-below{background:#FBE7E5;color:var(--danger)}
.badge.st-hadir{background:var(--acc-green-bg);color:var(--acc-green)}
.badge.st-izin{background:var(--acc-blue-bg);color:var(--acc-blue)}
.badge.st-sakit{background:var(--acc-orange-bg);color:var(--acc-orange)}
.badge.st-alpa{background:var(--acc-red-bg);color:var(--acc-red)}
.badge.st-cuti{background:var(--acc-purple-bg);color:var(--acc-purple)}
.badge.cond-baik{background:var(--acc-green-bg);color:var(--acc-green)}
.badge.cond-ringan{background:var(--acc-orange-bg);color:var(--acc-orange)}
.badge.cond-berat{background:var(--acc-red-bg);color:var(--acc-red)}
.badge.cond-perbaikan{background:var(--acc-blue-bg);color:var(--acc-blue)}
.badge.cond-dipinjam{background:var(--acc-purple-bg);color:var(--acc-purple)}
.badge.cond-hilang{background:#EEF1F4;color:#5B7285}
.badge.b-gray{background:#EEF1F4;color:#5B7285}

/* ===== PENGUMUMAN & PENGATURAN — tambahan CSS ===== */
/* Notification dropdown (navbar) */
#notifDropdown{position:fixed;top:56px;right:16px;width:320px;max-width:90vw;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.18);z-index:170;display:none;max-height:70vh;overflow-y:auto}
#notifDropdown.show{display:block}
#notifDropdown .nd-head{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
#notifDropdown .nd-item{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
#notifDropdown .nd-item:hover{background:var(--bg)}
#notifDropdown .nd-item:last-child{border-bottom:0}
#notifDropdown .nd-empty{padding:20px 14px;text-align:center;color:var(--sub);font-size:12px}
.topbar-notif .count{position:absolute;top:1px;right:-2px;min-width:15px;height:15px;padding:0 3px;border-radius:20px;background:var(--danger);color:#fff;
  font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--card)}

/* Settings internal sidebar (Pengaturan) */
.settings-layout{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.settings-layout{grid-template-columns:1fr}}
.settings-nav{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;position:sticky;top:0}
.settings-nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 11px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;margin-bottom:2px}
.settings-nav button.active{background:var(--acc-blue-bg);color:var(--acc-blue)}
.settings-nav button:hover:not(.active){background:var(--bg)}
.settings-panel{min-width:0}

/* Toggle switch (Notifikasi settings) */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:0}
.toggle-row .tr-label{font-size:12.5px;font-weight:600}
.tg-switch{position:relative;width:38px;height:21px;border-radius:20px;background:var(--line);cursor:pointer;flex-shrink:0;transition:background .15s}
.tg-switch.on{background:var(--acc-green)}
.tg-switch .tg-knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg-switch.on .tg-knob{left:19px}

/* Pengumuman */
.ann-list-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ann-list-item:last-child{border-bottom:0}
.ann-list-item:hover{background:var(--bg)}
.ann-list-item .ann-pin{color:#C9A227;font-size:13px;flex-shrink:0;margin-top:2px}
.ann-list-item .ann-main{flex:1;min-width:0}
.ann-list-item .ann-title-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ann-list-item .ann-title{font-size:13px;font-weight:700}
.ann-list-item .ann-meta2{font-size:11px;color:var(--sub);margin-top:3px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.tpl-card{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-size:11px;font-weight:600}
.tpl-card:hover{background:var(--bg)}
.ann-preview-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;max-width:440px;margin:0 auto}
.ann-preview-box .ap-head{text-align:center;font-weight:800;font-size:13px;color:var(--navy);letter-spacing:.05em;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.ann-preview-box .ap-title{font-size:14.5px;font-weight:700;margin-bottom:6px}
.ann-preview-box .ap-meta{font-size:11px;color:var(--sub);margin-bottom:10px}
.ann-preview-box .ap-content{font-size:12.5px;line-height:1.6;margin-bottom:10px}
.ann-preview-box .ap-date{font-size:11px;color:var(--sub);text-align:right;border-top:1px solid var(--line);padding-top:8px}
.read-bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0}
.read-bar i{display:block;height:100%;background:var(--acc-green)}

/* EmptyState (reusable) */
.acad-empty{text-align:center;padding:36px 16px;color:var(--sub)}
.acad-empty .ee-ic{font-size:26px;margin-bottom:8px}
.acad-empty .ee-title{font-size:13px;font-weight:700;color:var(--ink)}
.acad-empty .ee-sub{font-size:11.5px;margin-top:3px}

/* Pagination (reusable) */
.acad-pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.acad-pagination .pg-info{font-size:11px;color:var(--sub)}
.acad-pagination .pg-btns{display:flex;gap:4px}
.acad-pagination .pg-btns button{background:var(--card);border:1px solid var(--line);border-radius:7px;width:28px;height:28px;font-size:11.5px;cursor:pointer;color:var(--ink)}
.acad-pagination .pg-btns button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.acad-pagination .pg-btns button:disabled{opacity:.4;cursor:not-allowed}

/* DetailDrawer (reusable slide-in panel) */
#acadDrawerOverlay{position:fixed;inset:0;background:rgba(11,37,64,.35);z-index:150;display:none;opacity:0;transition:opacity .2s}
#acadDrawerOverlay.show{display:block;opacity:1}
#acadDrawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--card);z-index:151;
  box-shadow:-12px 0 32px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#acadDrawer.show{transform:translateX(0)}
#acadDrawer .dw-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
#acadDrawer .dw-head h3{font-size:14.5px;font-weight:700}
#acadDrawer .dw-close{background:none;border:0;font-size:18px;cursor:pointer;color:var(--sub)}
#acadDrawer .dw-body{padding:18px 20px;overflow-y:auto;flex:1}
#acadDrawer .dw-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
#acadDrawer .dw-row span:first-child{color:var(--sub)}
#acadDrawer .dw-row span:last-child{font-weight:600;text-align:right}
#acadDrawer .dw-section{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 6px}
#acadDrawer .dw-para{font-size:12.3px;line-height:1.6;color:var(--ink)}
#acadDrawer .dw-student{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}

/* Weekly Calendar (Jadwal) */
.cal-wrap{overflow-x:auto}
.cal-grid{display:grid;grid-template-columns:56px repeat(6,minmax(120px,1fr));gap:6px;min-width:760px}
.cal-grid .cal-time{font-size:10px;color:var(--sub);padding:8px 4px;text-align:right}
.cal-grid .cal-daylabel{font-size:11px;font-weight:700;color:var(--navy);text-align:center;padding:6px 4px;background:var(--bg);border-radius:6px}
.cal-cell{min-height:26px}
.cal-event{border-radius:7px;padding:6px 7px;font-size:10.3px;line-height:1.35;margin-bottom:4px;border-left:3px solid transparent}
.cal-event b{display:block;font-size:10.8px}
.cal-event.c-blue{background:var(--acc-blue-bg);border-color:var(--acc-blue);color:var(--acc-blue)}
.cal-event.c-purple{background:var(--acc-purple-bg);border-color:var(--acc-purple);color:var(--acc-purple)}
.cal-event.c-green{background:var(--acc-green-bg);border-color:var(--acc-green);color:var(--acc-green)}
.cal-event.c-teal{background:var(--acc-teal-bg);border-color:var(--acc-teal);color:var(--acc-teal)}
.cal-event.c-indigo{background:var(--acc-indigo-bg);border-color:var(--acc-indigo);color:var(--acc-indigo)}
.cal-event.c-emerald{background:var(--acc-emerald-bg);border-color:var(--acc-emerald);color:var(--acc-emerald)}

/* Rapor preview */
.rapor-preview{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;font-size:12px;color:var(--ink)}
.rapor-preview .rp-head{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:14px}
.rapor-preview .rp-head b{font-size:14px;color:var(--navy);display:block}
.rapor-preview .rp-head span{font-size:10.5px;color:var(--sub)}
.rapor-preview .rp-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:11.5px;margin-bottom:14px}
.rapor-preview table{margin-bottom:10px}
.rapor-preview .rp-sign{display:flex;justify-content:space-between;margin-top:28px;font-size:11px;text-align:center}
.rapor-preview .rp-sign div{width:150px}
.rapor-preview .rp-sign .sign-line{margin-top:40px;border-top:1px solid var(--ink);padding-top:4px}

.acad-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--navy);color:#fff;
  font-size:12px;padding:10px 18px;border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:200}
.acad-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== KESISWAAN — tambahan di atas design system Akademik ===== */
.acad-header.c-orange{background:linear-gradient(120deg,var(--acc-orange-bg),#FDF8F2 70%)}
.acad-header.c-red{background:linear-gradient(120deg,var(--acc-red-bg),#FDF5F4 70%)}
.bd-chk{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.bd-chk input{width:17px;height:17px}
.bc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bc-card{cursor:pointer;transition:box-shadow .15s}
.bc-card:hover{box-shadow:0 6px 18px rgba(0,0,0,.08)}
.bc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;gap:8px}

.stu-avatar{width:34px;height:34px;border-radius:50%;background:var(--acc-blue-bg);color:var(--acc-blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;flex-shrink:0}
.stu-avatar.lg{width:60px;height:60px;font-size:19px}
.stu-cell{display:flex;align-items:center;gap:9px}

.dw-tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 20px;flex-shrink:0}
.dw-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;font-size:11.3px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap;margin-right:14px}
.dw-tabs button.active{color:var(--navy);border-bottom-color:var(--navy)}

.badge.lvl-ringan{background:var(--acc-green-bg);color:var(--acc-green)}
.badge.lvl-sedang{background:var(--acc-orange-bg);color:var(--acc-orange)}
.badge.lvl-berat{background:var(--acc-red-bg);color:var(--acc-red)}
.badge.rank-1{background:#FCF1DE;color:#A5730C}
.badge.rank-2{background:#EEF1F4;color:#5B7285}
.badge.rank-3{background:#FBEEDD;color:#B8630F}
.badge.rank-other{background:var(--acc-blue-bg);color:var(--acc-blue)}

.acad-restricted{text-align:center;padding:34px 16px;color:var(--sub)}
.acad-restricted .rr-ic{font-size:26px;margin-bottom:8px}
.acad-restricted .rr-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px}
.acad-restricted .rr-sub{font-size:11.5px;max-width:320px;margin:0 auto;line-height:1.5}

/* ConfirmDialog (reusable) */
#acadConfirmOverlay{position:fixed;inset:0;background:rgba(11,37,64,.35);z-index:160;display:none;align-items:center;justify-content:center;padding:20px}
#acadConfirmOverlay.show{display:flex}
#acadConfirmBox{background:var(--card);border-radius:14px;padding:22px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#acadConfirmBox .cf-title{font-size:14px;font-weight:700;margin-bottom:6px}
#acadConfirmBox .cf-msg{font-size:12px;color:var(--sub);margin-bottom:18px;line-height:1.5}
#acadConfirmBox .cf-actions{display:flex;gap:8px;justify-content:flex-end}

/* ===== KEUANGAN — tambahan di atas design system Akademik/Kesiswaan ===== */
.dw-field{margin-bottom:12px}
.dw-field label{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-bottom:4px}
.dw-field input,.dw-field select,.dw-field textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;background:var(--bg);color:var(--ink);
}
.dw-field .dw-hint{font-size:10.5px;color:var(--sub);margin-top:3px}
.dw-field-row{display:flex;gap:10px}
.dw-field-row .dw-field{flex:1}
.dw-formfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
tr.voided td{opacity:.5;text-decoration:line-through}
.viewonly-banner{font-size:11.5px;color:var(--acc-blue);background:var(--acc-blue-bg);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.kg-saldo-pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px}


@media (max-width:820px){
  #side{position:fixed;inset:0 auto 0 0;z-index:40;margin-left:-250px;width:250px !important}
  #side.open{margin-left:0;box-shadow:0 0 30px rgba(0,0,0,.3)}
  #collapseBtn{display:none}
}

/* ---- Chart.js helpers (grafik sungguhan, bukan progress bar) ---- */
let dashCharts={};
function destroyDashCharts(){ Object.values(dashCharts).forEach(c=>{ try{c.destroy();}catch(e){} }); dashCharts={}; }
function chartTextColor(){ return (getComputedStyle(document.documentElement).getPropertyValue('--sub')||'#5B7285').trim(); }
function chartLineColor(){ return (getComputedStyle(document.documentElement).getPropertyValue('--line')||'#E4EAEF').trim(); }
function buildLineChart(canvasId,labels,values,color,label,suffix){
  const ctx=document.getElementById(canvasId); if(!ctx||typeof Chart==='undefined') return;
  dashCharts[canvasId]=new Chart(ctx,{type:'line',
    data:{labels,datasets:[{label,data:values,borderColor:color,backgroundColor:color+'22',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:color}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.formattedValue}${suffix||''}`}}},
      scales:{x:{grid:{display:false},ticks:{color:chartTextColor(),font:{size:10.5}}},y:{grid:{color:chartLineColor()},ticks:{color:chartTextColor(),font:{size:10.5},callback:v=>v+(suffix||'')}}}}});
}
function buildBarChart(canvasId,labels,values,color,label,suffix){
  const ctx=document.getElementById(canvasId); if(!ctx||typeof Chart==='undefined') return;
  dashCharts[canvasId]=new Chart(ctx,{type:'bar',
    data:{labels,datasets:[{label,data:values,backgroundColor:color,borderRadius:6,maxBarThickness:34}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.formattedValue}${suffix||''}`}}},
      scales:{x:{grid:{display:false},ticks:{color:chartTextColor(),font:{size:10.5}}},y:{grid:{color:chartLineColor()},ticks:{color:chartTextColor(),font:{size:10.5},callback:v=>v+(suffix||'')}}}}});
}
function buildGroupedBarChart(canvasId,labels,datasets){
  const ctx=document.getElementById(canvasId); if(!ctx||typeof Chart==='undefined') return;
  dashCharts[canvasId]=new Chart(ctx,{type:'bar',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:chartTextColor(),font:{size:10.5},boxWidth:10}}},
      scales:{x:{grid:{display:false},ticks:{color:chartTextColor(),font:{size:10.5}}},y:{grid:{color:chartLineColor()},ticks:{color:chartTextColor(),font:{size:10.5}}}}}});
}
function buildDonutChart(canvasId,items){
  const ctx=document.getElementById(canvasId); if(!ctx||typeof Chart==='undefined') return;
  dashCharts[canvasId]=new Chart(ctx,{type:'doughnut',
    data:{labels:items.map(i=>i.label),datasets:[{data:items.map(i=>i.value),backgroundColor:items.map(i=>i.color),borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'72%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${c.formattedValue}%`}}}}});
}

/* ---- Fragment builders ---- */
function fmtRupiah(n){ return 'Rp'+(n/1000000).toLocaleString('id-ID',{maximumFractionDigits:1})+'jt'; }
function statCard5Html(ic,bg,fg,val,label,sub,trend,trendDir){
  return `<div class="stat5"><div class="s5-top"><div class="s5-ic" style="background:${bg};color:${fg}">${ic}</div>${trend?`<span class="s5-trend ${trendDir}">${trend}</span>`:''}</div><div class="s5-val">${val}</div><div class="s5-label">${label}</div><div class="s5-sub">${sub}</div></div>`;
}
function stat5GridHtml(){
  const s=dashboardStats;

    ${statCard5Html('🏠','#EDE7F7','#5B3FA5',s.santriAsrama.value,'Santri Asrama',s.santriAsrama.sub,s.santriAsrama.trend,'up')}
    ${statCard5Html('💰','#FBE7E5','#C0392B',fmtRupiah(s.tunggakan.value),'Tunggakan Keuangan',s.tunggakan.sub,s.tunggakan.trend,'down')}
  </div>`;
}

function attentionListHtml(limit){
  return attentionData.slice(0,limit||attentionData.length).map(a=>`<div class="att-item"><span class="att-dot ${a.prioritas}"></span><div class="att-body"><div class="att-nama">${a.nama}</div><div class="att-ket">${a.ket}</div></div><span class="att-time">${a.waktu}</span></div>`).join('');
}
function timelineHtml(){ return scheduleData.map(s=>`<div class="tl-item"><div class="tl-jam">${s.jam}</div><div class="tl-keg">${s.keg}</div></div>`).join(''); }
function quicklinksHtml(ids){
  const list=(ids||DEFAULT_QUICKLINKS).map(id=>({id,...QUICKLINK_DEFS[id]})).filter(x=>x.label);
  return `<div class="qlink-grid">${list.map(q=>`<div class="qlink" onclick="showView('${q.id}')"><span class="ql-ic">${q.id==='ks-siswa'?svgIcon('plus'):(MENU_ICON_BY_ID[q.id]?svgIcon(MENU_ICON_BY_ID[q.id]):q.ic)}</span>${q.label}</div>`).join('')}</div>`;
}
function announcementListHtml(limit){
  const badgeClass=st=>st==='Penting'?'b-red':(st==='Segera'?'b-amber':'b-green');
  return announcementData.slice(0,limit||announcementData.length).map(a=>`<div class="ann-item"><div class="ann-ic">${a.icon}</div><div class="ann-body"><div class="ann-title">${a.judul}</div><div class="ann-meta">${a.tanggal} · ${a.kategori}</div></div><span class="badge ${badgeClass(a.status)}">${a.status}</span></div>`).join('');
}
function disciplineLegendHtml(){ return `<div class="donut-legend">${disciplineData.map(d=>`<span><i style="background:${d.color}"></i>${d.label} (${d.value}%)</span>`).join('')}</div>`; }
function expandAttention(){
  document.getElementById('attWrap').innerHTML=attentionListHtml(attentionData.length);
  const btn=document.getElementById('btnAttMore'); if(btn) btn.remove();
}
function onSemesterChange(){
  const sel=document.getElementById('selSemester'); if(!sel) return;
  const d=academicData[sel.value];
  if(dashCharts['chartNilai']){ dashCharts['chartNilai'].data.labels=d.labels; dashCharts['chartNilai'].data.datasets[0].data=d.values; dashCharts['chartNilai'].update(); }
}

const CURRENT_GURU_NAME='Ahmad Fauzi';
const CURRENT_WALI_KELAS='X TKJ 1';
/* Kunci nama untuk mencocokkan nama akun dengan nama yang diketik Admin di Jadwal / Data Kelas:
   abaikan huruf besar-kecil, spasi ganda/ujung, tanda baca, dan aksen. (Sebelumnya perbandingan persis -> kelas "hilang" bagi guru
   bila Admin mengetik nama sedikit berbeda.) Gelar/sebutan (Ust., Bpk., S.Pd) TIDAK dibuang agar tidak salah cocok antar orang. */
function acadNameKey(s){
  let t=String(s==null?'':s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
  try{ t=t.normalize('NFKD').replace(/[\u0300-\u036f]/g,''); }catch(e){}
  return t.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function acadScopeKelasList(){
  const db=(typeof dkState!=='undefined'&&dkState.fromDb);   /* mode Supabase: pakai nama akun yang login (profiles.nama) */
  const me=db?acadNameKey(ROLE_NAME[curRole]):'';
  if(curRole==='Wali Kelas') return db? classesData.filter(c=>dkState.raw[c.id]&&me&&acadNameKey(dkState.raw[c.id].wali_kelas)===me).map(c=>c.nama) : [CURRENT_WALI_KELAS];
  if(curRole==='Guru'){
    if(!db) return [...new Set(schedulesData.filter(s=>s.guru===CURRENT_GURU_NAME).map(s=>s.kelas))];
    return [...new Set(schedulesData.filter(s=>me&&acadNameKey(s.guru)===me).map(s=>s.kelas))];
  }
  if(curRole==='Orang Tua'||curRole==='Siswa') return db? [...new Set(studentsData.map(s=>s.kelas))].filter(k=>k&&k!=='-') : [(personalData[curRole]||personalData['Siswa']).kelas];
  return null; // null = akses semua kelas (Kepsek/Super Admin)
}
function acadFilterByScope(rows,kelasField){
  const scope=acadScopeKelasList();
  if(!scope) return rows;
  return rows.filter(r=>scope.includes(r[kelasField]));
}

/* ---- Component: Pagination ---- */
function acadPaginate(rows,page,perPage){
  const totalPages=Math.max(1,Math.ceil(rows.length/perPage));
  page=Math.min(Math.max(1,page),totalPages);
  return {rows:rows.slice((page-1)*perPage,page*perPage),page,totalPages,total:rows.length};
}
function acadPaginationHtml(page,totalPages,total,fnName){
  let btns='';
  for(let i=1;i<=totalPages;i++) btns+=`<button class="${i===page?'active':''}" onclick="${fnName}(${i})">${i}</button>`;
  return `<div class="acad-pagination">
    <span class="pg-info">Menampilkan halaman ${page} dari ${totalPages} (${total} data)</span>
    <div class="pg-btns">
      <button ${page<=1?'disabled':''} onclick="${fnName}(${page-1})">‹</button>${btns}<button ${page>=totalPages?'disabled':''} onclick="${fnName}(${page+1})">›</button>
    </div></div>`;
}

  );

const DK_TABLE='classes';
const DK_WRITE_ROLES=['Super Admin'];          /* samakan dengan policy RLS di supabase-classes-setup.sql */
function dkCanManage(){ return DK_WRITE_ROLES.includes(curRole); }
function dkClient(){ return (typeof supabaseClient!=='undefined'&&supabaseClient)?supabaseClient:null; }
function dkEsc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dkDash(v){ return (v==null||String(v).trim()==='')?'-':dkEsc(v); }
const dkState={raw:{},loading:false,fromDb:false,missing:new Set()};
const DK_OPTIONAL_COLS=['tingkat','jurusan','wali_kelas','tahun_ajaran'];
function dkIsMissingColErr(e){ return !!e&&(e.code==='42703'||e.code==='PGRST204'||/column .* does not exist|Could not find the .* column/i.test(e.message||'')); }
function dkErrMsg(e,aksi){
  const code=(e&&e.code)||'', raw=(e&&e.message)||String(e||'Error tidak diketahui');
  if(code==='42P01'||/relation .* does not exist|Could not find the table/i.test(raw)) return 'Tabel classes belum ada di Supabase. Jalankan supabase-classes-setup.sql.';
  if(code==='42501'||/row-level security|permission denied/i.test(raw)) return 'Ditolak oleh RLS: role Anda tidak berhak, atau policy tabel classes belum dibuat (jalankan supabase-classes-setup.sql). Detail: '+raw;
  if(code==='23505') return 'Nama kelas sudah dipakai kelas lain. Database menolak duplikat.';
  if(code==='23503') return aksi==='hapus' ? 'Kelas tidak bisa dihapus karena masih dipakai data lain (mis. siswa atau jadwal). Pindahkan/hapus data tersebut dulu.' : 'Relasi data tidak valid: '+raw;
  if(code==='23502') return 'Ada kolom wajib di tabel classes yang belum terisi: '+raw+' (jalankan supabase-classes-setup.sql).';
  return raw;
}

function dkFromRow(r,no){
  dkState.raw[r.id]=r;
  const o={ id:r.id, no:no, nama:dkEsc(r.nama||''),
    tingkat:dkEsc(r.tingkat||dkTingkatFromNama(r.nama)||''),
    jurusan:dkDash(r.jurusan), wali:dkDash(r.wali_kelas), tahunAjaran:dkDash(r.tahun_ajaran) };
  Object.defineProperty(o,'siswa',{enumerable:true,get(){ return (typeof studentsData!=='undefined'?studentsData:[]).filter(s=>s.classId!=null&&String(s.classId)===String(r.id)).length; }});
  return o;

async function dkReload(opts){
  opts=opts||{}; const silent=!!opts.silent;
  const sb=dkClient(); if(typeof dbFetchAll!=='function') { if(!silent) dkShowMsg('Mode demo: Supabase belum terhubung, data kelas tidak disimpan.','warn'); return false; }
  if(!sb){ if(!silent) dkShowMsg('Mode demo: Supabase belum terhubung, data kelas tidak disimpan.','warn'); return false; }
  if(dkState.loading) return false;
  dkState.loading=true;
  try{
    const rows=await dbFetchAll(DK_TABLE,'*','nama');
    dkState.raw={}; dkState.fromDb=true;
    classesData.length=0;
    rows.forEach((r,i)=>classesData.push(dkFromRow(r,i+1)));
    if(document.getElementById('dkTableBody')){
      if(!silent) dkShowMsg(rows.length?'':'Tabel classes terhubung, tetapi belum ada data kelas. Klik + Tambah Kelas.', rows.length?'ok':'info');
      dkRefreshHeader(); dkRenderTable();
    }
    /* jumlah siswa & pilihan kelas di form siswa butuh data siswa terbaru */
    if(typeof stState!=='undefined' && typeof stReload==='function' && !stState.fromDb){
      stReload({silent:true}).then(()=>{ dkRefreshHeader(); dkRenderTable(); }).catch(()=>{});
    }
    return true;
  }catch(e){
    console.error('dkReload',e);
    if(document.getElementById('dkMsg')) dkShowMsg('Gagal memuat data kelas: '+dkErrMsg(e),'error');
    return false;
  }finally{ dkState.loading=false; }
}

let __dkSubmitting=false;
async function dkSubmit(id){
  if(__dkSubmitting) return;
  if(!dkCanManage()){ dkFormError('Anda tidak memiliki izin untuk menyimpan data kelas.'); return; }
  const sb=dkClient(); if(!sb){ dkFormError('Supabase belum terhubung.'); return; }
  const val=i=>{ const x=document.getElementById(i); return x?x.value.trim().replace(/\s+/g,' '):''; };
  const orNull=x=>x===''?null:x;
  const nama=val('dkfNama');
  if(!nama){ dkFormError('Nama kelas wajib diisi.'); return; }
  const dup=Object.values(dkState.raw).some(x=>String(x.id)!==String(id||'')&&String(x.nama||'').trim().toLowerCase()===nama.toLowerCase());
  if(dup){ dkFormError('Nama kelas "'+nama+'" sudah ada. Gunakan nama lain.'); return; }
  const payload={nama, tingkat:orNull(val('dkfTingkat')||dkTingkatFromNama(nama)), jurusan:orNull(val('dkfJurusan')), wali_kelas:orNull(val('dkfWali')), tahun_ajaran:orNull(val('dkfTahun'))};
  dkState.missing.forEach(c=>{ if(c!=='jurusan') delete payload[c]; });   /* jurusan tidak boleh dibuang diam-diam */
  dkFormError('');
  __dkSubmitting=true; const btn=document.getElementById('dkfSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    let res, skipped=[];
    for(let attempt=0; attempt<6; attempt++){
      res=id? await sb.from(DK_TABLE).update(payload).eq('id',id).select()
            : await sb.from(DK_TABLE).insert(payload).select();
      const e=res.error;
      if(dkIsMissingColErr(e)){
        const m=/'([^']+)' column/i.exec(e.message||'')||/column "?(?:classes\.)?([A-Za-z0-9_]+)"? /i.exec(e.message||'');
        const col=m&&m[1];
        if(col==='jurusan'&&payload.jurusan!=null){ throw {code:'42703',message:'Kolom "jurusan" belum ada di tabel classes, jadi jurusan tidak bisa disimpan. Jalankan di Supabase SQL Editor: alter table public.classes add column if not exists jurusan text;'}; }
        if(col&&DK_OPTIONAL_COLS.includes(col)&&(col in payload)){ delete payload[col]; skipped.push(col); dkState.missing.add(col); continue; }
      }
      break;
    }
    if(res.error) throw res.error;
    if(!res.data||!res.data.length){
      throw {code:'42501',message:id?'Tidak ada baris yang berubah: data tidak ditemukan atau update diblokir RLS.':'Insert tidak mengembalikan data: kebijakan RLS (INSERT/SELECT) kemungkinan memblokir.'};
    }
    const savedRow=res.data[0]; const jurLost=payload.jurusan!=null&&String(savedRow.jurusan==null?'':savedRow.jurusan).trim()!==String(payload.jurusan).trim();
    closeAcadDrawer();
    if(jurLost) dkShowMsg('Peringatan: kelas tersimpan tetapi jurusan yang dikembalikan database ('+(savedRow.jurusan||'kosong')+') berbeda dari input ('+payload.jurusan+'). Periksa trigger/kebijakan kolom jurusan.','warn');
    showAcadToast((id?'Data kelas berhasil diperbarui.':'Kelas baru berhasil disimpan.')+(skipped.length?' Kolom tidak ada di database dan dilewati: '+skipped.join(', ')+'. Jalankan supabase-classes-setup.sql.':''));
    await dkReload({silent:true});
    dkAfterChange();
  }catch(e){
    console.error('dkSubmit',e);
    dkFormError('Gagal menyimpan: '+dkErrMsg(e,id?'ubah':'tambah')); showAcadToast('Gagal menyimpan data kelas.');
  }finally{
    __dkSubmitting=false; const b2=document.getElementById('dkfSubmit'); if(b2){ b2.disabled=false; b2.textContent=id?'Simpan Perubahan':'Simpan Kelas'; }
  }
}

function akDownloadCsv(name,headers,rows){

    showAcadToast('File '+name+' diunduh (bisa dibuka di Excel).');

function pkStatsArray(){
  const rows=pkScopedRows(); const count=st=>rows.filter(r=>r.status===st).length; const total=rows.length||1;
  return [
    {color:'gray',val:rows.length,label:'Total Catatan'},
    {color:'green',val:Math.round(count('Hadir')/total*1000)/10+'%',label:'Hadir'},
    {color:'blue',val:Math.round(count('Izin')/total*1000)/10+'%',label:'Izin'},
    {color:'orange',val:Math.round(count('Sakit')/total*1000)/10+'%',label:'Sakit'}
  ];
}
function pkUpdateTrend(){
  const by={}; pkScopedRows().forEach(r=>{ if(!r.tanggal) return; const b=(by[r.tanggal]=by[r.tanggal]||{h:0,t:0}); b.t++; if(r.status==='Hadir') b.h++; });
  const ds=Object.keys(by).sort().slice(-6);
  if(!ds.length){ kbmAttendanceTrend.labels=['Sen','Sel','Rab','Kam','Jum','Sab']; kbmAttendanceTrend.values=[0,0,0,0,0,0]; return; }
  kbmAttendanceTrend.labels=ds.map(d=>d.slice(8,10)+'/'+d.slice(5,7)); kbmAttendanceTrend.values=ds.map(d=>Math.round(by[d].h/by[d].t*1000)/10);
}

  if(dashCharts['chartPresensiTrend']){ try{dashCharts['chartPresensiTrend'].destroy();}catch(e){} delete dashCharts['chartPresensiTrend']; }

/* ---- Form sesi presensi: satu kelas + satu mapel + satu tanggal, semua siswa sekaligus ---- */
function pkSessExisting(tanggal,classId,mapel){
  const m={}; attendanceRecordsData.forEach(r=>{ if(r.tanggal===tanggal&&String(r.classId)===String(classId)&&akUnesc(r.mapel).toLowerCase()===String(mapel||'').toLowerCase()) m[String(r.studentId)]=r; });
  return m;
}
/* Mapel yang boleh dipresensi = mapel yang dijadwalkan pada HARI dari tanggal yang dipilih (untuk kelas itu; guru hanya jadwalnya sendiri). */
let pkSessRec=null, pkSessInit='';
const PK_HARI_NAMA=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function pkHariOf(tgl){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(tgl||'')); return m?PK_HARI_NAMA[new Date(+m[1],+m[2]-1,+m[3]).getDay()]:''; }
function pkMapelOfDay(cid,tgl){
  const hari=pkHariOf(tgl); if(!cid||!hari) return [];
  let rows=schedulesData.filter(s=>String(s.classId)===String(cid)&&s.hari===hari);
  if(curRole==='Guru') rows=rows.filter(s=>akIsMine(s.guru));
  const out=rows.map(s=>akUnesc(s.mapel));
  if(pkSessRec&&String(pkSessRec.classId)===String(cid)&&pkSessRec.tanggal===tgl) out.push(akUnesc(pkSessRec.mapel));
  return [...new Set(out)].sort();
}
function pkOpenSession(id){
  if(!kscCan('pk','write')){ showAcadToast('Anda tidak memiliki izin untuk menginput presensi KBM.'); return; }
  const rec=id?attendanceRecordsData.find(r=>String(r.id)===String(id)):null;
  if(id&&!rec){ showAcadToast('Data tidak ditemukan. Muat ulang halaman.'); return; }
  const classes=akScopedClasses();
  if(!classes.length){ showAcadToast('Belum ada data kelas yang dapat Anda akses.'); return; }
  pkSessRec=rec||null;
  const tgl=rec?rec.tanggal:ksToday(), cid=rec?rec.classId:'', mapel=rec?akUnesc(rec.mapel):'', guru=rec?akUnesc(rec.guru==='-'?'':rec.guru):akMyName(), jam=rec&&rec.jam!=='-'?akUnesc(rec.jam):'';
  pkSessInit=mapel;
  openAcadDrawer(rec?'Edit Presensi KBM':'Input Presensi KBM',AK_ERRBOX+`
    <div class="dw-field"><label>Tanggal *</label><input type="date" id="pksTanggal" value="${dkEsc(tgl)}" onchange="pkSessClassChanged()"></div>
    <div class="dw-field"><label>Kelas *</label><select id="pksKelas" onchange="pkSessClassChanged()"><option value="">— Pilih kelas —</option>${classes.map(c=>`<option value="${dkEsc(c.id)}"${String(cid)===String(c.id)?' selected':''}>${c.nama}</option>`).join('')}</select></div>
    <div class="dw-field"><label>Mata Pelajaran *</label><select id="pksMapel" onchange="pkSessRender()"></select><p class="dw-hint" id="pksMapelHint"></p></div>
    <div class="dw-field"><label>Guru *</label><input type="text" id="pksGuru" maxlength="80" value="${dkEsc(guru)}"${curRole==='Guru'?' readonly':''}></div>
    <div class="dw-field"><label>Jam</label><input type="text" id="pksJam" maxlength="30" placeholder="mis. 07:00–08:30" value="${dkEsc(jam)}"></div>
    <div id="pksList"></div>
    <div class="dw-formfoot"><button class="btn-outline-sm" onclick="closeAcadDrawer()">Batal</button><button class="btn-primary-sm" id="pksSubmit" onclick="pkSessSave()">Simpan Presensi</button></div>`);
  pkSessClassChanged();
}
function pkSessClassChanged(){
  const cid=document.getElementById('pksKelas').value;
  const sel=document.getElementById('pksMapel');
  if(sel){
    const tgl=document.getElementById('pksTanggal').value, hari=pkHariOf(tgl), list=pkMapelOfDay(cid,tgl);
    const keep=String(sel.value||pkSessInit||'').toLowerCase(); pkSessInit='';
    sel.innerHTML=`<option value="">${list.length?'— Pilih mata pelajaran —':'— Tidak ada jadwal —'}</option>`+list.map(m=>`<option value="${dkEsc(m)}"${m.toLowerCase()===keep?' selected':''}>${dkEsc(m)}</option>`).join('');
    const h=document.getElementById('pksMapelHint');
    if(h) h.textContent=!cid?'Pilih kelas dan tanggal untuk melihat mapel yang dijadwalkan.':(list.length?'Hanya mapel yang dijadwalkan pada hari '+hari+'.':'Tidak ada jadwal pelajaran'+(curRole==='Guru'?' Anda':'')+' untuk kelas ini pada hari '+(hari||'tersebut')+'.');
  }
  pkSessRender();
}
function pkSessRender(){
  const el=document.getElementById('pksList'); if(!el) return;
  const cid=document.getElementById('pksKelas').value, tgl=document.getElementById('pksTanggal').value, mapel=document.getElementById('pksMapel').value.trim();
  if(!cid){ el.innerHTML='<p class="dw-para">Pilih kelas untuk menampilkan daftar siswa.</p>'; return; }
  const studs=akStudentsOfClass(cid);
  if(!studs.length){ el.innerHTML='<p class="dw-para">Belum ada siswa aktif di kelas ini. Isi dulu di Database Siswa.</p>'; return; }
  const ex=pkSessExisting(tgl,cid,mapel); const nEx=Object.keys(ex).length;
  el.innerHTML=(nEx?`<p class="viewonly-banner">Presensi untuk kelas, mapel, dan tanggal ini sudah ada (${nEx} siswa) — menyimpan akan memperbarui data tersebut.</p>`:'')
    +`<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><b style="font-size:12px">Daftar Siswa (${studs.length})</b><button class="btn-outline-sm" onclick="pkSessAll('Hadir')">Semua Hadir</button></div>
    <table><tr><th>Siswa</th><th>Status</th><th>Keterangan</th></tr>${studs.map(s=>{ const e=ex[String(s.id)]; return `<tr><td>${s.nama}</td>
      <td><select id="pks_st_${dkEsc(s.id)}">${akOptHtml(['Hadir','Izin','Sakit','Alpa'],e?e.status:'Hadir')}</select></td>
      <td><input type="text" id="pks_kt_${dkEsc(s.id)}" maxlength="120" value="${e&&e.ket!=='-'?dkEsc(akUnesc(e.ket)):''}" style="width:100%"></td></tr>`; }).join('')}</table>`;
}
function pkSessAll(st){ document.querySelectorAll('#pksList select[id^="pks_st_"]').forEach(s=>s.value=st); }
async function pkSessSave(){
  const M=KSC.pk; if(M.submitting) return;
  if(!kscCan('pk','write')){ akFormErr('akfError','Anda tidak memiliki izin untuk menyimpan presensi.'); return; }
  const sb=dkClient(); if(!sb){ akFormErr('akfError','Supabase belum terhubung.'); return; }
  const g=id=>document.getElementById(id).value.trim();
  const tanggal=g('pksTanggal'), classId=g('pksKelas'), mapel=g('pksMapel').replace(/\s+/g,' '), guru=g('pksGuru'), jam=g('pksJam');
  if(!tanggal){ akFormErr('akfError','Tanggal wajib diisi.'); return; }
  if(!classId){ akFormErr('akfError','Kelas wajib dipilih.'); return; }
  if(!mapel){ akFormErr('akfError','Mata pelajaran wajib diisi.'); return; }
  if(!pkMapelOfDay(classId,tanggal).some(m=>m.toLowerCase()===mapel.toLowerCase())){ akFormErr('akfError','Mata pelajaran "'+mapel+'" tidak dijadwalkan pada hari '+(pkHariOf(tanggal)||'tersebut')+' untuk kelas ini.'); return; }
  if(!guru){ akFormErr('akfError','Nama guru wajib diisi.'); return; }
  const studs=akStudentsOfClass(classId); if(!studs.length){ akFormErr('akfError','Tidak ada siswa aktif di kelas ini.'); return; }
  const ex=pkSessExisting(tanggal,classId,mapel); const ins=[], upd=[];
  studs.forEach(s=>{
    const row={student_id:s.id,class_id:classId,tanggal,mapel,guru,jam:jam||null,status:document.getElementById('pks_st_'+s.id).value,keterangan:(document.getElementById('pks_kt_'+s.id).value.trim())||null};
    const e=ex[String(s.id)]; if(e){ row.id=e.id; upd.push(row); } else ins.push(row);
  });
  akFormErr('akfError','');
  M.submitting=true; const btn=document.getElementById('pksSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    if(ins.length){ const r=await sb.from('attendance_kbm').insert(ins).select(); if(r.error) throw r.error; if((r.data||[]).length!==ins.length) throw AK_RLS_ERR; }
    if(upd.length){ const r=await sb.from('attendance_kbm').upsert(upd).select(); if(r.error) throw r.error; if((r.data||[]).length!==upd.length) throw AK_RLS_ERR; }
    closeAcadDrawer(); showAcadToast('Presensi '+studs.length+' siswa berhasil disimpan.');
    await kscLoad('pk',{silent:true});
  }catch(e){
    console.error('pkSessSave',e); akFormErr('akfError','Gagal menyimpan: '+kscErrMsg(e,'tambah',M.cfg)); showAcadToast('Gagal menyimpan presensi.');
  }finally{ M.submitting=false; const b=document.getElementById('pksSubmit'); if(b){ b.disabled=false; b.textContent='Simpan Presensi'; } }
}

async function nlSessSave(){
  const M=KSC.nl; if(M.submitting) return;
  if(!kscCan('nl','write')){ akFormErr('akfError','Anda tidak memiliki izin untuk menyimpan nilai.'); return; }
  const sb=dkClient(); if(!sb){ akFormErr('akfError','Supabase belum terhubung.'); return; }
  const g=id=>document.getElementById(id).value.trim();
  const ta=g('nlsTA'), sem=g('nlsSem'), classId=g('nlsKelas'), mapel=g('nlsMapel').replace(/\s+/g,' ');
  if(!/^\d{4}\/\d{4}$/.test(ta)){ akFormErr('akfError','Tahun ajaran harus berformat 2026/2027.'); return; }
  const m=/^(\d{4})\/(\d{4})$/.exec(ta); if(Number(m[2])!==Number(m[1])+1){ akFormErr('akfError','Tahun ajaran tidak valid (contoh: 2026/2027).'); return; }
  if(!classId){ akFormErr('akfError','Kelas wajib dipilih.'); return; }
  if(!mapel){ akFormErr('akfError','Mata pelajaran wajib diisi.'); return; }
  const studs=akStudentsOfClass(classId); const ex=nlSessExisting(ta,sem,classId,mapel); const ins=[], upd=[];
  for(const s of studs){
    const row={student_id:s.id,class_id:classId,mapel,tahun_ajaran:ta,semester:sem}; let any=false;
    for(const k of NL_COMPS){
      const raw=document.getElementById('nls_'+k+'_'+s.id).value.trim();
      if(raw===''){ row[k]=null; continue; }
      const n=Number(raw); if(!Number.isFinite(n)||n<0||n>100){ akFormErr('akfError','Nilai '+NL_LABEL[k]+' untuk '+akUnesc(s.nama)+' harus 0–100.'); return; }
      row[k]=n; any=true;
    }
    const e=ex[String(s.id)];
    if(e){ row.id=e.id; upd.push(row); } else if(any) ins.push(row);
  }
  if(!ins.length&&!upd.length){ akFormErr('akfError','Belum ada nilai yang diisi.'); return; }
  akFormErr('akfError','');
  M.submitting=true; const btn=document.getElementById('nlsSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    if(ins.length){ const r=await sb.from('grades').insert(ins).select(); if(r.error) throw r.error; if((r.data||[]).length!==ins.length) throw AK_RLS_ERR; }
    if(upd.length){ const r=await sb.from('grades').upsert(upd).select(); if(r.error) throw r.error; if((r.data||[]).length!==upd.length) throw AK_RLS_ERR; }
    closeAcadDrawer(); showAcadToast('Nilai '+(ins.length+upd.length)+' siswa berhasil disimpan.');
    await kscLoad('nl',{silent:true});
  }catch(e){
    console.error('nlSessSave',e); akFormErr('akfError','Gagal menyimpan: '+kscErrMsg(e,'tambah',M.cfg)); showAcadToast('Gagal menyimpan nilai.');
  }finally{ M.submitting=false; const b=document.getElementById('nlsSubmit'); if(b){ b.disabled=false; b.textContent='Simpan Nilai'; } }
}

  reportCardsData.length=0;
  studentsData.filter(s=>s.classId!=null&&s.status==='Aktif').forEach(s=>{
    const gr=gradesData.filter(g=>String(g.studentId)===String(s.id)&&g.tahunAjaran===taE&&g.semester===sem&&g.nilaiAkhir!=null);
    const nilai=gr.length?Math.round(gr.reduce((a,g)=>a+g.nilaiAkhir,0)/gr.length*10)/10:0;
    const att=attendanceRecordsData.filter(a=>String(a.studentId)===String(s.id)&&(!range||(a.tanggal>=range[0]&&a.tanggal<=range[1])));
    const kehadiran=att.length?Math.round(att.filter(a=>a.status==='Hadir').length/att.length*100):0;
    const rec=rpRecords.find(r=>String(r.studentId)===String(s.id)&&r.tahunAjaran===taE&&r.semester===sem);
    reportCardsData.push({id:s.id,studentId:s.id,recId:rec?rec.id:null,nama:s.nama,nis:s.nis,kelas:s.kelas,classId:s.classId,nilai,jmlMapel:gr.length,kehadiran,
      status:rec?rec.status:'Belum Lengkap',catatan:rec?rec.catatan:'-',tanggalCetak:rec?rec.tanggalCetak:''});
  });
  reportCardsData.sort((a,b)=>akUnesc(a.kelas).localeCompare(akUnesc(b.kelas))||akUnesc(a.nama).localeCompare(akUnesc(b.nama)));
}

async function rpWrite(r,status,catatan,setPrinted){
  const sb=dkClient(); if(!sb) throw {message:'Supabase belum terhubung.'};
  const payload={student_id:r.studentId,class_id:r.classId,tahun_ajaran:rpSel.ta,semester:rpSel.sem,status};
  if(catatan!==undefined) payload.catatan_wali=catatan;
  if(setPrinted) payload.tanggal_cetak=ksToday();
  let res;
  if(r.recId){ res=await sb.from('report_cards').update(payload).eq('id',r.recId).select(); }
  else { res=await sb.from('report_cards').insert(payload).select(); }
  if(res.error) throw res.error;
  if(!res.data||!res.data.length) throw {code:'42501',message:'Tidak ada baris yang berubah: diblokir RLS.'};
}
async function rpSave(studentId){
  const M=KSC.rp; if(M.submitting) return;
  const r=reportCardsData.find(x=>String(x.studentId)===String(studentId)); if(!r) return;
  if(!kscCan('rp','write')){ akFormErr('akfError','Anda tidak memiliki izin untuk menyimpan.'); return; }
  M.submitting=true; const btn=document.getElementById('rpfSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    const st=document.getElementById('rpfStatus').value; const ct=document.getElementById('rpfCatatan').value.trim();
    await rpWrite(r,st,ct===''?null:ct,st==='Sudah Dicetak'&&!r.tanggalCetak);
    closeAcadDrawer(); showAcadToast('Status rapor berhasil disimpan.');
    await kscLoad('rp',{silent:true}); rpRefresh();
  }catch(e){ console.error('rpSave',e); akFormErr('akfError','Gagal menyimpan: '+kscErrMsg(e,'ubah',M.cfg)); showAcadToast('Gagal menyimpan rapor.'); }
  finally{ M.submitting=false; const b=document.getElementById('rpfSubmit'); if(b){ b.disabled=false; b.textContent='Simpan'; } }
}

const CURRENT_MUSYRIF_ASRAMA='Asrama A';
function ksScopeStudentIds(){
  /* Data dari Supabase sudah disaring RLS sesuai role/akun; filter lokal di bawah hanya untuk data dummy lama. */
  if(typeof stState!=='undefined'&&stState.fromDb) return null;
  if(curRole==='Wali Kelas') return studentsData.filter(s=>s.kelas===CURRENT_WALI_KELAS).map(s=>s.id);
  if(curRole==='Guru'){ const kelasList=acadScopeKelasList()||[]; return studentsData.filter(s=>kelasList.includes(s.kelas)).map(s=>s.id); }
  if(curRole==='Musyrif') return studentsData.filter(s=>s.asrama===CURRENT_MUSYRIF_ASRAMA).map(s=>s.id);
  if(curRole==='Orang Tua'||curRole==='Siswa'){ const p=personalData[curRole]||personalData['Siswa']; const m=studentsData.find(s=>s.nama===p.anak); return m?[m.id]:[]; }
  return null; // null = akses semua siswa (Kepsek/Super Admin)
}
function ksFilterStudents(rows){ const ids=ksScopeStudentIds(); return ids? rows.filter(s=>ids.includes(s.id)) : rows; }
function ksFilterByStudentId(rows){ const ids=ksScopeStudentIds(); return ids? rows.filter(r=>ids.includes(r.studentId)) : rows; }
function ksScopeNoticeHtml(){
  const dbScoped=typeof stState!=='undefined'&&stState.fromDb;   // data Supabase: pembatasan dilakukan RLS di database
  const ids=dbScoped ? (['Wali Kelas','Guru','Musyrif','Orang Tua','Siswa'].includes(curRole)?studentsData.map(s=>s.id):null) : ksScopeStudentIds();
  if(!ids) return '';
  let label='data sesuai akses Anda';
  if(curRole==='Wali Kelas') label=dbScoped?'siswa kelas yang Anda ampu':'siswa kelas '+CURRENT_WALI_KELAS;
  else if(curRole==='Guru') label='siswa dari kelas yang Anda ajar';
  else if(curRole==='Musyrif') label=dbScoped?'santri yang Anda bimbing':'santri '+CURRENT_MUSYRIF_ASRAMA;
  else if(curRole==='Orang Tua') label='data anak Anda';
  else if(curRole==='Siswa') label='data Anda sendiri';
  return `<p class="desc" style="color:var(--acc-blue);">Menampilkan ${label} (${ids.length} siswa).</p>`;
}

  let rows=ksFilterStudents(studentsData);
  const f=dsFilter;
  return rows.filter(s=>
    (!f.q || s.nama.toLowerCase().includes(f.q.toLowerCase()) || s.nis.includes(f.q) || s.nisn.includes(f.q)) &&
    (!f.kelas||s.kelas===f.kelas) && (!f.jurusan||s.jurusan===f.jurusan) && (!f.jk||s.jk===f.jk) &&
    (!f.status||s.status===f.status) && (!f.boarding||(f.boarding==='Boarding'?s.boarding:!s.boarding))
  );
}

  }
  if(ksProfileTab==='konseling'){
    if(curRole==='Guru') return ksRestrictedHtml();
    const rows=counselingData.filter(k=>k.studentId===s.id);
    if(!rows.length) return acadEmptyStateHtml('Belum ada sesi konseling','Tidak ada catatan konseling untuk siswa ini.');
    return rows.map(k=>`<div class="dw-row"><span>${fmtTglID(k.tanggal)} — ${k.jenisLayanan}</span><span>${k.status}</span></div>`).join('');
  }
  if(ksProfileTab==='prestasi'){
    const rows=achievementsData.filter(a=>a.studentId===s.id);
    if(!rows.length) return acadEmptyStateHtml('Belum ada prestasi tercatat','Prestasi siswa ini akan tampil di sini.');
    return rows.map(a=>`<div class="dw-row"><span>${a.nama} (${a.tahun})</span><span>${a.peringkat}</span></div>`).join('');

    return rows.map(p=>`<div class="dw-row"><span>${fmtTglID(p.mulai)} — ${p.jenis}</span><span>${p.status}</span></div>`).join('');
  }
  if(ksProfileTab==='keuangan'){
    return ksProfileKeuanganTabContent(s);
  }
  return '';
}

/* ------------------------------------------------------------------------
   LAPISAN SUPABASE KESISWAAN: permits, violations, counseling, achievements
   Pola sama dengan Data Kelas / Database Siswa. Skema + RLS: supabase-kesiswaan-setup.sql
   - Baris hanya terlihat jika siswanya terlihat oleh user (mengikuti RLS tabel students).
   - Insert/update/delete dicek eksplisit: 0 baris berubah = ditolak RLS (bukan sukses palsu).
   - Teks dari database di-escape; nilai asli ada di KSC[key].raw (dipakai form edit).
   ------------------------------------------------------------------------ */
function ksToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const KSC_ADMIN=['Super Admin','Kepala Sekolah'];
const KSC={};
function kscD(x){ return x?String(x).slice(0,10):''; }
function kscCan(key,action){ const c=KSC[key].cfg; return (action==='delete'?c.deleteRoles:c.writeRoles).includes(curRole); }
function kscBlocked(key){ const c=KSC[key].cfg; return !!((c.readBlockedRoles&&c.readBlockedRoles.includes(curRole))||(c.readRoles&&!c.readRoles.includes(curRole))); }
function kscShowMsg(key,text,type){
  const el=document.getElementById(KSC[key].cfg.msgId||(KSC[key].cfg.prefix+'Msg')); if(!el) return;
  if(!text){ el.innerHTML=''; return; }
  const c={error:['#FBE7E5','#C0392B'],info:['#E7F0F7','#1D6FA3'],warn:['#FCF1DE','#A5730C'],ok:['#E4F5EE','#1C7B5D']}[type||'info'];
  el.innerHTML='<div style="background:'+c[0]+';color:'+c[1]+';border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px;line-height:1.5">'+dkEsc(text)+'</div>';
}
function kscErrMsg(e,aksi,c){
  const code=(e&&e.code)||'', raw=(e&&e.message)||String(e||'Error tidak diketahui');
  if(code==='42P01'||/relation .* does not exist|Could not find the table/i.test(raw)) return 'Tabel '+(c?c.table:'')+' belum ada di Supabase. Jalankan supabase-kesiswaan-setup.sql.';
  if(code==='42501'||/row-level security|permission denied/i.test(raw)) return 'Ditolak oleh RLS: role Anda tidak berhak, siswanya tidak terlihat oleh akun ini, atau policy belum dibuat (jalankan supabase-kesiswaan-setup.sql). Detail: '+raw;
  if(code==='23505') return 'Data ganda: data yang sama sudah ada (mungkin diinput pengguna lain). Muat ulang lalu coba lagi.';
  if(code==='23503') return aksi==='hapus' ? 'Data tidak bisa dihapus karena masih dipakai data lain.' : 'Siswa atau data rujukan yang dipilih tidak valid di database.';
  if(code==='23502') return 'Ada kolom wajib di database yang belum terisi: '+raw;
  if(code==='23514') return 'Nilai ditolak oleh aturan (CHECK constraint) di database: '+raw;
  if(code==='22007'||code==='22008') return 'Format tanggal tidak valid.';
  return raw;
}
function kscFillSelect(id,items){

async function kscEnsureStudents(){
  if(typeof stState!=='undefined' && !stState.fromDb && typeof stReload==='function'){ try{ await stReload({silent:true}); }catch(e){} }
}
async function kscLoad(key,opts){
  opts=opts||{}; const silent=!!opts.silent; const M=KSC[key], c=M.cfg;
  const bodyId=c.bodyId||(c.prefix+'Body'), msgId=c.msgId||(c.prefix+'Msg');
  if(kscBlocked(key)){ c.arr.length=0; if(document.getElementById(bodyId)) c.refresh(); return false; }
  if(typeof dbFetchAll!=='function'||!dkClient()){ if(!silent) kscShowMsg(key,'Mode demo: Supabase belum terhubung, data tidak disimpan.','warn'); return false; }
  if(M.loading) return false;
  M.loading=true;
  try{
    await kscEnsureStudents();
    if(typeof akEnsureStudentsWait==='function') await akEnsureStudentsWait();
    if(c.needClasses&&typeof akEnsureClasses==='function') await akEnsureClasses();
    const rows=await dbFetchAll(c.table,'*','id',c.filter?c.filter():null);
    M.raw={};
    const mapped=rows.map(r=>{ M.raw[r.id]=r; return c.fromRow(r); });
    if(c.sortFn) mapped.sort(c.sortFn); else mapped.sort((x,y)=>String(y[c.sortKey]||'').localeCompare(String(x[c.sortKey]||'')));
    c.arr.length=0; mapped.forEach(m=>c.arr.push(m));
    if(document.getElementById(bodyId)){
      if(!silent) kscShowMsg(key, rows.length?'':(key==='rp'?'Belum ada status rapor yang disimpan. Semua siswa tampil "Belum Lengkap" sampai statusnya diubah lewat ikon pensil di baris siswa.':'Tabel '+c.table+' terhubung, tetapi belum ada data. Klik tombol tambah untuk mulai mencatat.'), rows.length?'ok':'info');
      c.refresh();
    }
    return true;
  }catch(e){
    console.error('kscLoad '+key,e);
    if(document.getElementById(msgId)) kscShowMsg(key,'Gagal memuat data '+c.title.toLowerCase()+': '+kscErrMsg(e,'muat',c),'error');
    return false;
  }finally{ M.loading=false; }
}

function kscFormError(text){
  const el=document.getElementById('kscfError'); if(!el) return;
  el.textContent=text; el.style.display=text?'':'none';
  if(text){ const b=document.getElementById('acadDrawerBody'); if(b) b.scrollTop=0; }
}
function kscFieldHtml(key,f,raw,prefill){
  const id='kscf_'+key+'_'+f.k;
  let cur=raw?(raw[f.k]!=null?raw[f.k]:''):((prefill&&prefill[f.k]!=null)?prefill[f.k]:(typeof f.def==='function'?f.def():(f.def!=null?f.def:'')));
  let input;
  if(f.type==='student'){
    const studs=f.boardingOnly?bdBoardingStudents():ksFilterStudents(studentsData);
    input='<select id="'+id+'"'+(raw?' disabled':'')+'><option value="">— Pilih siswa —</option>'+studs.map(s=>'<option value="'+dkEsc(s.id)+'"'+(String(cur)===String(s.id)?' selected':'')+'>'+s.nama+(s.kelas&&s.kelas!=='-'?' — '+s.kelas:'')+'</option>').join('')+'</select>';
  }else if(f.type==='class'){
    const cl=(typeof akScopedClasses==='function')?akScopedClasses():classesData;
    input='<select id="'+id+'"><option value="">— Pilih kelas —</option>'+cl.map(c2=>'<option value="'+dkEsc(c2.id)+'"'+(String(cur)===String(c2.id)?' selected':'')+'>'+c2.nama+'</option>').join('')+'</select>';
  }else if(f.type==='time'){
    input='<input type="time" id="'+id+'" value="'+dkEsc(String(cur||'').slice(0,5))+'">';
  }else if(f.type==='select'){
    const opts=f.opts.slice(); if(cur!==''&&!opts.includes(String(cur))) opts.push(String(cur));
    input='<select id="'+id+'">'+opts.map(o=>'<option'+(String(cur)===o?' selected':'')+'>'+dkEsc(o)+'</option>').join('')+'</select>';
  }else if(f.type==='textarea'){
    input='<textarea id="'+id+'" rows="3" maxlength="'+(f.max||1500)+'" placeholder="'+dkEsc(f.ph||'')+'">'+dkEsc(cur)+'</textarea>';
  }else if(f.type==='date'){
    input='<input type="date" id="'+id+'" value="'+dkEsc(kscD(cur))+'">';
  }else if(f.type==='number'){
    input='<input type="number" id="'+id+'" min="'+(f.minv!=null?f.minv:0)+'" max="'+(f.maxv||1000)+'" step="'+(f.dec?'0.5':'1')+'" value="'+dkEsc(cur)+'">';
  }else{
    const lst=f.list?f.list():null; const ro=(typeof f.readonly==='function'?f.readonly():f.readonly);
    input='<input type="text" id="'+id+'" maxlength="'+(f.max||150)+'" placeholder="'+dkEsc(f.ph||'')+'" value="'+dkEsc(cur)+'"'+(lst?' list="'+id+'_dl"':'')+(ro?' readonly':'')+'>'+(lst?'<datalist id="'+id+'_dl">'+lst.map(v=>'<option value="'+dkEsc(v)+'"></option>').join('')+'</datalist>':'');
  }
  return '<div class="dw-field"><label>'+f.label+(f.req?' *':'')+'</label>'+input+'</div>';
}
function kscOpenForm(key,id,prefill){
  const M=KSC[key], c=M.cfg;
  if(!kscCan(key,'write')){ showAcadToast('Anda tidak memiliki izin untuk mengelola data '+c.title.toLowerCase()+'.'); return; }
  const raw=id?M.raw[id]:null;
  if(id&&!raw){ showAcadToast('Data tidak ditemukan. Muat ulang halaman.'); return; }
  if(!id&&c.fields.some(f=>f.type==='student'&&f.boardingOnly)&&!bdBoardingStudents().length){ showAcadToast('Belum ada santri boarding. Tandai siswa sebagai Boarding di Database Siswa.'); return; }
  if(!id&&c.fields.some(f=>f.type==='student'&&!f.boardingOnly)&&!ksFilterStudents(studentsData).length){ showAcadToast('Belum ada data siswa. Isi dulu di menu Database Siswa.'); return; }
  openAcadDrawer((id?'Edit ':'Tambah ')+c.title,
    '<div id="kscfError" style="display:none;background:#FBE7E5;color:#C0392B;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px;line-height:1.5"></div>'
    +c.fields.map(f=>kscFieldHtml(key,f,raw,prefill)).join('')
    +'<div class="dw-formfoot"><button class="btn-outline-sm" onclick="closeAcadDrawer()">Batal</button><button class="btn-primary-sm" id="kscfSubmit" onclick="kscSubmit(\''+key+'\','+(id?'\''+dkEsc(id)+'\'':'null')+')">'+(id?'Simpan Perubahan':'Simpan')+'</button></div>');
}
async function kscSubmit(key,id){
  const M=KSC[key], c=M.cfg;
  if(M.submitting) return;
  if(!kscCan(key,'write')){ kscFormError('Anda tidak memiliki izin untuk menyimpan data ini.'); return; }
  const sb=dkClient(); if(!sb){ kscFormError('Supabase belum terhubung.'); return; }
  const payload={}, optional=new Set();
  for(const f of c.fields){
    if(f.k==='student_id'&&id) continue;
    const el=document.getElementById('kscf_'+key+'_'+f.k); let v=el?String(el.value).trim():'';
    if(f.req&&v===''){ kscFormError(f.label+' wajib diisi.'); return; }
    if(f.type==='number'){ if(v===''){ payload[f.k]=null; } else { const n=Number(v); const lo=f.minv!=null?f.minv:0, hi=f.maxv!=null?f.maxv:1e9;
      if(!Number.isFinite(n)||(!f.dec&&Math.floor(n)!==n)){ kscFormError(f.label+(f.dec?' harus berupa angka.':' harus berupa bilangan bulat.')); return; }
      if(n<lo||n>hi){ kscFormError(f.label+' harus antara '+lo+' dan '+hi+'.'); return; } payload[f.k]=n; } }
    else payload[f.k]= v===''?null:v;
    if(!f.req) optional.add(f.k);
  }
  const verr=c.validate&&c.validate(payload,id); if(verr){ kscFormError(verr); return; }
  M.missing.forEach(col=>delete payload[col]);
  kscFormError('');
  M.submitting=true; const btn=document.getElementById('kscfSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    let res, skipped=[];
    for(let attempt=0; attempt<8; attempt++){
      res=id? await sb.from(c.table).update(payload).eq('id',id).select()
            : await sb.from(c.table).insert(payload).select();
      const e=res.error;
      if(dkIsMissingColErr(e)){
        const m=/'([^']+)' column/i.exec(e.message||'')||/column "?(?:[a-z_]+\.)?([A-Za-z0-9_]+)"? /i.exec(e.message||'');
        const col=m&&m[1];
        if(col&&optional.has(col)&&(col in payload)){ delete payload[col]; skipped.push(col); M.missing.add(col); continue; }
      }
      break;
    }
    if(res.error) throw res.error;
    if(!res.data||!res.data.length){
      throw {code:'42501',message:id?'Tidak ada baris yang berubah: data tidak ditemukan atau update diblokir RLS.':'Insert tidak mengembalikan data: kebijakan RLS (INSERT/SELECT) kemungkinan memblokir.'};
    }
    closeAcadDrawer();
    showAcadToast((id?'Data berhasil diperbarui.':'Data baru berhasil disimpan.')+(skipped.length?' Kolom tidak ada di database dan dilewati: '+skipped.join(', ')+'.':''));
    await kscLoad(key,{silent:true});
  }catch(e){
    console.error('kscSubmit '+key,e);
    kscFormError('Gagal menyimpan: '+kscErrMsg(e,id?'ubah':'tambah',c)); showAcadToast('Gagal menyimpan data.');
  }finally{
    M.submitting=false; const b2=document.getElementById('kscfSubmit'); if(b2){ b2.disabled=false; b2.textContent=id?'Simpan Perubahan':'Simpan'; }
  }
}
function kscConfirmDelete(key,id){
  const M=KSC[key], c=M.cfg;
  if(!kscCan(key,'delete')){ showAcadToast('Hanya Super Admin atau Kepala Sekolah yang dapat menghapus data ini.'); return; }
  if(!M.raw[id]){ showAcadToast('Data tidak ditemukan. Muat ulang halaman.'); return; }
  openAcadConfirm('Hapus '+c.title,'Yakin ingin menghapus data '+c.title.toLowerCase()+' ini? Tindakan ini tidak bisa dibatalkan.', ()=>kscDelete(key,id));
}
async function kscDelete(key,id){
  const c=KSC[key].cfg; const sb=dkClient(); if(!sb){ showAcadToast('Supabase belum terhubung.'); return; }
  try{
    const {data,error}=await sb.from(c.table).delete().eq('id',id).select();
    if(error) throw error;
    if(!data||!data.length) throw {code:'42501',message:'Tidak ada baris yang terhapus: data sudah tidak ada atau penghapusan diblokir RLS.'};
    showAcadToast('Data berhasil dihapus.');
    await kscLoad(key,{silent:true});
  }catch(e){
    console.error('kscDelete '+key,e);
    kscShowMsg(key,'Gagal menghapus: '+kscErrMsg(e,'hapus',c),'error'); showAcadToast('Gagal menghapus data.');
  }
}
function kscRowActions(key,id,detailFn){
  return '<div class="row-actions"><button title="Detail" onclick="'+detailFn+'(\''+dkEsc(id)+'\')">👁</button>'
    +(kscCan(key,'write')?'<button title="Edit" onclick="kscOpenForm(\''+key+'\',\''+dkEsc(id)+'\')">✏️</button>':'')
    +(kscCan(key,'delete')?'<button title="Hapus" onclick="kscConfirmDelete(\''+key+'\',\''+dkEsc(id)+'\')">🗑</button>':'')+'</div>';
}
function kscToolbarButtons(key,addLabel){
  return (kscCan(key,'write')?'<button class="btn-primary-sm" onclick="kscOpenForm(\''+key+'\',null)">'+addLabel+'</button>':'')
