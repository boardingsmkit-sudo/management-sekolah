<script id="students-crud">
/* ========================================================================
   CRUD SISWA <-> SUPABASE (tabel "students")
   - Kolom DB dipetakan di ST_COLS. Jika nama kolom di database Anda berbeda,
     ubah HANYA nilai di sebelah kanan (nama kolom DB). Tombol "Cek Skema"
     di halaman Database Siswa memeriksa kolom mana yang tidak ditemukan.
   - Kelas dibaca dari tabel "classes" (id, nama, jurusan) dan disimpan di
     students.class_id. Jurusan mengikuti kelas (classes.jurusan), bukan
     disimpan di siswa, supaya tidak ada data ganda.
   - Skema database: supabase-core-schema.sql.
   - Izin tulis di UI hanya untuk role di ST_WRITE_ROLES. Ini hanya
     pembatas tampilan: yang benar-benar mengamankan adalah RLS di database
     (lihat supabase-students-setup.sql).
   ======================================================================== */
const ST_TABLE=DB.students, ST_CLASS_TABLE=DB.classes;   /* students.id adalah student_id yang dipakai modul lain */
const ST_COLS={
  nama:'nama', nis:'nis', nisn:'nisn', nik:'nik', jk:'jk',
  tempatLahir:'tempat_lahir', tanggalLahir:'tanggal_lahir', alamat:'alamat', noTelp:'no_telp',
  status:'status', classId:'class_id', tahunMasuk:'tahun_masuk', statusAkademik:'status_akademik',
  boarding:'boarding', asrama:'asrama', kamar:'kamar', musyrif:'musyrif',
  ayah:'ayah', ibu:'ibu', kontakOrtu:'kontak_ortu', alamatOrtu:'alamat_ortu'
};
const ST_WRITE_ROLES=['Super Admin'];
function stCanManage(){ return ST_WRITE_ROLES.includes(curRole); }

const stState={classes:[],raw:{},fromDb:false,loading:false,missing:null};
const ST_REQUIRED_KEYS=['nama','nis'];
const ST_FIELD_IDS={nama:'stfNama',nis:'stfNis',nisn:'stfNisn',nik:'stfNik',jk:'stfJk',tempatLahir:'stfTempatLahir',tanggalLahir:'stfTanggalLahir',alamat:'stfAlamat',noTelp:'stfNoTelp',status:'stfStatus',classId:'stfClass',tahunMasuk:'stfTahunMasuk',statusAkademik:'stfStatusAkademik',boarding:'stfBoarding',asrama:'stfAsrama',kamar:'stfKamar',musyrif:'stfMusyrif',ayah:'stfAyah',ibu:'stfIbu',kontakOrtu:'stfKontakOrtu',alamatOrtu:'stfAlamatOrtu'};
function stIsMissingColErr(e){ return !!e&&(e.code==='42703'||e.code==='PGRST204'||/column .* does not exist|Could not find the .* column/i.test(e.message||'')); }
/* Deteksi kolom ST_COLS yang tidak ada di tabel students (di-cache; direset saat Muat Ulang). */
async function stDetectColumns(force){
  if(stState.missing&&!force) return stState.missing;
  const sb=stClient(); const miss=new Set(); if(!sb) return miss;
  const res=await Promise.all(Object.entries(ST_COLS).map(async([k,col])=>{ const {error}=await sb.from(ST_TABLE).select(col).limit(1); return [k,error]; }));
  res.forEach(([k,e])=>{ if(stIsMissingColErr(e)) miss.add(k); });
  stState.missing=miss; return miss;
}
async function stRealColumns(){
  if(stState.realCols!==undefined) return stState.realCols;
  let cols=null;
  try{
    const sb=stClient(); const {data}=await sb.auth.getSession();
    const r=await fetch(SUPABASE_URL+'/rest/v1/',{headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+((data&&data.session&&data.session.access_token)||SUPABASE_ANON_KEY)}});
    if(r.ok){ const j=await r.json(); const pr=j.definitions&&j.definitions[ST_TABLE]&&j.definitions[ST_TABLE].properties; if(pr) cols=Object.keys(pr); }
  }catch(e){}
  if(!cols){ const first=Object.values(stState.raw)[0]; if(first) cols=Object.keys(first); }
  stState.realCols=cols; return cols;
}
const ST_SQL_HINT="select column_name, data_type from information_schema.columns where table_schema='public' and table_name='students' order by ordinal_position;";
async function stApplyMissingToForm(){
  const miss=stState.missing; if(!miss||!miss.size||!document.getElementById('stfSubmit')) return;
  miss.forEach(k=>{
    const el=document.getElementById(ST_FIELD_IDS[k]); if(!el) return;
    el.disabled=true; el.style.opacity='.5'; el.title='Kolom tidak ada di database';
    const lb=el.closest('.dw-field')&&el.closest('.dw-field').querySelector('label'); if(lb) lb.textContent+=' (kolom tidak ada)';
  });
  const n=document.getElementById('stfNotice'); if(!n) return;
  const real=await stRealColumns();
  const req=[...miss].filter(k=>ST_REQUIRED_KEYS.includes(k)).map(k=>ST_COLS[k]);
  n.innerHTML=(req.length?'<b>Kolom wajib tidak ada: '+stEsc(req.join(', '))+'.</b> Data tidak bisa disimpan sebelum kolom ini ada atau ST_COLS disesuaikan.<br>':'')+
    'Kolom berikut tidak ada di tabel students sehingga isiannya <b>tidak akan disimpan</b>: '+stEsc([...miss].map(k=>ST_COLS[k]).join(', '))+'. Tambahkan lewat SQL (Bagian 4 di supabase-students-setup.sql) bila diperlukan, atau sesuaikan ST_COLS jika kolomnya ada dengan nama lain.<br><b>Kolom yang benar-benar ada di tabel students:</b> '+(real?stEsc(real.join(', ')):'(tidak bisa dibaca otomatis — jalankan di SQL Editor: <code>'+stEsc(ST_SQL_HINT)+'</code>)');
  n.style.display='';
}
function stClient(){ return (typeof supabaseClient!=='undefined'&&supabaseClient)?supabaseClient:null; }
function stEsc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function stDash(v){ return (v==null||v==='')?'-':stEsc(v); }

/* ---- Pesan error yang jelas ---- */
function stErrMsg(err,aksi){
  const code=(err&&err.code)||'', raw=(err&&err.message)||String(err||'Error tidak diketahui');
  let t;
  if(code==='23505') t='Data ganda: NIS/NISN/NIK ini sudah dipakai siswa lain. Database menolak duplikat.';
  else if(code==='23503') t=aksi==='hapus'
    ? 'Siswa tidak bisa dihapus karena masih dipakai data lain (mis. tagihan, perizinan, presensi). Ubah statusnya menjadi Non-Aktif sebagai gantinya.'
    : 'Kelas atau jurusan yang dipilih tidak valid di database.';
  else if(code==='23502') t='Ada kolom wajib di database yang belum terisi: '+raw;
  else if(code==='23514') t='Nilai ditolak oleh aturan (CHECK constraint) di database: '+raw;
  else if(code==='22P02'||code==='22007'||code==='22008') t='Format data tidak sesuai tipe kolom di database: '+raw;
  else if(code==='42501'||/row-level security|permission denied/i.test(raw)) t='Ditolak oleh kebijakan keamanan (RLS) Supabase: role Anda belum diberi izin untuk aksi ini pada tabel students. Jalankan bagian RLS di supabase-students-setup.sql.';
  else if(code==='PGRST204'||/Could not find the .* column/i.test(raw)) t='Kolom tidak ditemukan di tabel students. Cocokkan ST_COLS dengan struktur tabel Anda (gunakan tombol Cek Skema). Detail: '+raw;
  else if(code==='42P01'||code==='PGRST205'||/does not exist|Could not find the table/i.test(raw)) t='Tabel tidak ditemukan di database: '+raw;
  else if(code==='PGRST301'||/JWT/i.test(raw)) t='Sesi login berakhir. Silakan keluar lalu masuk kembali.';
  else if(/Failed to fetch|NetworkError|Load failed/i.test(raw)) t='Tidak bisa terhubung ke Supabase. Periksa koneksi internet.';
  else t=raw;
  return t+(code?'  [kode: '+code+']':'');
}
function stShowMsg(text,type){
  const el=document.getElementById('dsMsg'); if(!el) return;
  if(!text){ el.innerHTML=''; return; }
  const c={error:['#FBE7E5','#C0392B'],info:['#E7F0F7','#1D6FA3'],warn:['#FCF1DE','#A5730C'],ok:['#E4F5EE','#1C7B5D']}[type||'info'];
  el.innerHTML='<div style="background:'+c[0]+';color:'+c[1]+';border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px;line-height:1.5">'+stEsc(text)+'</div>';
}

/* ---- Baca data (paginasi per 1000 baris karena batas default PostgREST) ---- */
function stFetchAll(table,select,orderCol){ return dbFetchAll(table,select,orderCol); }   /* implementasi di supabase-layer */
function stFromRow(r){
  const c=k=>r[ST_COLS[k]];
  const cls=stState.classes.find(x=>x.id===c('classId'));
  const jkRaw=String(c('jk')||'').trim().toUpperCase();
  stState.raw[r.id]=r;
  /* Nilai teks di-escape supaya aman dipakai di innerHTML modul lain. Nilai asli ada di stState.raw. */
  return {
    id:r.id, nama:stDash(c('nama')), nis:stEsc(c('nis')||''), nisn:stEsc(c('nisn')||''), nik:stDash(c('nik')),
    kelas:cls?stEsc(cls.nama):'-', jurusan:(cls&&cls.jurusan)?stEsc(cls.jurusan):'-', classId:c('classId')||null,
    jk:jkRaw.startsWith('P')?'P':(jkRaw.startsWith('L')?'L':''), status:c('status')?stEsc(c('status')):'Aktif', boarding:!!c('boarding'),
    asrama:stDash(c('asrama')), kamar:stDash(c('kamar')), musyrif:stDash(c('musyrif')),
    tempatLahir:stDash(c('tempatLahir')), tanggalLahir:c('tanggalLahir')?String(c('tanggalLahir')).slice(0,10):'',
    alamat:stDash(c('alamat')), noTelp:stDash(c('noTelp')), ayah:stDash(c('ayah')), ibu:stDash(c('ibu')),
    kontakOrtu:stDash(c('kontakOrtu')), alamatOrtu:stDash(c('alamatOrtu')), waliKelas:'-',
    tahunMasuk:stDash(c('tahunMasuk')), statusAkademik:stDash(c('statusAkademik'))
  };
}
async function stReload(opts){
  opts=opts||{}; const silent=!!opts.silent;
  const sb=stClient();
  if(!sb){ if(!silent) stShowMsg('Supabase belum terhubung (library gagal dimuat atau URL/key belum diisi).','error'); return false; }
  if(stState.loading) return false;
  stState.loading=true; const warns=[];
  try{
    try{ stState.classes=await stFetchAll(ST_CLASS_TABLE,'id,nama,jurusan','nama'); }
    catch(e1){
      if(stIsMissingColErr(e1)){ try{ stState.classes=await stFetchAll(ST_CLASS_TABLE,'id,nama','nama'); warns.push('Kolom classes.jurusan belum ada — jalankan supabase-core-schema.sql.'); }catch(e2){ stState.classes=[]; warns.push('Tabel classes: '+stErrMsg(e2)); } }
      else{ stState.classes=[]; warns.push('Tabel classes: '+stErrMsg(e1)); }
    }
    const rows=await stFetchAll(ST_TABLE,'*',ST_COLS.nama);
    stState.raw={}; stState.missing=null; stState.realCols=undefined; stState.fromDb=true;
    studentsData.length=0;
    rows.forEach(r=>studentsData.push(stFromRow(r)));
    if(!silent){
      if(warns.length) stShowMsg(warns.join(' | ')+' — filter/pilihan kelas bisa kosong.','warn');
      else stShowMsg(rows.length?'':'Tabel students terhubung, tetapi belum ada data siswa.', rows.length?'ok':'info');
    }
    stAfterDataChange();
    return true;
  }catch(e){
    console.error('stReload',e);
    if(!silent) stShowMsg('Gagal memuat data siswa: '+stErrMsg(e),'error');
    return false;
  }finally{ stState.loading=false; }
}
async function stManualReload(){ stShowMsg('Memuat ulang...','info'); const ok=await stReload({silent:false}); if(ok) showAcadToast('Data siswa dimuat ulang dari Supabase.'); }

/* ---- Refresh tampilan halaman Database Siswa setelah data berubah ---- */
function dsStatsArray(){
  const scoped=ksFilterStudents(studentsData);
  return [
    {color:'blue',val:scoped.length,label:'Total Siswa'},
    {color:'green',val:scoped.filter(s=>s.status==='Aktif').length,label:'Siswa Aktif'},
    {color:'indigo',val:scoped.filter(s=>s.jk==='L').length,label:'Siswa Laki-laki'},
    {color:'purple',val:scoped.filter(s=>s.jk==='P').length,label:'Siswa Perempuan'}
  ];
}
function stFillSelect(id,items){
  const sel=document.getElementById(id); if(!sel) return;
  const keep=sel.value; const first=sel.options[0]; sel.innerHTML=''; sel.appendChild(first);
  items.forEach(it=>{ const o=document.createElement('option'); o.value=it.value; o.textContent=it.label; sel.appendChild(o); });
  sel.value=keep;
}
function stAfterDataChange(){
  if(!document.getElementById('dsTableBody')) return;
  const st=document.getElementById('dsStats'); if(st) st.innerHTML=acadStatRowHtml(dsStatsArray());
  const kelas=stState.classes.length? stState.classes.map(c=>({value:stEsc(c.nama),label:c.nama})) : [...new Set(studentsData.map(s=>s.kelas))].filter(k=>k!=='-').map(k=>({value:k,label:k}));
  const jur=[...new Set(stState.classes.map(c=>c.jurusan).filter(Boolean))].sort().map(j=>({value:stEsc(j),label:j}));
  stFillSelect('dsKelas',kelas); stFillSelect('dsJurusan',jur);
  dsRenderTable();
}

/* ---- Formulir Tambah / Edit ---- */
function stOptHtml(list,selectedId){
  return '<option value="">— Pilih —</option>'+list.map(x=>'<option value="'+stEsc(x.id)+'"'+(String(x.id)===String(selectedId)?' selected':'')+'>'+stEsc(x.nama)+'</option>').join('');
}
function stFormHtml(id){
  const r=id?(stState.raw[id]||{}):{}; const v=k=>{ const x=r[ST_COLS[k]]; return x==null?'':stEsc(x); };
  const jk=String(r[ST_COLS.jk]||'').toUpperCase().startsWith('P')?'P':(r[ST_COLS.jk]?'L':'');
  const status=r[ST_COLS.status]||'Aktif'; const boarding=!!r[ST_COLS.boarding];
  const tgl=r[ST_COLS.tanggalLahir]?String(r[ST_COLS.tanggalLahir]).slice(0,10):'';
  return `
    <div id="stfNotice" style="display:none;background:#FCF1DE;color:#A5730C;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:12px;line-height:1.5"></div>
    <div id="stfError" style="display:none;background:#FBE7E5;color:#C0392B;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:12px;line-height:1.5"></div>
    <div class="dw-section">Identitas</div>
    <div class="dw-field-row">
      <div class="dw-field"><label>NIS *</label><input type="text" id="stfNis" value="${v('nis')}"></div>
      <div class="dw-field"><label>NISN</label><input type="text" id="stfNisn" value="${v('nisn')}"></div>
    </div>
    <div class="dw-field"><label>Nama Lengkap *</label><input type="text" id="stfNama" value="${v('nama')}"></div>
    <div class="dw-field-row">
      <div class="dw-field"><label>NIK</label><input type="text" id="stfNik" value="${v('nik')}"></div>
      <div class="dw-field"><label>Jenis Kelamin</label><select id="stfJk"><option value="">— Pilih —</option><option value="L"${jk==='L'?' selected':''}>Laki-laki</option><option value="P"${jk==='P'?' selected':''}>Perempuan</option></select></div>
    </div>
    <div class="dw-field-row">
      <div class="dw-field"><label>Tempat Lahir</label><input type="text" id="stfTempatLahir" value="${v('tempatLahir')}"></div>
      <div class="dw-field"><label>Tanggal Lahir</label><input type="date" id="stfTanggalLahir" value="${stEsc(tgl)}"></div>
    </div>
    <div class="dw-field"><label>Alamat</label><input type="text" id="stfAlamat" value="${v('alamat')}"></div>
    <div class="dw-field"><label>No. Telepon</label><input type="text" id="stfNoTelp" value="${v('noTelp')}"></div>
    <div class="dw-section">Akademik</div>
    <div class="dw-field-row">
      <div class="dw-field"><label>Kelas</label><select id="stfClass" onchange="stSyncJurusan()">${stOptHtml(stState.classes,r[ST_COLS.classId])}</select></div>
      <div class="dw-field"><label>Jurusan (mengikuti kelas)</label><input type="text" id="stfJurusan" disabled value="${stEsc((stState.classes.find(x=>String(x.id)===String(r[ST_COLS.classId]))||{}).jurusan||'')}"></div>
    </div>
    <div class="dw-field-row">
      <div class="dw-field"><label>Tahun Masuk</label><input type="text" id="stfTahunMasuk" value="${v('tahunMasuk')}" placeholder="2026"></div>
      <div class="dw-field"><label>Status Siswa</label><select id="stfStatus"><option${status==='Aktif'?' selected':''}>Aktif</option><option${status==='Non-Aktif'?' selected':''}>Non-Aktif</option></select></div>
    </div>
    <div class="dw-field"><label>Status Akademik</label><input type="text" id="stfStatusAkademik" value="${v('statusAkademik')}" placeholder="Contoh: Naik Kelas"></div>
    <div class="dw-section">Boarding</div>
    <div class="dw-field"><label>Tinggal di Asrama?</label><select id="stfBoarding" onchange="stToggleBoarding()"><option value="0"${boarding?'':' selected'}>Non-Boarding</option><option value="1"${boarding?' selected':''}>Boarding</option></select></div>
    <div id="stfBoardingWrap" style="display:${boarding?'':'none'}">
      <div class="dw-field-row">
        <div class="dw-field"><label>Asrama</label><input type="text" id="stfAsrama" value="${v('asrama')}"></div>
        <div class="dw-field"><label>Kamar</label><input type="text" id="stfKamar" value="${v('kamar')}"></div>
      </div>
      <div class="dw-field"><label>Musyrif/Musyrifah</label><input type="text" id="stfMusyrif" value="${v('musyrif')}"></div>
    </div>
    <div class="dw-section">Orang Tua / Wali</div>
    <div class="dw-field-row">
      <div class="dw-field"><label>Nama Ayah</label><input type="text" id="stfAyah" value="${v('ayah')}"></div>
      <div class="dw-field"><label>Nama Ibu</label><input type="text" id="stfIbu" value="${v('ibu')}"></div>
    </div>
    <div class="dw-field"><label>Kontak Orang Tua</label><input type="text" id="stfKontakOrtu" value="${v('kontakOrtu')}"></div>
    <div class="dw-field"><label>Alamat Orang Tua</label><input type="text" id="stfAlamatOrtu" value="${v('alamatOrtu')}"></div>
    <div class="dw-formfoot"><button class="btn-outline-sm" onclick="closeAcadDrawer()">Batal</button>
      <button class="btn-primary-sm" id="stfSubmit" onclick="stSubmit(${id?`'${stEsc(id)}'`:'null'})">${id?'Simpan Perubahan':'Simpan Siswa'}</button></div>`;
}
function stSyncJurusan(){ const c=stState.classes.find(x=>String(x.id)===document.getElementById('stfClass').value); document.getElementById('stfJurusan').value=(c&&c.jurusan)||''; }
function stToggleBoarding(){ document.getElementById('stfBoardingWrap').style.display=document.getElementById('stfBoarding').value==='1'?'':'none'; }
function stOpenForm(id){
  if(!stCanManage()){ showAcadToast('Anda tidak memiliki izin untuk mengelola data siswa.'); return; }
  if(id && !stState.raw[id]){ showAcadToast('Data siswa tidak ditemukan. Muat ulang halaman.'); return; }
  openAcadDrawer(id?'Edit Siswa':'Tambah Siswa',stFormHtml(id));
  stDetectColumns().then(stApplyMissingToForm).catch(e=>console.error('stDetectColumns',e));
}
function stFormError(text){
  const el=document.getElementById('stfError'); if(!el) return;
  el.textContent=text; el.style.display=text?'':'none';
  if(text){ const b=document.getElementById('acadDrawerBody'); if(b) b.scrollTop=0; }
}
function stReadForm(){
  const val=id=>{ const x=document.getElementById(id); return x?x.value.trim():''; };
  const orNull=x=>x===''?null:x;
  const boarding=document.getElementById('stfBoarding').value==='1';
  const p={};
  p[ST_COLS.nama]=val('stfNama'); p[ST_COLS.nis]=val('stfNis'); p[ST_COLS.nisn]=orNull(val('stfNisn')); p[ST_COLS.nik]=orNull(val('stfNik'));
  p[ST_COLS.jk]=val('stfJk'); p[ST_COLS.tempatLahir]=orNull(val('stfTempatLahir')); p[ST_COLS.tanggalLahir]=orNull(val('stfTanggalLahir'));
  p[ST_COLS.alamat]=orNull(val('stfAlamat')); p[ST_COLS.noTelp]=orNull(val('stfNoTelp'));
  p[ST_COLS.classId]=orNull(val('stfClass'));
  p[ST_COLS.tahunMasuk]=orNull(val('stfTahunMasuk')); p[ST_COLS.status]=val('stfStatus'); p[ST_COLS.statusAkademik]=orNull(val('stfStatusAkademik'));
  p[ST_COLS.boarding]=boarding;
  p[ST_COLS.asrama]=boarding?orNull(val('stfAsrama')):null; p[ST_COLS.kamar]=boarding?orNull(val('stfKamar')):null; p[ST_COLS.musyrif]=boarding?orNull(val('stfMusyrif')):null;
  p[ST_COLS.ayah]=orNull(val('stfAyah')); p[ST_COLS.ibu]=orNull(val('stfIbu')); p[ST_COLS.kontakOrtu]=orNull(val('stfKontakOrtu')); p[ST_COLS.alamatOrtu]=orNull(val('stfAlamatOrtu'));
  if(stState.missing) stState.missing.forEach(k=>{ if(!ST_REQUIRED_KEYS.includes(k)) delete p[ST_COLS[k]]; });
  return p;
}
let __stSubmitting=false;
async function stSubmit(id){
  if(__stSubmitting) return;
  if(!stCanManage()){ stFormError('Anda tidak memiliki izin untuk menyimpan data siswa.'); return; }
  const sb=stClient(); if(!sb){ stFormError('Supabase belum terhubung.'); return; }
  const payload=stReadForm();
  if(!payload[ST_COLS.nama]){ stFormError('Nama lengkap wajib diisi.'); return; }
  if(!payload[ST_COLS.nis]){ stFormError('NIS wajib diisi.'); return; }
  if(!(stState.missing&&stState.missing.has('jk')) && !payload[ST_COLS.jk]){ stFormError('Jenis kelamin wajib dipilih.'); return; }
  stFormError('');
  __stSubmitting=true; const btn=document.getElementById('stfSubmit'); if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }
  try{
    let res, skipped=[];
    for(let attempt=0; attempt<10; attempt++){
      res=id? await sb.from(ST_TABLE).update(payload).eq('id',id).select()
            : await sb.from(ST_TABLE).insert(payload).select();
      const e=res.error;
      if(stIsMissingColErr(e)){
        const m=/'([^']+)' column/i.exec(e.message||'')||/column "?(?:students\.)?([A-Za-z0-9_]+)"? /i.exec(e.message||'');
        const col=m&&m[1]; const key=Object.keys(ST_COLS).find(k=>ST_COLS[k]===col);
        if(key&&!ST_REQUIRED_KEYS.includes(key)&&(col in payload)){
          delete payload[col]; skipped.push(col);
          (stState.missing=stState.missing||new Set()).add(key); continue;
        }
      }
      break;
    }
    if(res.error) throw res.error;
    /* RLS yang memblokir UPDATE tidak melempar error — hanya 0 baris berubah. Cek eksplisit. */
    if(!res.data||!res.data.length){
      throw {code:'42501',message:id?'Tidak ada baris yang berubah: data tidak ditemukan atau update diblokir RLS.':'Insert tidak mengembalikan data: kebijakan RLS (INSERT/SELECT) kemungkinan memblokir.'};
    }
    closeAcadDrawer();
    showAcadToast((id?'Data siswa berhasil diperbarui.':'Siswa baru berhasil disimpan.')+(skipped.length?' Kolom tidak ada di database dan dilewati: '+skipped.join(', ')+'.':''));
    await stReload({silent:false});
  }catch(e){
    console.error('stSubmit',e);
    const m=stErrMsg(e,id?'ubah':'tambah');
    stFormError('Gagal menyimpan: '+m); showAcadToast('Gagal menyimpan data siswa.');
  }finally{
    __stSubmitting=false; const b2=document.getElementById('stfSubmit'); if(b2){ b2.disabled=false; b2.textContent=id?'Simpan Perubahan':'Simpan Siswa'; }
  }
}

/* ---- Hapus dengan konfirmasi ---- */
function stConfirmDelete(id){
  if(!stCanManage()){ showAcadToast('Anda tidak memiliki izin untuk menghapus data siswa.'); return; }
  const r=stState.raw[id]; if(!r){ showAcadToast('Data siswa tidak ditemukan. Muat ulang halaman.'); return; }
  openAcadConfirm('Hapus Siswa','Yakin ingin menghapus "'+(r[ST_COLS.nama]||'-')+'" (NIS '+(r[ST_COLS.nis]||'-')+') secara permanen dari database? Tindakan ini tidak dapat dibatalkan.',()=>stDelete(id));
}
async function stDelete(id){
  const sb=stClient(); if(!sb){ showAcadToast('Supabase belum terhubung.'); return; }
  try{
    const {data,error}=await sb.from(ST_TABLE).delete().eq('id',id).select();
    if(error) throw error;
    if(!data||!data.length) throw {code:'42501',message:'Tidak ada baris yang terhapus: data sudah tidak ada atau penghapusan diblokir RLS.'};
    showAcadToast('Siswa berhasil dihapus.');
    await stReload({silent:false});
  }catch(e){
    console.error('stDelete',e);
    stShowMsg('Gagal menghapus: '+stErrMsg(e,'hapus'),'error'); showAcadToast('Gagal menghapus siswa.');
  }
}

/* ---- Cek skema: setiap kolom di ST_COLS diuji satu per satu ---- */
async function stSchemaCheck(){
  const sb=stClient(); if(!sb){ showAcadToast('Supabase belum terhubung.'); return; }
  openAcadDrawer('Cek Skema Tabel students','<p class="dw-para">Memeriksa kolom...</p>');
  const rows=[];
  for(const [key,col] of Object.entries(ST_COLS)){
    const {error}=await sb.from(ST_TABLE).select(col).limit(1);
    rows.push({key,col,ok:!error,err:error?stErrMsg(error):''});
  }
  const tables=[];
  for(const t of [ST_CLASS_TABLE]){
    const {error}=await sb.from(t).select('id,nama,jurusan').limit(1);
    tables.push({t,ok:!error,err:error?stErrMsg(error):''});
  }
  const bad=rows.filter(r=>!r.ok);
  stState.realCols=undefined; const real=await stRealColumns();
  document.getElementById('acadDrawerBody').innerHTML=
    '<p class="dw-para">'+(bad.length?'<b style="color:#C0392B">'+bad.length+' kolom bermasalah.</b> Ubah nilai terkait di ST_COLS, atau tambahkan kolomnya lewat SQL setelah Anda memeriksa struktur tabel.':'<b style="color:#1C7B5D">Semua kolom di ST_COLS terbaca.</b> (Ini hanya menguji izin baca; izin tulis diuji saat menyimpan.)')+'</p>'+
    '<div class="dw-section">Kolom yang benar-benar ada di tabel students</div><p class="dw-para">'+(real?stEsc(real.join(', ')):'Tidak bisa dibaca otomatis. Jalankan di SQL Editor: '+stEsc(ST_SQL_HINT))+'</p>'+
    '<div class="dw-section">Tabel pendukung</div>'+
    tables.map(t=>dwRow(t.t,t.ok?'OK':'<span style="color:#C0392B">'+stEsc(t.err)+'</span>')).join('')+
    '<div class="dw-section">Kolom students</div>'+
    rows.map(r=>dwRow(stEsc(r.key)+' → '+stEsc(r.col),r.ok?'OK':'<span style="color:#C0392B">'+stEsc(r.err)+'</span>')).join('');
}
</script>
